name: v3 EKS 기반 CloudFormation

# PR은 lint만 실행합니다. 스택은 main에서 수동으로 README의 순서(eks -> network-addons -> system-node -> dns-addon -> controller-iam -> storage-addon)대로 실행합니다.
on:
  pull_request:
    paths:
      - infra/v3/**
      - .github/workflows/infra-v3-cfn.yml
  workflow_dispatch:
    inputs:
      stack:
        type: choice
        options: [eks, network-addons, system-node, dns-addon, controller-iam, storage-addon, dev-pod-sg, stage-pod-sg, dev-data-access, dev-app-iam, edge-cert, edge, observability]
      mode:
        description: plan은 change set만 만들고, apply는 가장 최근 plan의 change set을 실행합니다.
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: cfn-lint
        run: |
          pipx install cfn-lint
          cfn-lint --regions "$AWS_REGION" -- infra/v3/cloudformation/*.yaml

  operate:
    needs: lint
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # 스택 작업이 겹치지 않게 하나씩 실행합니다.
    concurrency:
      group: infra-v3-cfn
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CFN_DEPLOY_ROLE_ARN }}
          # CloudFront 인증서(edge-cert)만 us-east-1에 둡니다.
          aws-region: ${{ inputs.stack == 'edge-cert' && 'us-east-1' || env.AWS_REGION }}
      # 새 스택은 plan 뒤 REVIEW_IN_PROGRESS라서 새 change set을 만들 수 없으므로, apply는 plan이 만든 change set을 실행합니다.
      - name: 최근 plan의 change set 찾기
        if: inputs.mode == 'apply'
        id: plan
        run: |
          name=$(aws cloudformation list-change-sets --stack-name "dameokja-v3-${{ inputs.stack }}" \
            --query "reverse(sort_by(Summaries[?ExecutionStatus=='AVAILABLE'], &CreationTime))[0].ChangeSetName" --output text)
          if [ -z "$name" ] || [ "$name" = None ]; then echo "::error::실행할 change set이 없습니다. plan을 먼저 실행하세요."; exit 1; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: ${{ inputs.mode }} dameokja-v3-${{ inputs.stack }}
        id: cs
        uses: aws-actions/aws-cloudformation-github-deploy@v2.0.0
        with:
          mode: ${{ inputs.mode == 'plan' && 'create-only' || 'execute-only' }}
          execute-change-set-id: ${{ steps.plan.outputs.name }}
          name: dameokja-v3-${{ inputs.stack }}
          template: infra/v3/cloudformation/${{ inputs.stack }}.yaml
          parameter-overrides: file:///${{ github.workspace }}/infra/v3/params/${{ inputs.stack }}.json
          change-set-name: v3-${{ inputs.stack }}-${{ github.run_number }}
          role-arn: ${{ vars.AWS_CFN_EXEC_ROLE_ARN }}
          # dev-app-iam은 앱 values가 ARN을 적어 두므로 역할 이름을 고정합니다.
          capabilities: CAPABILITY_NAMED_IAM
          fail-on-empty-changeset: false
      - name: 변경 내용 요약
        if: always()
        env:
          BODY: ${{ steps.cs.outputs.changes-markdown || '변경 없음' }}
        run: echo "$BODY" >> "$GITHUB_STEP_SUMMARY"
