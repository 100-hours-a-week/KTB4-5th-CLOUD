name: prod 배포 추가 승인
run-name: "prod ${{ inputs.repository }} ${{ inputs.run_id }}.${{ inputs.run_attempt }} ${{ inputs.image }}"

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 배포를 요청한 FE·BE·AI 저장소
        required: true
        type: choice
        options: [KTB4-5th-FE, KTB4-5th-BE, KTB4-5th-AI]
      run_id:
        description: stage 배포를 완료한 Actions 실행 ID
        required: true
        type: string
      run_attempt:
        description: 요청 실행의 재시도 번호
        required: true
        type: string
      image:
        description: stage에서 검증한 이미지 digest
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 요청 실행과 stage 성공 확인
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO: ${{ inputs.repository }}
          RUN_ID: ${{ inputs.run_id }}
          RUN_ATTEMPT: ${{ inputs.run_attempt }}
          IMAGE: ${{ inputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          case "$SOURCE_REPO" in
            KTB4-5th-FE|KTB4-5th-BE)
              workflow='.github/workflows/v1-cicd.yml'
              requests='["앱 prod 승인 및 CLOUD 승인 요청"]'
              ;;
            KTB4-5th-AI)
              workflow='.github/workflows/ai-cicd.yml'
              # 전환 중인 기존 AI 실행과 CLOUD 승인만 사용하는 새 실행을 모두 지원한다.
              requests='["앱 prod 승인 및 CLOUD 승인 요청", "CLOUD prod 승인 요청"]'
              ;;
            *) exit 1 ;;
          esac
          [[ "$RUN_ID" =~ ^[0-9]+$ && "$RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          expected="ghcr.io/100-hours-a-week/${SOURCE_REPO,,}@sha256:"
          [[ "$IMAGE" == "$expected"* && "${IMAGE#"$expected"}" =~ ^[a-f0-9]{64}$ ]]
          source="repos/100-hours-a-week/$SOURCE_REPO/actions/runs/$RUN_ID"
          gh api "$source" | jq -e --arg path "$workflow" --argjson attempt "$RUN_ATTEMPT" '
            .event == "push" and .head_branch == "main" and
            .path == $path and .run_attempt == $attempt'
          # 재실행의 과거 성공 job을 승인 근거로 사용하지 않는다.
          # 요청 job이 dispatch 직후 종료될 때까지 기다린다. AI의 최종 승인은 CLOUD에서만 받는다.
          verified=false
          for ((i=0; i<20; i++)); do
            jobs=$(gh api --paginate "$source/attempts/$RUN_ATTEMPT/jobs?per_page=100" --slurp)
            if jq -e --argjson requests "$requests" '[.[].jobs[]] |
              any(.name == "v2 stage 배포 / deploy" and .conclusion == "success") and
              any(.name as $name | ($requests | index($name)) != null and .conclusion == "success")' <<< "$jobs"; then
              verified=true
              break
            fi
            sleep 5
          done
          [[ "$verified" == true ]] || { echo 'stage 성공 또는 CLOUD 배포 요청 성공을 확인하지 못했습니다.'; exit 1; }
          {
            echo '### prod 배포 승인 대상'
            printf -- '- 요청 실행: https://github.com/100-hours-a-week/%s/actions/runs/%s/attempts/%s\n' "$SOURCE_REPO" "$RUN_ID" "$RUN_ATTEMPT"
            printf -- '- 이미지: `%s`\n' "$IMAGE"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: CLOUD prod 승인 및 ECS 배포
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: prod
    permissions:
      contents: read
      id-token: write
    # 같은 prod Task를 FE·BE가 공유하더라도 서로의 이미지를 덮어쓰지 않는다.
    concurrency:
      group: ecs-prod-${{ inputs.repository == 'KTB4-5th-AI' && 'ai' || 'app' }}
      cancel-in-progress: false
    # stage(ecs-deploy.yml)와 같은 방식: infra/v2/ecs/prod/<service>.json으로 Task Definition 새 버전을 등록하고 Service를 그 버전으로 바꿈.
    # 다른 점은 GitHub Environments "prod" 승인 뒤에 실행되고, stage에서 검증한 이미지 digest만 쓴다는 것
    env:
      CLUSTER: dameokja-prod
      SERVICE: dameokja-prod-${{ inputs.repository == 'KTB4-5th-AI' && 'ai' || 'app' }}
      FILE: cloud/infra/v2/ecs/prod/${{ inputs.repository == 'KTB4-5th-AI' && 'ai' || 'app' }}.json
      CONTAINER: ${{ inputs.repository == 'KTB4-5th-FE' && 'frontend' || (inputs.repository == 'KTB4-5th-BE' && 'backend' || 'ai') }}
      IMAGE: ${{ inputs.image }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: 100-hours-a-week/KTB4-5th-CLOUD
          ref: main
          path: cloud
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::906462447513:role/dameokja-prod-github-ecs-deploy
          aws-region: ap-northeast-2
      - name: Task Definition 등록
        id: register
        run: |
          # app은 BE·FE가 같은 Task를 써서 두 저장소의 배포가 겹칠 수 있음. 진행 중인 배포가 끝난 뒤 지금 상태를 읽음
          while [ "$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
            --query "length(services[?status=='ACTIVE'].deployments[] | [?rolloutState=='IN_PROGRESS'])" --output text)" != 0 ]; do
            echo "진행 중인 배포를 기다리는 중"; sleep 15
          done
          current=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[?status==`ACTIVE`]|[0].taskDefinition' --output text)
          # 지정한 컨테이너만 stage에서 검증한 이미지로 바꾸고, 다른 앱 이미지(ghcr.io)는 지금 돌고 있는 이미지를 유지.
          # nginx 같은 공개 이미지는 JSON에 적힌 이미지를 그대로 씀
          running='{}'
          if [ "$current" != None ]; then
            running=$(aws ecs describe-task-definition --task-definition "$current" \
              --query 'taskDefinition.containerDefinitions' --output json | jq 'map({(.name): .image}) | add')
          fi
          jq --argjson running "$running" --arg target "$CONTAINER" --arg image "$IMAGE" '
            .containerDefinitions |= map(
              if .name == $target and $image != "" then .image = $image
              elif (.image | startswith("ghcr.io/")) and $running[.name] then .image = $running[.name]
              else . end)' "$FILE" > td.json
          arn=$(aws ecs register-task-definition --cli-input-json file://td.json \
            --query taskDefinition.taskDefinitionArn --output text)
          echo "등록: $arn"
          jq -r '.containerDefinitions[] | "  \(.name): \(.image)"' td.json
          echo "arn=$arn" >> "$GITHUB_OUTPUT"
          echo "service-exists=$([ "$current" != None ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Service 갱신 후 완료 대기
        if: steps.register.outputs.service-exists == 'true'
        env:
          ARN: ${{ steps.register.outputs.arn }}
        run: |
          id=$(aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --task-definition "$ARN" \
            --query 'service.deployments[?status==`PRIMARY`]|[0].id' --output text)
          while sleep 15; do
            state=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
              --query "services[0].deployments[?id=='$id']|[0].rolloutState" --output text)
            echo "$id: $state"
            case "$state" in
              COMPLETED) exit 0 ;;
              IN_PROGRESS) ;;
              *) echo "배포 실패. ECS 이벤트:"
                 aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
                   --query 'services[0].events[:10].message' --output text
                 exit 1 ;;
            esac
          done
