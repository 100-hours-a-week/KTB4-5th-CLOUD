name: prod 배포 추가 승인
run-name: "prod ${{ inputs.repository }} ${{ inputs.run_id }}.${{ inputs.run_attempt }} ${{ inputs.image }}"

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 배포를 요청한 FE·BE·AI 저장소
        required: true
        type: choice
        options: [KTB4-5th-FE, KTB4-5th-BE, KTB4-5th-AI]
      run_id:
        description: stage 배포를 완료한 Actions 실행 ID
        required: true
        type: string
      run_attempt:
        description: 요청 실행의 재시도 번호
        required: true
        type: string
      image:
        description: stage에서 검증한 이미지 digest
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 요청 실행과 stage 성공 확인
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO: ${{ inputs.repository }}
          RUN_ID: ${{ inputs.run_id }}
          RUN_ATTEMPT: ${{ inputs.run_attempt }}
          IMAGE: ${{ inputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          case "$SOURCE_REPO" in
            KTB4-5th-FE|KTB4-5th-BE)
              workflow='.github/workflows/v1-cicd.yml'
              requests='["앱 prod 승인 및 CLOUD 승인 요청"]'
              ;;
            KTB4-5th-AI)
              workflow='.github/workflows/ai-cicd.yml'
              # 전환 중인 기존 AI 실행과 CLOUD 승인만 사용하는 새 실행을 모두 지원한다.
              requests='["앱 prod 승인 및 CLOUD 승인 요청", "CLOUD prod 승인 요청"]'
              ;;
            *) exit 1 ;;
          esac
          [[ "$RUN_ID" =~ ^[0-9]+$ && "$RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          expected="ghcr.io/100-hours-a-week/${SOURCE_REPO,,}@sha256:"
          [[ "$IMAGE" == "$expected"* && "${IMAGE#"$expected"}" =~ ^[a-f0-9]{64}$ ]]
          source="repos/100-hours-a-week/$SOURCE_REPO/actions/runs/$RUN_ID"
          gh api "$source" | jq -e --arg path "$workflow" --argjson attempt "$RUN_ATTEMPT" '
            .event == "push" and .head_branch == "main" and
            .path == $path and .run_attempt == $attempt'
          # 재실행의 과거 성공 job을 승인 근거로 사용하지 않는다.
          # 요청 job이 dispatch 직후 종료될 때까지 기다린다. AI의 최종 승인은 CLOUD에서만 받는다.
          verified=false
          for ((i=0; i<20; i++)); do
            jobs=$(gh api --paginate "$source/attempts/$RUN_ATTEMPT/jobs?per_page=100" --slurp)
            if jq -e --argjson requests "$requests" '[.[].jobs[]] |
              any(.name == "v2 stage 배포 / deploy" and .conclusion == "success") and
              any(.name as $name | ($requests | index($name)) != null and .conclusion == "success")' <<< "$jobs"; then
              verified=true
              break
            fi
            sleep 5
          done
          [[ "$verified" == true ]] || { echo 'stage 성공 또는 CLOUD 배포 요청 성공을 확인하지 못했습니다.'; exit 1; }
          {
            echo '### prod 배포 승인 대상'
            printf -- '- 요청 실행: https://github.com/100-hours-a-week/%s/actions/runs/%s/attempts/%s\n' "$SOURCE_REPO" "$RUN_ID" "$RUN_ATTEMPT"
            printf -- '- 이미지: `%s`\n' "$IMAGE"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: CLOUD prod 승인 및 ECS 배포
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: prod
    permissions:
      contents: read
      id-token: write
    # 같은 prod Task를 FE·BE가 공유하더라도 서로의 이미지를 덮어쓰지 않는다.
    # 서비스 이름은 stage(ecs-deploy.yml)처럼 직접 적는다. FE·BE는 nginx+FE+BE가 한 Task인 app, AI는 ai
    concurrency:
      group: prod-ecs-${{ inputs.repository == 'KTB4-5th-AI' && 'dameokja-prod-ai' || 'dameokja-prod-app' }}
      cancel-in-progress: false
    env:
      CLUSTER: dameokja-prod
      SERVICE: ${{ inputs.repository == 'KTB4-5th-AI' && 'dameokja-prod-ai' || 'dameokja-prod-app' }}
      CONTAINER: ${{ inputs.repository == 'KTB4-5th-FE' && 'frontend' || (inputs.repository == 'KTB4-5th-BE' && 'backend' || 'ai') }}
      IMAGE: ${{ inputs.image }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::906462447513:role/dameokja-prod-github-ecs-deploy
          aws-region: ap-northeast-2
      - name: prod Task Definition 이미지 교체
        id: task
        run: |
          set -euo pipefail
          # 기존 서비스가 안정화된 후 현재 정의를 읽어 다른 컨테이너 설정을 보존한다.
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
          aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" > service.json
          jq -e '.failures | length == 0' service.json
          jq -e '.services | length == 1' service.json
          jq -e '.services[0] | .status == "ACTIVE" and .desiredCount > 0 and .deploymentController.type == "ECS"' service.json
          current=$(jq -r '.services[0].taskDefinition' service.json)
          aws ecs describe-task-definition --task-definition "$current" > current.json
          jq -e --arg target "$CONTAINER" '.taskDefinition |
            (.runtimePlatform.cpuArchitecture // "X86_64") == "X86_64" and
            ([.containerDefinitions[] | select(.name == $target)] | length == 1)' current.json
          jq --arg target "$CONTAINER" --arg image "$IMAGE" '.taskDefinition |
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .deregisteredAt) |
            .containerDefinitions |= map(if .name == $target then .image = $image else . end)' current.json > td.json
          arn=$(aws ecs register-task-definition --cli-input-json file://td.json --query taskDefinition.taskDefinitionArn --output text)
          echo "arn=$arn" >> "$GITHUB_OUTPUT"
      - name: prod 서비스 갱신 및 성공 확인
        env:
          TASK_ARN: ${{ steps.task.outputs.arn }}
        run: |
          set -euo pipefail
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --task-definition "$TASK_ARN" > deployment.json
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
          # 롤백으로 안정화된 경우를 새 이미지 배포 성공으로 처리하지 않는다.
          aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" |
            jq -e --arg task "$TASK_ARN" '.services[0] |
              .taskDefinition == $task and .runningCount == .desiredCount and
              any(.deployments[]; .status == "PRIMARY" and .taskDefinition == $task and .rolloutState == "COMPLETED")'
