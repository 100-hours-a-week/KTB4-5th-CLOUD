name: 임시 environment 확인 (불리는 쪽)
on:
  workflow_call:
    inputs:
      env:
        type: string
        required: true
jobs:
  check:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.env == 'prod' && 'prod' || '' }}
    permissions:
      id-token: write
    steps:
      - name: OIDC sub 출력
        run: |
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r .value | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{sub, environment, ref}' || true
