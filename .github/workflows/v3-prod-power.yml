name: v3 prod 켜기·끄기

# v3 prod(앱·Redis·Kafka, prod DB EC2)를 매일 13~18시(KST)에만 켭니다. 수동 실행도 됩니다.
# 러너는 사설 EKS API에 닿지 않아 SSM으로 시스템 Node에서 v3/environments/prod/power.sh를 실행합니다(권한은 prod-power 스택·prod Role).
# 켜기: DB 시작 → power.sh start → https://dameokja.com 200 확인. 끄기: power.sh stop → DB 중지. prod Node는 Karpenter가 만들고 지웁니다.
# schedule은 UTC이고 GitHub 부하에 따라 몇 분~수십 분 늦게 시작될 수 있습니다. 켜기는 Node·Kafka 준비(약 10분)를 감안해 12:35에 시작합니다.
on:
  schedule:
    - cron: '35 3 * * *'   # 12:35 KST 켜기
    - cron: '0 9 * * *'    # 18:00 KST 끄기
  workflow_dispatch:
    inputs:
      action:
        description: start 또는 stop
        type: choice
        options: [start, stop]
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: v3-prod-power
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  # schedule에는 inputs가 없어 cron 문자열로 켜기·끄기를 고릅니다(위 cron과 같은 문자열).
  ACTION: ${{ inputs.action || (github.event.schedule == '35 3 * * *' && 'start') || 'stop' }}

jobs:
  power:
    if: github.ref_name == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::906462447513:role/dameokja-v3-prod-github-power
          aws-region: ${{ env.AWS_REGION }}
      - name: 대상 찾기
        run: |
          [[ $ACTION == start || $ACTION == stop ]] || { echo "알 수 없는 동작: $ACTION"; exit 1; }
          id() { aws ec2 describe-instances --filters "Name=tag:Name,Values=$1" "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query 'Reservations[].Instances[].InstanceId' --output text; }
          node=$(id dameokja-v3-system); db=$(id dameokja-v3-prod-db)
          [[ $node =~ ^i-[0-9a-f]+$ && $db =~ ^i-[0-9a-f]+$ ]] || { echo "인스턴스를 하나씩 찾지 못했습니다: node=$node db=$db"; exit 1; }
          echo "NODE=$node" >> "$GITHUB_ENV"; echo "DB=$db" >> "$GITHUB_ENV"
          echo "동작: $ACTION (이벤트 ${{ github.event_name }})"
      - name: DB 시작
        if: env.ACTION == 'start'
        run: |
          aws ec2 start-instances --instance-ids "$DB" > /dev/null
          aws ec2 wait instance-status-ok --instance-ids "$DB"
      - name: prod ${{ env.ACTION }}
        run: |
          script=$(base64 -w0 v3/environments/prod/power.sh)
          cmd=$(aws ssm send-command --instance-ids "$NODE" --document-name AWS-RunShellScript \
            --parameters "{\"commands\":[\"echo $script | base64 -d > /tmp/prod-power.sh && bash /tmp/prod-power.sh $ACTION; rc=\$?; rm -f /tmp/prod-power.sh; exit \$rc\"],\"executionTimeout\":[\"3000\"]}" \
            --query Command.CommandId --output text)
          for i in $(seq 1 330); do
            st=$(aws ssm get-command-invocation --command-id "$cmd" --instance-id "$NODE" --query Status --output text 2>/dev/null || echo Pending)
            case $st in Pending|InProgress|Delayed) sleep 10 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$cmd" --instance-id "$NODE" --query '[StandardOutputContent,StandardErrorContent]' --output text
          [[ $st == Success ]] || { echo "실행 결과: $st"; exit 1; }
      - name: DB 중지
        if: env.ACTION == 'stop'
        run: |
          aws ec2 stop-instances --instance-ids "$DB" > /dev/null
          aws ec2 wait instance-stopped --instance-ids "$DB"
      - name: 사이트 확인
        if: env.ACTION == 'start'
        run: |
          # ALB Target 등록·health check가 끝날 때까지 최대 5분 기다립니다.
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://dameokja.com || true)
            [[ $code == 200 ]] && { echo "https://dameokja.com $code"; exit 0; }
            sleep 10
          done
          echo "https://dameokja.com 응답 $code"; exit 1
