name: 인프라 설정 검사

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: 배포 스크립트와 실패 복구 검사
        run: |
          bash -n v1/scripts/deploy-v1.sh
          python3 tests/test_deploy.py
      - name: ECS 환경변수 자동 주입 검사
        run: python3 -m unittest discover -s tests -p 'test_ecs_secrets.py' -v
      - name: Compose 설정 검사
        run: |
          docker compose -f v1/prod/compose.yaml config --quiet
          docker compose -f v1/dev/compose.yaml config --quiet
      - name: Nginx 설정 검사
        run: |
          certs=$(mktemp -d)
          trap 'rm -rf "$certs"' EXIT
          for domain in dameokja.com dev.dameokja.com; do
            mkdir -p "$certs/live/$domain"
            openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
              -subj "/CN=$domain" \
              -keyout "$certs/live/$domain/privkey.pem" \
              -out "$certs/live/$domain/fullchain.pem" 2>/dev/null
          done
          logs=$(mktemp -d)
          trap 'rm -rf "$certs" "$logs"' EXIT
          docker run --rm -v "$PWD/v1/prod/nginx:/etc/nginx/conf.d:ro" \
            -v "$certs:/etc/letsencrypt:ro" -v "$logs:/var/log/nginx/app" nginx:stable nginx -t
          docker run --rm -v "$PWD/v1/dev/nginx:/etc/nginx/conf.d:ro" \
            -v "$certs:/etc/letsencrypt:ro" -v "$logs:/var/log/nginx/app" nginx:stable nginx -t
