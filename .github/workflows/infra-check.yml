name: 인프라 설정 검사

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: 배포 스크립트와 실패 복구 검사
        run: |
          bash -n scripts/deploy-v1.sh
          python3 tests/test_deploy.py
      - name: Compose 설정 검사
        run: |
          docker compose --env-file .env.example -f prod-compose.yaml config --quiet
          docker compose --env-file .env.example -f dev-compose.yaml config --quiet
      - name: Nginx 설정 검사
        run: |
          certs=$(mktemp -d)
          trap 'rm -rf "$certs"' EXIT
          for domain in dameokja.com dev.dameokja.com; do
            mkdir -p "$certs/live/$domain"
            openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
              -subj "/CN=$domain" \
              -keyout "$certs/live/$domain/privkey.pem" \
              -out "$certs/live/$domain/fullchain.pem" 2>/dev/null
          done
          docker run --rm -v "$PWD/nginx-prod:/etc/nginx/conf.d:ro" \
            -v "$certs:/etc/letsencrypt:ro" nginx:stable nginx -t
          docker run --rm -v "$PWD/nginx-dev:/etc/nginx/conf.d:ro" \
            -v "$certs:/etc/letsencrypt:ro" nginx:stable nginx -t
