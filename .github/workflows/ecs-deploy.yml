name: v2 ECS 배포

# 종료됨. v2 ECS(dev·stage·prod)는 모두 v3 EKS로 전환했고 prod ECS 자원도 지웠습니다(#306, #321).
# BE v1-cicd.yml이 아직 호출하므로 입력 형식만 남기고, 호출되면 안내와 함께 실패합니다.
# 이전 설명: BE/FE/AI CI와 CLOUD가 함께 쓰는 배포 단계.
# infra/v2/ecs/<env>/<service>.json으로 Task Definition 새 버전을 등록하고 Service를 그 버전으로 바꿈.
# 실패하면 ECS가 이전 버전으로 되돌리고 이 작업도 실패로 끝남.
# 대상 이름은 입력으로 만듦: 클러스터 dameokja-<env>, 서비스 dameokja-<env>-<service>
# prod는 GitHub Environments "prod" 승인 뒤에만 실행 (prod 배포 역할은 CLOUD environment:prod만 믿음)
on:
  workflow_call:
    inputs:
      env:
        description: prod만 씁니다(dev는 종료, stage는 v3로 이전 #281)
        type: string
        default: dev
      service:
        description: "prod: app(나누는 중), backend, frontend, ai"
        type: string
        required: true
      container:
        description: 이미지를 바꿀 컨테이너. 비우면 첫 번째 컨테이너 (prod app은 frontend 또는 backend)
        type: string
        default: ""
      image:
        description: 배포할 이미지. 비우면 지금 돌고 있는 이미지 유지
        type: string
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: 종료된 v2 ECS 배포 차단
        env:
          ENV_NAME: ${{ inputs.env }}
          SERVICE_IN: ${{ inputs.service }}
        run: |
          echo "::error::v2 ECS 배포는 종료되었습니다(env=$ENV_NAME, service=$SERVICE_IN). dev는 v3-dev-image.yml, stage는 v3-stage-image.yml, prod는 prod-approval.yml → v3-prod-image.yml을 사용하세요."
          exit 1
