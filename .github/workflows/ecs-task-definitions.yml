name: v2 Task Definition 반영

# infra/v2/ecs/<env>/*.json이 main에 들어오면 바뀐 서비스만 다시 배포 (이미지는 지금 것 유지)
on:
  push:
    branches: [main]
    paths:
      - "infra/v2/ecs/dev/**"
      - "infra/v2/ecs/stage/**"
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.diff.outputs.targets }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: diff
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            files=$(ls infra/v2/ecs/dev/*.json infra/v2/ecs/stage/*.json)
          else
            files=$(git diff --name-only --diff-filter=d HEAD^ HEAD -- infra/v2/ecs/dev/ infra/v2/ecs/stage/)
          fi
          # infra/v2/ecs/stage/app.json -> {"env":"stage","service":"app"}
          targets=$(printf '%s\n' "$files" | grep '\.json$' \
            | jq -Rnc '[inputs | split("/") | {env: .[3], service: (.[4] | rtrimstr(".json"))}]')
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  deploy:
    needs: changes
    if: needs.changes.outputs.targets != '[]'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.changes.outputs.targets) }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/ecs-deploy.yml
    with:
      env: ${{ matrix.target.env }}
      service: ${{ matrix.target.service }}
