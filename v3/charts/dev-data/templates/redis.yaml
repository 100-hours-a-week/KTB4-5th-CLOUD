# 비밀번호는 dev의 cloud-secrets/REDIS_PASSWORD에서 읽습니다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: dev
data:
  redis.conf: |
{{ include "dev-data.redisConfig" . | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: dev
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: redis
  ports:
    - {name: redis, port: 6379, targetPort: redis}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: dev
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - {name: redis, port: 6379, targetPort: redis}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: dev
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  serviceName: redis-headless
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
      annotations:
        # 설정이 바뀌면 Pod를 다시 만들어 반영합니다.
        checksum/redis-config: {{ include "dev-data.redisConfig" . | sha256sum }}
    spec:
      nodeSelector:
        dameokja.com/node-role: app
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          command: [sh, -ec]
          args:
            - exec redis-server /etc/redis/redis.conf --requirepass "$REDISCLI_AUTH"
          env:
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef: {name: cloud-secrets, key: REDIS_PASSWORD}
          ports:
            - {name: redis, containerPort: 6379}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: 500m, memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            exec: {command: [sh, -ec, 'test "$(redis-cli --no-auth-warning ping)" = PONG']}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec: {command: [sh, -ec, 'test "$(redis-cli --no-auth-warning ping)" = PONG']}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec: {command: [sh, -ec, 'test "$(redis-cli --no-auth-warning ping)" = PONG']}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /etc/redis, readOnly: true}
      volumes:
        - name: config
          configMap:
            name: redis-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: redis-gp3
        resources:
          requests:
            storage: 10Gi
