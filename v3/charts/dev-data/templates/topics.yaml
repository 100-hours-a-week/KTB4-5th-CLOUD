{{- if .Values.topics.enabled }}
{{- range .Values.topics.suffixes }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: {{ printf "dev-dameokja-%s" . | replace "." "-" }}
  namespace: dev
  labels:
    strimzi.io/cluster: {{ $.Values.kafka.name }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  topicName: {{ printf "dev.dameokja.%s" . | quote }}
  partitions: 1
  replicas: 1
  config:
    cleanup.policy: delete
    retention.ms: 2592000000
{{- end }}
{{- end }}
