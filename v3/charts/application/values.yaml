name: ''
port: 8080
# Service ai-api·be·fe가 가리키는 색상. 다른 색상은 -blue·-green Service로만 닿습니다.
activeColor: blue
colors:
  blue: {image: '', replicas: 1}
  green: {image: '', replicas: 0}
# BE·AI는 Kafka Consumer·메모리 작업 큐가 있어 두 색상을 함께 띄우기 전에 중복 처리 검증이 필요합니다.
allowConcurrentConsumers: false
secretName: ''
# 앱 Secret 외에 envFrom으로 읽을 Secret(예: BE의 Redis 비밀번호 cloud-secrets)
extraSecretNames: []
imagePullSecret: ghcr-pull
iamRoleArn: ''
runAsUser: 10001
# 앱 Node 배치. stage는 stage-app Node의 라벨·taint에 맞춥니다.
nodeSelector:
  dameokja.com/node-role: app
tolerations: []
env: {}
resources: {}
startupProbe: {}
readinessProbe: {}
livenessProbe: {}
# BE DB 마이그레이션 PreSync Job(#310). BE 이미지에 Flyway 진입점이 들어간 뒤 환경별로 켭니다.
migration:
  enabled: false
  # 마이그레이션에 쓸 이미지의 색상. 비우면 activeColor. blue/green 전환 때는 새 이미지를 올린 색상으로 둡니다.
  fromColor: ''
  # Spring 컨텍스트 없이 Flyway만 실행하는 BE 진입점
  command:
    - java
    - -Duser.timezone=Asia/Seoul
    - -Dloader.main=com.dameokja.backend.migration.MigrationRunner
    - -cp
    - /app/app.jar
    - org.springframework.boot.loader.launch.PropertiesLauncher
  activeDeadlineSeconds: 600
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}
# tool Gateway에 붙일 경로. 비우면 HTTPRoute를 만들지 않습니다(AI는 BE 내부 연결만 사용).
route:
  hostname: ''
  pathPrefixes: []
  # ALB Target Group 헬스 체크(Pod IP 대상)
  healthCheckPath: ''
  healthCheckCodes: '200'
