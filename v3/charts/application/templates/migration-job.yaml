{{- with .Values.migration }}{{- if .enabled }}
{{- if ne $.Values.name "be" }}{{ fail "DB 마이그레이션 Job은 BE에만 둡니다." }}{{ end }}
{{- $color := default $.Values.activeColor .fromColor }}
{{- $image := (index $.Values.colors $color).image }}
{{- if not $image }}{{ fail (printf "마이그레이션에 쓸 %s 색상 이미지가 없습니다." $color) }}{{ end }}
---
# 앱 sync 전에 BE 이미지의 Flyway 진입점으로 DB 마이그레이션을 적용합니다(#310).
# 실패하면 sync가 멈춰 앱을 교체하지 않습니다. 실패한 Job은 다음 sync 직전까지 남아 로그를 볼 수 있습니다.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $.Values.name }}-db-migration
  namespace: {{ $.Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  # 재시도하지 않습니다. 실패 원인을 고친 뒤 다시 sync합니다.
  backoffLimit: 0
  activeDeadlineSeconds: {{ .activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        # BE와 같은 Pod SG·NetworkPolicy(DB 3306)를 받습니다. 색상 라벨이 없어 Service·Deployment에는 잡히지 않습니다.
        app.kubernetes.io/name: {{ $.Values.name }}
        dameokja.com/component: db-migration
    spec:
      restartPolicy: Never
      # PreSync는 앱 ServiceAccount보다 먼저 실행될 수 있어 기본 ServiceAccount를 씁니다(S3·Kubernetes API 불필요).
      automountServiceAccountToken: false
      nodeSelector:
        {{- toYaml $.Values.nodeSelector | nindent 8 }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      imagePullSecrets:
        - name: {{ $.Values.imagePullSecret }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ $.Values.runAsUser }}
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migration
          image: {{ $image | quote }}
          command:
            {{- toYaml .command | nindent 12 }}
          # SPRING_DATASOURCE_URL·USERNAME·PASSWORD를 앱과 같은 Secret에서 읽습니다.
          envFrom:
            - secretRef: {name: {{ $.Values.secretName }}}
          resources:
            {{- toYaml .resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
{{- end }}{{- end }}
