# 이미지는 digest로 고정합니다(2026-11-03 확인, linux/amd64 포함).
redis:
  image: docker.io/library/redis:8.6.4-alpine@sha256:2cc044fc5a07c9b701f8f1255a309ae9ad7856e694ac03513bf3648c01e40763
kafka:
  name: prod-kafka
  # 브로커·컨트롤러 겸용 수. 토픽 복제 수도 같은 값입니다.
  replicas: 3
  version: 4.2.2
  image: quay.io/strimzi/kafka:1.3.0-kafka-4.2.2@sha256:b9b9e37491ce17c1b2722b3668661de91430d9437acf18c5f5bafaef38138652
topics:
  # Kafka Ready를 확인한 뒤 true로 바꿉니다.
  enabled: false
  partitions: 3
  suffixes:
    - refrigerator.events.v1
    - push.dispatch.v1
    - analysis.requested.v1
    - analysis.completed.v1
    - analysis.feedback.v1
    - recommendation.requested.v1
    - recommendation.completed.v1
    # BE application.yml이 쓰는 토픽(자동 생성이 꺼져 있어 미리 만듭니다)
    - analysis.completed.v1.dlt
    - cooking.applied.v1
