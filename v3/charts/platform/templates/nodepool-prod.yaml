# prod 앱 Node. stage-app과 같은 사양이며 prod Pod만 받습니다.
# prod Pod는 nodeSelector dameokja.com/environment: prod와 아래 taint의 toleration을 함께 둡니다.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: prod-app
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - id: {{ .Values.appAmiId | quote }}
  role: {{ required "eks 스택의 AppNodeRoleName이 필요합니다." .Values.appNodeRoleName | quote }}
  subnetSelectorTerms:
    - id: {{ .Values.appSubnetId | quote }}
  securityGroupSelectorTerms:
    - id: {{ required "eks 스택의 WorkerSecurityGroupId가 필요합니다." .Values.workerSecurityGroupId | quote }}
  metadataOptions:
    httpEndpoint: enabled
    httpTokens: required
    httpPutResponseHopLimit: 1
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeType: gp3
        volumeSize: 30Gi
        encrypted: true
        deleteOnTermination: true
  # 이 태그는 Karpenter drift 해시에 들어가 바꾸면 prod 앱 Node가 교체됩니다.
  tags:
    Name: dameokja-v3-prod-app
    Project: dameokja
    Generation: v3
    Environment: prod
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: prod-app
spec:
  template:
    metadata:
      labels:
        dameokja.com/node-role: app
        dameokja.com/environment: prod
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: prod-app
      # dev·stage Pod가 prod Node에 올라가지 않게 막습니다.
      taints:
        - key: dameokja.com/environment
          value: prod
          effect: NoSchedule
      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values: [m7i.large]
        - key: topology.kubernetes.io/zone
          operator: In
          values: [ap-northeast-2b]
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]
      expireAfter: Never
  limits:
    cpu: {{ .Values.prodNodePool.limits.cpu | quote }}
    memory: {{ .Values.prodNodePool.limits.memory }}
  disruption:
    # prod는 빈 Node만 정리하고, 사용 중인 Node를 옮기지 않습니다(stage와 같음).
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m
    budgets:
      - nodes: "1"
