# stage 켜기·끄기(v3/environments/stage/power.sh)가 쓰는 권한입니다. stage-power 스택의 KubectlRole이 dameokja:stage-power 그룹으로 들어옵니다.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: stage-power
  namespace: stage
rules:
  # 시험용 HPA만 삭제할 수 있으며, 만들거나 다른 HPA를 바꿀 수는 없습니다.
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    resourceNames: [be-load-test]
    verbs: [get, delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments/scale, statefulsets/scale]
    verbs: [get, patch, update]
  # Kafka 조정 일시정지 annotation과 상태 확인
  - apiGroups: [kafka.strimzi.io]
    resources: [kafkas]
    verbs: [get, list, patch]
  - apiGroups: [core.strimzi.io]
    resources: [strimzipodsets]
    verbs: [get, list, delete]
  # 상태 확인용(켜기·끄기 결과 출력)
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: stage-power
  namespace: stage
subjects:
  - {kind: Group, name: 'dameokja:stage-power', apiGroup: rbac.authorization.k8s.io}
roleRef: {kind: Role, name: stage-power, apiGroup: rbac.authorization.k8s.io}
---
# 켜기 때 Argo stage 앱만 sync합니다(이름으로 제한).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: stage-power
  namespace: tool
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    resourceNames: [stage-secrets, stage-be, stage-ai-api, stage-fe]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: stage-power
  namespace: tool
subjects:
  - {kind: Group, name: 'dameokja:stage-power', apiGroup: rbac.authorization.k8s.io}
roleRef: {kind: Role, name: stage-power, apiGroup: rbac.authorization.k8s.io}
