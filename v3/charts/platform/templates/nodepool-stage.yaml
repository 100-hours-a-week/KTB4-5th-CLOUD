# stage 앱 Node. dev-app과 같은 사양이지만 stage Pod만 받습니다.
# stage Pod는 nodeSelector dameokja.com/environment: stage와 아래 taint의 toleration을 함께 둡니다.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: stage-app
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - id: {{ .Values.appAmiId | quote }}
  role: {{ required "eks 스택의 AppNodeRoleName이 필요합니다." .Values.appNodeRoleName | quote }}
  subnetSelectorTerms:
    - id: {{ .Values.appSubnetId | quote }}
  securityGroupSelectorTerms:
    - id: {{ required "eks 스택의 WorkerSecurityGroupId가 필요합니다." .Values.workerSecurityGroupId | quote }}
  metadataOptions:
    httpEndpoint: enabled
    httpTokens: required
    httpPutResponseHopLimit: 1
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeType: gp3
        volumeSize: 30Gi
        encrypted: true
        deleteOnTermination: true
  # 이 태그는 Karpenter drift 해시에 들어가 바꾸면 stage 앱 Node가 교체됩니다.
  tags:
    Name: dameokja-v3-stage-app
    Project: dameokja
    Generation: v3
    Environment: stage
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: stage-app
spec:
  template:
    metadata:
      labels:
        dameokja.com/node-role: app
        dameokja.com/environment: stage
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: stage-app
      # dev Pod(nodeSelector가 node-role만 지정)가 stage Node에 올라가지 않게 막습니다.
      taints:
        - key: dameokja.com/environment
          value: stage
          effect: NoSchedule
      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values: [m7i.large]
        - key: topology.kubernetes.io/zone
          operator: In
          values: [ap-northeast-2b]
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]
      expireAfter: Never
  limits:
    cpu: {{ .Values.stageNodePool.limits.cpu | quote }}
    memory: {{ .Values.stageNodePool.limits.memory }}
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m
    budgets:
      - nodes: "1"
