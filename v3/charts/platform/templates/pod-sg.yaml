{{- range $service, $group := .Values.podSecurityGroups }}
---
apiVersion: vpcresources.k8s.aws/v1beta1
kind: SecurityGroupPolicy
metadata:
  name: {{ $service }}
  namespace: dev
spec:
  podSelector:
    matchLabels:
      {{- if eq $service "kafka" }}
      strimzi.io/name: dev-kafka-kafka
      {{- else }}
      app.kubernetes.io/name: {{ $service }}
      {{- end }}
  securityGroups:
    groupIds: [{{ required (printf "dev-pod-sg 스택 Output이 필요합니다: %s" $service) $group | quote }}]
{{- end }}
