# 빈 값은 설치 때 스택 Output으로 넣습니다(infra/v3/README.md).
appNodeRoleName: ''
workerSecurityGroupId: ''
appSubnetId: subnet-0778204ce3b43756e
appAmiId: ami-0a3227d9c98935bcb
# dev-pod-sg 스택 Output(GatewayAlbSecurityGroupId)
gatewayAlbSecurityGroupId: ''
# 환경별 Pod SG 연결과 NetworkPolicy. Namespace 이름이 키입니다.
environments:
  dev:
    dbCidr: 172.31.4.192/32
    kafkaBrokers: 1
    # dev-pod-sg 스택 Output. 5개 모두 필요합니다.
    podSecurityGroups: {fe: '', be: '', ai-api: '', redis: '', kafka: ''}
  stage:
    # stage-db 스택 Output(DbPrivateIp)
    dbCidr: 10.20.38.0/32
    kafkaBrokers: 3
    # stage-pod-sg 스택 Output. 5개 모두 필요합니다.
    podSecurityGroups: {fe: '', be: '', ai-api: '', redis: '', kafka: ''}
# stage 앱 Node. stage Pod만 올라가도록 라벨·taint를 붙이고, stage Pod가 없으면 5분 뒤 0대가 됩니다.
stageNodePool:
  # stage 평시 FE·BE·AI 각 2와 Redis 1, Kafka 3(Node마다 1)을 넣고 HTTP Blue/Green 여유를 둔 상한입니다.
  limits: {cpu: '16', memory: 64Gi}
network:
  # EKS API ENI가 놓이는 Private Subnet 2개. ENI 주소는 EKS가 바꿀 수 있어 Subnet 단위로 엽니다.
  # Pod SG(branch ENI)를 쓰는 Pod(Kafka 브로커)는 Service 주소가 ENI 주소로 바뀐 뒤 판단돼 이 값만으로 API에 닿습니다(11/03 확인).
  apiEndpointCidrs: [10.20.32.0/20, 10.20.48.0/20]
  # kubernetes Service 주소. Pod SG가 없는 Pod(Entity Operator)는 바뀌기 전 주소로 판단돼
  # 이 값이 없으면 API SYN이 버려집니다(11/03 PolicyEndpoint·SYN_SENT로 확인).
  apiServiceIp: 192.168.0.1/32
  # Gateway ALB를 두는 Private Subnet 2개(eks 스택과 같음). ALB가 Pod로 보내는 출발 주소입니다.
  albSubnets:
    - {id: subnet-0778204ce3b43756e, cidr: 10.20.32.0/20}
    - {id: subnet-0f86136fb72318e11, cidr: 10.20.48.0/20}
