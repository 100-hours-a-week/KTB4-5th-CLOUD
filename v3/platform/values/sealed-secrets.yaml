# kubeseal이 기본으로 찾는 Controller 이름에 맞춥니다(--controller-namespace tool 필요).
fullnameOverride: sealed-secrets-controller
replicaCount: 1
nodeSelector:
  dameokja.com/node-role: system
tolerations:
- key: dameokja.com/system
  operator: Equal
  value: 'true'
  effect: NoSchedule
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi
