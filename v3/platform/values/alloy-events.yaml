# 이벤트를 DaemonSet에서 읽으면 Node 수만큼 중복되므로 단일 수집기를 둡니다.
alloy:
  configMap:
    content: |
      loki.source.kubernetes_events "cluster" {
        log_format = "json"
        forward_to = [loki.write.observability.receiver]
      }
      loki.write "observability" {
        endpoint {
          url = "http://10.20.32.213:3100/loki/api/v1/push"
        }
        external_labels = {cluster = "dameokja-v3", source = "kubernetes-events"}
      }
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {memory: 128Mi}
controller:
  type: deployment
  replicas: 1
  nodeSelector:
    dameokja.com/node-role: system
  tolerations:
    - {key: dameokja.com/system, operator: Equal, value: 'true', effect: NoSchedule}
rbac:
  # 차트가 두 목록을 이어 붙이므로 이벤트 읽기·감시 권한을 나눕니다.
  rules:
    - apiGroups: ['']
      resources: [events]
      verbs: [get, list]
  clusterRules:
    - apiGroups: ['']
      resources: [events]
      verbs: [watch]
