# prod 앱 전용 프로젝트입니다. prod Namespace에 앱 실행에 쓰는 종류만 만들 수 있습니다(stage-apps와 같은 범위).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: prod-apps
  namespace: tool
spec:
  sourceRepos:
  - https://github.com/100-hours-a-week/KTB4-5th-CLOUD.git
  destinations:
  - server: https://kubernetes.default.svc
    namespace: prod
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
  - {group: apps, kind: Deployment}
  - {group: '', kind: Service}
  - {group: '', kind: ConfigMap}
  - {group: '', kind: ServiceAccount}
  - {group: bitnami.com, kind: SealedSecret}
  - {group: gateway.networking.k8s.io, kind: HTTPRoute}
  - {group: gateway.k8s.aws, kind: TargetGroupConfiguration}
