# secrets는 수동 동기화입니다. 앱(fe·be·ai-api)은 CI가 이미지를 main에 커밋하면 자동 동기화합니다(#238).
# secrets를 먼저 동기화해야 앱 Pod가 Secret을 찾습니다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-secrets
  namespace: tool
spec:
  project: dev-apps
  source:
    repoURL: https://github.com/100-hours-a-week/KTB4-5th-CLOUD.git
    targetRevision: main
    path: v3/environments/dev/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    syncOptions:
    # 다른 Application이나 Helm이 만든 자원을 덮어쓰지 않습니다.
    - FailOnSharedResource=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-fe
  namespace: tool
spec:
  project: dev-apps
  source:
    repoURL: https://github.com/100-hours-a-week/KTB4-5th-CLOUD.git
    targetRevision: main
    path: v3/charts/application
    helm:
      releaseName: fe
      valueFiles:
      - ../../environments/dev/fe.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    # main 변경을 자동 반영하고, Chart에서 빠진 자원은 지웁니다.
    automated: {prune: true}
    syncOptions:
    # 다른 Application이나 Helm이 만든 자원을 덮어쓰지 않습니다.
    - FailOnSharedResource=true
---
