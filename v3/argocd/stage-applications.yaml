# stage는 secrets와 앱 모두 수동 동기화입니다. 이미지 갱신·자동 동기화는 prod 승인 흐름을 v3 stage로 옮길 때 정합니다.
# secrets를 먼저 동기화해야 앱 Pod가 Secret을 찾습니다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stage-secrets
  namespace: tool
spec:
  project: stage-apps
  source:
    repoURL: https://github.com/100-hours-a-week/KTB4-5th-CLOUD.git
    targetRevision: main
    path: v3/environments/stage/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: stage
  syncPolicy:
    syncOptions:
    # 다른 Application이나 Helm이 만든 자원을 덮어쓰지 않습니다.
    - FailOnSharedResource=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stage-fe
  namespace: tool
spec:
  project: stage-apps
  source:
    repoURL: https://github.com/100-hours-a-week/KTB4-5th-CLOUD.git
    targetRevision: main
    path: v3/charts/application
    helm:
      releaseName: fe
      valueFiles:
      - ../../environments/stage/fe.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: stage
  syncPolicy:
    syncOptions:
    # 다른 Application이나 Helm이 만든 자원을 덮어쓰지 않습니다.
    - FailOnSharedResource=true
---
