# 이미지는 v2 dev가 쓰던 것과 같은 digest입니다(6단계부터 CI가 갱신).
name: ai-api
port: 8000
colors:
  blue: {image: ghcr.io/100-hours-a-week/ktb4-5th-ai@sha256:3b04e623bcde824081308dc54f7f7d68dadd5692f09b1686808d01bb3314fce4, replicas: 1}
  green: {image: '', replicas: 0}
secretName: ai-secrets
iamRoleArn: arn:aws:iam::906462447513:role/dameokja-v3-dev-ai-api
# 이미지에 USER가 없어(root) 일반 사용자로 띄웁니다. 쓰기는 /tmp만 합니다.
runAsUser: 10001
# v2 dev와 달라지는 값만 둡니다. 같은 키는 ai-secrets에서 뺍니다(seal-secrets.sh).
env:
  CALLBACK_URL: http://be.dev.svc.cluster.local:8080/api/v1/internal/image-analyses/callback
  # 이미지의 /app은 root 소유라 로그는 /tmp(emptyDir)에 씁니다.
  LOG_DIR: /tmp/ai-logs
resources:
  requests: {cpu: 250m, memory: 512Mi}
  # v2 stage AI 태스크 메모리(infra/v2/ecs/stage/ai.json)
  limits: {cpu: '1', memory: 1536Mi}
startupProbe: {httpGet: {path: /health/live, port: 8000}, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 18}
# /health/ready는 X-Internal-API-Key가 필요하고 Worker가 준비되지 않으면 503입니다.
readinessProbe:
  exec:
    command: [python, -c, "import os,urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/health/ready', headers={'X-Internal-API-Key': os.environ['INTERNAL_API_KEY']}), timeout=2).close()"]
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
livenessProbe: {httpGet: {path: /health/live, port: 8000}, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 6}
