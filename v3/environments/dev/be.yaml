# 이미지는 앱 CI가 .github/workflows/v3-dev-image.yml로 갱신합니다(#238).
name: be
port: 8080
colors:
  blue: {image: ghcr.io/100-hours-a-week/ktb4-5th-be@sha256:dbfdab7d2afb357107ad7ea6435ae864ff67e95824d839714d3c105daf263984, replicas: 1}
  green: {image: '', replicas: 0}
# v2 dev SSM 값(be-secrets)과 Redis 비밀번호(cloud-secrets의 REDIS_PASSWORD)
secretName: be-secrets
extraSecretNames: [cloud-secrets]
iamRoleArn: arn:aws:iam::906462447513:role/dameokja-v3-dev-be
# 이미지 USER app(10001)
runAsUser: 10001
# v2 dev와 주소가 달라지는 값만 둡니다. 같은 키는 be-secrets에서 뺍니다(seal-secrets.sh).
env:
  CORS_ALLOWED_ORIGINS: https://dev.dameokja.com
  SERVER_TOMCAT_MBEANREGISTRY_ENABLED: 'true'
  SPRING_DATA_REDIS_HOST: redis.dev.svc.cluster.local
  SPRING_DATA_REDIS_PORT: '6379'
  AI_BASE_URL: http://ai-api.dev.svc.cluster.local:8000
  # Strimzi dev-kafka 내부 PLAINTEXT. 토픽 이름은 <KAFKA_ENV>.dameokja.* (dev-data 차트)
  KAFKA_BOOTSTRAP_SERVERS: dev-kafka-kafka-bootstrap.dev.svc.cluster.local:9092
  KAFKA_ENV: dev
  # BE Kafka Consumer 시작(BE 기본값 false). v2 dev SSM도 같은 키를 둠
  KAFKA_LISTENER_ENABLED: 'true'
resources:
  requests: {cpu: 500m, memory: 1Gi}
  limits: {cpu: '1', memory: 2Gi}
# Spring Boot는 Kubernetes 안에서 liveness·readiness 그룹을 스스로 켭니다.
startupProbe: {httpGet: {path: /actuator/health/readiness, port: 8080}, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 30}
readinessProbe: {httpGet: {path: /actuator/health/readiness, port: 8080}, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 3}
livenessProbe: {httpGet: {path: /actuator/health/liveness, port: 8080}, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 6}
# v2 dev nginx와 같은 경로(/api, Swagger)
route:
  hostname: dev.dameokja.com
  pathPrefixes: [/api, /swagger-ui, /v3/api-docs]
  healthCheckPath: /actuator/health/readiness
