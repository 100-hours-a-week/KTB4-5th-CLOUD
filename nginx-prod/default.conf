# conf.d 설정 파일은 http 블록 안에서 로드된다.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# 컨테이너 교체 후에도 백엔드와 프론트엔드 주소를 갱신하도록 Docker 내장 DNS를 사용한다.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name dameokja.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 308 https://dameokja.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name dameokja.com;

    ssl_certificate /etc/letsencrypt/live/dameokja.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dameokja.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    set $frontend_origin http://frontend:3000;
    set $backend_origin http://backend:8080;

    # springdoc 기본 문서 화면, 정적 리소스, 설정 및 OpenAPI 명세를 백엔드로 전달한다.
    location ~ ^/(swagger-ui(?:/|$)|swagger-ui\.html$|v3/api-docs(?:\.yaml$|/|$)) {
        proxy_pass $backend_origin$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api(?:/|$) {
        proxy_pass $backend_origin$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }

    location / {
        proxy_pass $frontend_origin$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }
}
