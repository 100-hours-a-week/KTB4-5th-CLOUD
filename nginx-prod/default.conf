# conf.d 설정 파일은 http 블록 안에서 로드된다.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# SLI 집계용 API 분류. 경로 변수는 정규식으로 묶고, SLI 대상이 아니면 "-"로 남긴다.
# 분류 기준은 SLI-SLO-design.md 3.1(측정 대상)과 같다.
map "$request_method $uri" $slo_route {
    default "-";
    "~^POST /api/v1/refrigerators/[^/]+/ingredients$" ingredient_create;
    "~^GET /api/v1/refrigerators/[^/]+/ingredients$" ingredient_read;
    "~^GET /api/v1/ingredients/[^/]+$" ingredient_read;
    "~^GET /api/v1/refrigerators/[^/]+/notifications(/stream|/unread-count)?$" notification_poll;
    # 보조 관측 대상: 목표 없이 성공률·응답시간만 본다.
    "~^POST /api/v1/ingredients/[^/]+$" aux_consume;
    "~^POST /api/v1/push-subscriptions$" aux_push_subscribe;
}

# CloudWatch 지표 필터가 읽는 JSON 접근 로그. status·request_time은 숫자로 남겨 비교식에 쓴다.
log_format slo_json escape=json '{"time":"$time_iso8601","method":"$request_method",'
    '"uri":"$uri","status":$status,"route":"$slo_route","request_time":$request_time,'
    '"upstream_status":"$upstream_status","upstream_time":"$upstream_response_time",'
    '"bytes":$body_bytes_sent}';

# 컨테이너 교체 후에도 백엔드와 프론트엔드 주소를 갱신하도록 Docker 내장 DNS를 사용한다.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name dameokja.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 308 https://dameokja.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name dameokja.com;

    ssl_certificate /etc/letsencrypt/live/dameokja.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dameokja.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # docker logs용 기본 로그는 유지하고, SLI용 JSON 로그를 호스트 파일로 함께 남긴다.
    access_log /var/log/nginx/access.log main;
    access_log /var/log/nginx/app/access.json.log slo_json;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    set $frontend_origin http://frontend:3000;
    set $backend_origin http://backend:8080;

    # springdoc 기본 문서 화면, 정적 리소스, 설정 및 OpenAPI 명세를 백엔드로 전달한다.
    location ~ ^/(swagger-ui(?:/|$)|swagger-ui\.html$|v3/api-docs(?:\.yaml$|/|$)) {
        proxy_pass $backend_origin$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api(?:/|$) {
        proxy_pass $backend_origin$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }

    location / {
        proxy_pass $frontend_origin$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }
}
