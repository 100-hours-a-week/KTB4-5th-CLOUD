# stage가 Ready이고 관측 검증을 마친 뒤 시험 동안만 수동 적용합니다.
# power.sh stop 전에 삭제해야 HPA가 replica를 다시 늘리지 않습니다.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: be-load-test
  namespace: stage
  labels:
    dameokja.com/purpose: load-test
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: be-blue
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Min
      policies:
        - {type: Pods, value: 2, periodSeconds: 30}
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - {type: Pods, value: 1, periodSeconds: 60}
