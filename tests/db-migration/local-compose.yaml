# 로컬 격리 리허설: 원본·신규 MySQL과 실행 컨테이너만 있는 별도 네트워크. 외부 DB에 접속하지 않음
# 사용: docker compose -f local-compose.yaml --env-file <비밀번호 파일> up -d --build
#       docker compose -f local-compose.yaml exec runner ./rehearse.sh
name: dameokja-migtest

x-mysql: &mysql
  image: mysql:${MYSQL_TAG:-8.4.11}
  environment:
    MYSQL_ROOT_PASSWORD: ${ROOT_PASSWORD:?}
    MIG_PASSWORD: ${MIG_PASSWORD:?}
    REPL_PASSWORD: ${REPL_PASSWORD:?}
    TZ: Asia/Seoul
  # 초기화 중 임시 서버는 TCP를 열지 않으므로 127.0.0.1로 확인해야 실제 기동 후에 healthy가 됨
  healthcheck:
    test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
    interval: 3s
    retries: 40

services:
  # 원본: stage DB와 같은 GTID·binlog 설정. 보존 30일을 명시
  src:
    <<: *mysql
    command: >-
      --server-id=1 --log-bin=binlog --gtid-mode=ON --enforce-gtid-consistency=ON
      --binlog-expire-logs-seconds=2592000 --default-time-zone=+09:00
    volumes:
      - ./local-init/src:/docker-entrypoint-initdb.d:ro
    cpus: ${DB_CPUS:-2}
    mem_limit: ${DB_MEM:-4g}

  # 신규: 복제 수신 전용으로 시작. 초기화 스크립트가 끝난 뒤 super_read_only를 켬
  tgt:
    <<: *mysql
    command: >-
      --server-id=2 --log-bin=binlog --gtid-mode=ON --enforce-gtid-consistency=ON --log-replica-updates=ON
      --binlog-expire-logs-seconds=2592000 --default-time-zone=+09:00 --skip-replica-start=ON --relay-log-recovery=ON
    volumes:
      - ./local-init/tgt:/docker-entrypoint-initdb.d:ro
    cpus: ${DB_CPUS:-2}
    mem_limit: ${DB_MEM:-4g}

  runner:
    build: { context: ., dockerfile: runner.Dockerfile }
    depends_on:
      src: { condition: service_healthy }
      tgt: { condition: service_healthy }
    working_dir: /migtest
    volumes:
      - .:/migtest
      - ${WORK_ROOT:-./work}:/migtest/work
    environment:
      SRC_HOST: src
      SRC_USER: migadmin
      SRC_PASSWORD: ${MIG_PASSWORD:?}
      TGT_HOST: tgt
      TGT_USER: migadmin
      TGT_PASSWORD: ${MIG_PASSWORD:?}
      REPL_USER: repl
      REPL_PASSWORD: ${REPL_PASSWORD:?}
      DB_NAME: dameokja
    command: ["sleep", "infinity"]
