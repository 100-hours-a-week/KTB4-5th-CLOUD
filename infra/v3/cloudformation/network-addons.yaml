AWSTemplateFormatVersion: '2010-09-09'
Description: dameokja v3 VPC CNI and kube-proxy bootstrap

Parameters:
  ClusterName:
    Type: String
    Default: dameokja-v3
  EksStackName:
    Type: String
    Default: dameokja-v3-eks
  VpcCniVersion:
    Type: String
    Default: v1.22.4-eksbuild.10
  KubeProxyVersion:
    Type: String
    Default: v1.35.3-eksbuild.62

Resources:
  VpcCniRole:
    Type: AWS::IAM::Role
    Properties:
      # 동적 조건 키는 JSON 문자열 치환으로 구성하고, OIDC 값은 EKS 스택 Export에서 가져옵니다.
      AssumeRolePolicyDocument: !Sub
        - |
          {
            "Version": "2012-10-17",
            "Statement": [{
              "Effect": "Allow",
              "Principal": {"Federated": "${OidcProviderArn}"},
              "Action": "sts:AssumeRoleWithWebIdentity",
              "Condition": {"StringEquals": {
                "${OidcIssuerHostPath}:aud": "sts.amazonaws.com",
                "${OidcIssuerHostPath}:sub": "system:serviceaccount:kube-system:aws-node"
              }}
            }]
          }
        - OidcProviderArn: {'Fn::ImportValue': !Sub '${EksStackName}-OidcProviderArn'}
          OidcIssuerHostPath: {'Fn::ImportValue': !Sub '${EksStackName}-OidcIssuerHostPath'}
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonEKS_CNI_Policy

  VpcCni:
    Type: AWS::EKS::Addon
    Properties:
      ClusterName: !Ref ClusterName
      AddonName: vpc-cni
      AddonVersion: !Ref VpcCniVersion
      ServiceAccountRoleArn: !GetAtt VpcCniRole.Arn
      ResolveConflicts: NONE
      PreserveOnDelete: true
      # ENABLE_POD_ENI·standard: Pod SG를 쓰면서 NetworkPolicy도 함께 적용합니다.
      # EXCLUDE_SNAT_CIDRS: DB SG가 Pod SG를 식별하도록 dev DB 호스트로 가는 트래픽만 Node IP로 바꾸지 않습니다.
      # DISABLE_TCP_EARLY_DEMUX: Pod SG가 붙은 Pod에 kubelet TCP Probe가 닿도록 하는 AWS 권장 설정입니다.
      ConfigurationValues: |
        {
          "enableNetworkPolicy": "true",
          "env": {
            "ENABLE_POD_ENI": "true",
            "POD_SECURITY_GROUP_ENFORCING_MODE": "standard",
            "NETWORK_POLICY_ENFORCING_MODE": "standard",
            "AWS_VPC_K8S_CNI_EXCLUDE_SNAT_CIDRS": "172.31.4.192/32"
          },
          "init": {"env": {"DISABLE_TCP_EARLY_DEMUX": "true"}}
        }

  KubeProxy:
    Type: AWS::EKS::Addon
    Properties:
      ClusterName: !Ref ClusterName
      AddonName: kube-proxy
      AddonVersion: !Ref KubeProxyVersion
      ResolveConflicts: NONE
      PreserveOnDelete: true

Outputs:
  VpcCniRoleArn:
    Value: !GetAtt VpcCniRole.Arn
