AWSTemplateFormatVersion: '2010-09-09'
Description: dameokja v3 EKS foundation in the existing VPC

Parameters:
  ClusterName:
    Type: String
    Default: dameokja-v3
    AllowedPattern: '[a-zA-Z][a-zA-Z0-9-]{0,62}'
  KubernetesVersion:
    Type: String
    Default: '1.35'
    AllowedValues: ['1.35']
  VpcId:
    Type: AWS::EC2::VPC::Id
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  ServiceIpv4Cidr:
    Type: String
    Default: 192.168.0.0/16
    AllowedValues: [192.168.0.0/16]
  AdministratorPrincipalArn:
    Type: String
    AllowedPattern: 'arn:aws:iam::[0-9]{12}:(user|role)/.+'
  EnablePublicEndpoint:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  AdministratorPublicCidr:
    Type: String
    Default: 192.0.2.1/32
    AllowedPattern: '(\d{1,3}\.){3}\d{1,3}/32'
    Description: Administrator IPv4 /32; replace the documentation address before enabling public access

Rules:
  RequireRealPublicAdministratorAddress:
    RuleCondition: !Equals [!Ref EnablePublicEndpoint, 'true']
    Assertions:
      - Assert: !Not [!Equals [!Ref AdministratorPublicCidr, 192.0.2.1/32]]
        AssertDescription: Replace the documentation /32 before enabling the public endpoint

Conditions:
  PublicEndpointEnabled: !Equals [!Ref EnablePublicEndpoint, 'true']

Resources:
  ClusterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonEKSClusterPolicy
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonEKSVPCResourceController

  SystemNodeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonEC2ContainerRegistryPullOnly
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore

  AppNodeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonEC2ContainerRegistryPullOnly
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore

  ControlPlaneSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: v3 control plane additional security group
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub ${ClusterName}-control-plane

  WorkerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: v3 workers; application access is restricted by Pod SG and NetworkPolicy
      VpcId: !Ref VpcId
      # Node의 이미지 확보와 NAT 송신을 허용합니다. DB SG에는 이 SG를 등록하지 않습니다.
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${ClusterName}-workers

  WorkerInternalTraffic:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref WorkerSecurityGroup
      SourceSecurityGroupId: !Ref WorkerSecurityGroup
      IpProtocol: '-1'
      Description: Worker and non-branch Pod traffic; NetworkPolicy restricts applications

  WorkerApiAccess:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ControlPlaneSecurityGroup
      SourceSecurityGroupId: !Ref WorkerSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443

  # kubelet 10250, Metrics Server 10251, Controller webhook(9443 등)을 포함하는 EKS 권장 범위입니다.
  ControlPlaneExtensionAccess:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref WorkerSecurityGroup
      SourceSecurityGroupId: !Ref ControlPlaneSecurityGroup
      IpProtocol: tcp
      FromPort: 1025
      ToPort: 65535
      Description: kubelet, metrics server and controller webhooks

  ControlPlaneHttpsWebhookAccess:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref WorkerSecurityGroup
      SourceSecurityGroupId: !Ref ControlPlaneSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      Description: In-cluster HTTPS webhook

  Cluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Ref ClusterName
      Version: !Ref KubernetesVersion
      RoleArn: !GetAtt ClusterRole.Arn
      # add-on을 별도 스택에서 고정 버전으로 설치하여 중복 소유를 피합니다.
      BootstrapSelfManagedAddons: false
      AccessConfig:
        AuthenticationMode: API
        BootstrapClusterCreatorAdminPermissions: false
      KubernetesNetworkConfig:
        IpFamily: ipv4
        ServiceIpv4Cidr: !Ref ServiceIpv4Cidr
      ResourcesVpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref ControlPlaneSecurityGroup
        EndpointPrivateAccess: true
        EndpointPublicAccess: !If [PublicEndpointEnabled, true, false]
        PublicAccessCidrs: !If
          - PublicEndpointEnabled
          - [!Ref AdministratorPublicCidr]
          - !Ref AWS::NoValue
      UpgradePolicy:
        SupportType: STANDARD
      Tags:
        - Key: Project
          Value: dameokja
        - Key: Generation
          Value: v3

  AdministratorAccess:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: !Ref Cluster
      PrincipalArn: !Ref AdministratorPrincipalArn
      Type: STANDARD
      AccessPolicies:
        - PolicyArn: !Sub arn:${AWS::Partition}:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
          AccessScope:
            Type: cluster

  SystemNodeAccess:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: !Ref Cluster
      PrincipalArn: !GetAtt SystemNodeRole.Arn
      Type: EC2_LINUX

  AppNodeAccess:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: !Ref Cluster
      PrincipalArn: !GetAtt AppNodeRole.Arn
      Type: EC2_LINUX

  OidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: !GetAtt Cluster.OpenIdConnectIssuerUrl
      ClientIdList: [sts.amazonaws.com]

  # CA는 1024자를 넘어 Export할 수 없으므로 SSM Parameter로 넘깁니다.
  ClusterCertificateAuthorityParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${AWS::StackName}/cluster-ca
      Type: String
      Value: !GetAtt Cluster.CertificateAuthorityData

Outputs:
  VpcId:
    Value: !Ref VpcId
  ClusterName:
    Value: !Ref Cluster
  ClusterEndpoint:
    Value: !GetAtt Cluster.Endpoint
    Export:
      Name: !Sub ${AWS::StackName}-ClusterEndpoint
  ClusterCertificateAuthorityParameter:
    Value: !Ref ClusterCertificateAuthorityParameter
  ServiceIpv4Cidr:
    Value: !Ref ServiceIpv4Cidr
  ControlPlaneSecurityGroupId:
    Value: !Ref ControlPlaneSecurityGroup
  WorkerSecurityGroupId:
    Value: !Ref WorkerSecurityGroup
    Export:
      Name: !Sub ${AWS::StackName}-WorkerSecurityGroupId
  SystemNodeRoleName:
    Value: !Ref SystemNodeRole
    Export:
      Name: !Sub ${AWS::StackName}-SystemNodeRoleName
  AppNodeRoleName:
    Value: !Ref AppNodeRole
  AppNodeRoleArn:
    Value: !GetAtt AppNodeRole.Arn
  OidcProviderArn:
    Value: !Ref OidcProvider
    Export:
      Name: !Sub ${AWS::StackName}-OidcProviderArn
  OidcIssuerHostPath:
    Value: !Select [1, !Split ['https://', !GetAtt Cluster.OpenIdConnectIssuerUrl]]
    Export:
      Name: !Sub ${AWS::StackName}-OidcIssuerHostPath
