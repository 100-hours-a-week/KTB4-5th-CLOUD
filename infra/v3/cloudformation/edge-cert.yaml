AWSTemplateFormatVersion: '2010-09-09'
Description: dameokja v3 CloudFront certificate (us-east-1)
# CloudFront는 us-east-1 인증서만 씁니다. Workflow가 이 스택만 us-east-1에 만듭니다.
# 검증 CNAME은 ACM이 dameokja.com 호스티드 존에 직접 만듭니다.
Parameters:
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
  DomainName:
    Type: String
  # 공용 배포가 함께 받는 도메인(dev 외).
  StageDomainName:
    Type: String
  # v3 prod(dameokja.com). ProdSharedCertificate에만 들어갑니다.
  ProdDomainName:
    Type: String
Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions: [{DomainName: !Ref DomainName, HostedZoneId: !Ref HostedZoneId}]
      Tags: [{Key: Name, Value: dameokja-v3-edge}]
  # dev·stage를 함께 담는 인증서. 도메인을 바꾸면 인증서가 교체되므로 새 자원으로 만듭니다.
  # 위 dev 인증서는 edge가 옮겨 간 뒤에도 남겨 둡니다(공인 인증서는 무료이고, 지울 때 같은 검증 CNAME이 지워질 위험을 피함).
  SharedCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames: [!Ref StageDomainName]
      ValidationMethod: DNS
      DomainValidationOptions:
        - {DomainName: !Ref DomainName, HostedZoneId: !Ref HostedZoneId}
        - {DomainName: !Ref StageDomainName, HostedZoneId: !Ref HostedZoneId}
      Tags: [{Key: Name, Value: dameokja-v3-edge-shared}]
  # dev·stage·prod를 함께 담는 인증서. 위 SharedCertificate는 edge가 옮겨 간 뒤에도 남겨 둡니다(같은 이유).
  ProdSharedCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames: [!Ref StageDomainName, !Ref ProdDomainName]
      ValidationMethod: DNS
      DomainValidationOptions:
        - {DomainName: !Ref DomainName, HostedZoneId: !Ref HostedZoneId}
        - {DomainName: !Ref StageDomainName, HostedZoneId: !Ref HostedZoneId}
        - {DomainName: !Ref ProdDomainName, HostedZoneId: !Ref HostedZoneId}
      Tags: [{Key: Name, Value: dameokja-v3-edge-prod-shared}]
Outputs:
  # 리전이 달라 Export로 넘길 수 없어 edge 파라미터에 적습니다.
  CertificateArn:
    Value: !Ref Certificate
  SharedCertificateArn:
    Value: !Ref SharedCertificate
  ProdSharedCertificateArn:
    Value: !Ref ProdSharedCertificate
