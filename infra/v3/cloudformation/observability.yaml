                      "legendFormat": "{{condition}}"
                    }
                  ]
                },
                {
                  "id": 15,
                  "title": "Pod Pending·Ready",
                  "type": "timeseries",
                  "description": "",
                  "gridPos": {
                    "x": 0,
                    "y": 56,
                    "w": 12,
                    "h": 8
                  },
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${prom}"
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "short"
                    },
                    "overrides": []
                  },
                  "targets": [
                    {
                      "refId": "A",
                      "expr": "sum(kube_pod_status_phase{cluster=\"$cluster\",namespace=\"$namespace\",phase=\"Pending\"})",
                      "legendFormat": "Pending"
                    },
                    {
                      "refId": "B",
                      "expr": "sum(kube_pod_status_ready{cluster=\"$cluster\",namespace=\"$namespace\",condition=\"true\"})",
                      "legendFormat": "Ready"
                    }
                  ]
                },
                {
                  "id": 16,
                  "title": "Pod 생성·스케줄링·Ready 시각",
                  "type": "timeseries",
                  "description": "",
                  "gridPos": {
                    "x": 12,
                    "y": 56,
                    "w": 12,
                    "h": 8
                  },
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${prom}"
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "dateTimeAsIso"
                    },
                    "overrides": []
                  },
                  "targets": [
                    {
                      "refId": "A",
                      "expr": "kube_pod_created{cluster=\"$cluster\",namespace=\"$namespace\"} * 1000",
                      "legendFormat": "{{pod}} 생성"
                    },
                    {
                      "refId": "B",
                      "expr": "kube_pod_status_scheduled_time{cluster=\"$cluster\",namespace=\"$namespace\"} * 1000",
                      "legendFormat": "{{pod}} Scheduled"
                    },
                    {
                      "refId": "C",
                      "expr": "kube_pod_status_ready_time{cluster=\"$cluster\",namespace=\"$namespace\"} * 1000",
                      "legendFormat": "{{pod}} Ready"
                    }
                  ]
                },
                {
                  "id": 17,
                  "title": "환경 Pod 로그",
                  "type": "logs",
                  "gridPos": {
                    "x": 0,
                    "y": 64,
                    "w": 24,
                    "h": 8
                  },
                  "datasource": {
                    "type": "loki",
                    "uid": "${loki}"
                  },
                  "targets": [
                    {
                      "refId": "A",
                      "expr": "{cluster=\"$cluster\",namespace=\"$namespace\",source!=\"kubernetes-events\"}"
                    }
                  ]
                },
                {
                  "id": 18,
                  "title": "환경 Kubernetes 이벤트",
                  "type": "logs",
                  "gridPos": {
                    "x": 0,
                    "y": 72,
                    "w": 24,
                    "h": 8
                  },
                  "datasource": {
                    "type": "loki",
                    "uid": "${loki}"
                  },
                  "targets": [
                    {
                      "refId": "A",
                      "expr": "{cluster=\"$cluster\",namespace=\"$namespace\",source=\"kubernetes-events\"} | json"
                    }
                  ]
                }
              ]
            }
            EOF
          # 설정이 바뀐 경우에만 컨테이너를 다시 만듭니다.
          - |
            if diff -rq /opt/observability.new /opt/observability >/dev/null 2>&1; then
              rm -rf /opt/observability.new; RECREATE=
            else
              rm -rf /opt/observability; mv /opt/observability.new /opt/observability; RECREATE=--force-recreate
            fi
            # diff는 권한을 비교하지 않으므로 매번 권한을 맞춥니다(컨테이너가 설정을 읽고, grafana.env만 root 전용).
            chmod -R go+rX /opt/observability; chmod 600 /opt/observability/grafana.env
            docker compose -f /opt/observability/compose.yaml up -d $RECREATE

Outputs:
  ObservabilityInstanceId:
    Value: !Ref ObservabilityInstance
  # 클러스터 쪽 Alloy의 송신 주소와 NetworkPolicy 예외에 씁니다.
  ObservabilityPrivateIp:
    Value: !GetAtt ObservabilityInstance.PrivateIp
    Export:
      Name: !Sub ${AWS::StackName}-PrivateIp
  ObservabilitySecurityGroupId:
    Value: !Ref ObservabilitySecurityGroup
  DataVolumeId:
    Value: !Ref DataVolume
