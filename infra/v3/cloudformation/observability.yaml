AWSTemplateFormatVersion: '2010-09-09'
Description: dameokja v3 dev observability EC2 (Prometheus, Loki, Grafana)
# 클러스터 안 Alloy가 로그는 Loki(3100)로, 메트릭은 Prometheus remote-write(9090)로 보냅니다.
# Prometheus가 클러스터를 직접 긁지 않으므로 EC2에 클러스터 자격 증명을 두지 않고, Node SG에 10250·8080 수신도 열지 않습니다.
# Grafana는 grafana-edge 스택의 CloudFront(VPC Origin)로만 들어오고, 로그인은 미리 등록한 GitHub 계정만 됩니다.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  # 실행할 때마다 최신 AMI를 따라가면 인스턴스가 교체되므로 확인한 ID로 고정합니다.
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: Verified Amazon Linux 2023 x86_64 AMI
  EksStackName:
    Type: String
    Default: dameokja-v3-eks
  # CloudFront origin-facing 관리형 Prefix List(ap-northeast-2)
  CloudFrontOriginPrefixListId:
    Type: String
  GrafanaDomainName:
    Type: String

Resources:
  ObservabilitySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref VpcId
      GroupDescription: v3 dev observability EC2
      SecurityGroupIngress:
        # Alloy는 Pod SG 없이 Node SG(Worker)로 나갑니다.
        - {IpProtocol: tcp, FromPort: 3100, ToPort: 3100, SourceSecurityGroupId: {'Fn::ImportValue': !Sub '${EksStackName}-WorkerSecurityGroupId'}, Description: Alloy logs to Loki}
        - {IpProtocol: tcp, FromPort: 9090, ToPort: 9090, SourceSecurityGroupId: {'Fn::ImportValue': !Sub '${EksStackName}-WorkerSecurityGroupId'}, Description: Alloy remote-write to Prometheus}
        # CloudFront VPC Origin → Grafana
        - {IpProtocol: tcp, FromPort: 3000, ToPort: 3000, SourcePrefixListId: !Ref CloudFrontOriginPrefixListId, Description: CloudFront to Grafana}
      # 패키지·이미지 설치와 SSM 연결에 NAT 송신이 필요합니다.
      SecurityGroupEgress: [{IpProtocol: '-1', CidrIp: 0.0.0.0/0}]
      Tags: [{Key: Name, Value: dameokja-v3-observability}]

  # SSM 관리(접속·Run Command)와 Grafana GitHub OAuth 값 읽기 권한만 둡니다.
  ObservabilityRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - {Effect: Allow, Principal: {Service: ec2.amazonaws.com}, Action: sts:AssumeRole}
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: grafana-github-oauth
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:GetParameters
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/dameokja-v3-observability/grafana-github-*
  ObservabilityInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref ObservabilityRole]

  ObservabilityInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      # Prometheus·Loki·Grafana 1개씩의 dev 규모(4GiB)입니다.
      InstanceType: t3.medium
      # 평시 사용량이 낮아 unlimited 추가 요금이 생기지 않게 standard로 둡니다.
      CreditSpecification: {CPUCredits: standard}
      IamInstanceProfile: !Ref ObservabilityInstanceProfile
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: false
          SubnetId: !Ref SubnetId
          GroupSet: [!Ref ObservabilitySecurityGroup]
      BlockDeviceMappings:
        # 루트는 OS·컨테이너 이미지용입니다. 데이터는 아래 별도 EBS에 둡니다.
        - DeviceName: /dev/xvda
          Ebs: {VolumeType: gp3, VolumeSize: 16, Encrypted: true, DeleteOnTermination: true}
      Tags:
        - {Key: Name, Value: dameokja-v3-observability}
        - {Key: Project, Value: dameokja}
        - {Key: Generation, Value: v3}

  # 인스턴스를 바꾸거나 스택을 지워도 메트릭·로그·Grafana 설정이 남도록 분리합니다.
  DataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AvailabilityZone: !GetAtt ObservabilityInstance.AvailabilityZone
      VolumeType: gp3
      Size: 30
      Encrypted: true
      Tags: [{Key: Name, Value: dameokja-v3-observability-data}]
  DataVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      InstanceId: !Ref ObservabilityInstance
      VolumeId: !Ref DataVolume
      Device: /dev/sdf

  # 설정은 State Manager가 적용합니다. UserData는 첫 부팅에만 실행되지만 Association은 내용이 바뀌면 다시 실행됩니다.
  # CloudFormation이 저장소의 다른 파일을 읽을 수 없어 설정 파일을 여기에 둡니다(한 곳에서만 관리).
  # 바이너리+systemd보다 짧아서 docker compose를 씁니다(서비스 3개를 한 파일로, 이미지 digest로 버전 고정).
  ObservabilityAssociation:
    Type: AWS::SSM::Association
    DependsOn: DataVolumeAttachment
    Properties:
      AssociationName: dameokja-v3-observability
      Name: AWS-RunShellScript
      Targets:
        - {Key: InstanceIds, Values: [!Ref ObservabilityInstance]}
      Parameters:
        executionTimeout: ['1800']
        commands:
          - set -euo pipefail
          - !Sub VOL=${DataVolume}
          - !Sub GRAFANA_DOMAIN=${GrafanaDomainName}
          - !Sub REGION=${AWS::Region}
          - rpm -q docker >/dev/null || dnf install -y docker
          # 컨테이너 로그가 루트 디스크를 채우지 않게 크기를 제한합니다.
          - mkdir -p /etc/docker; echo '{"log-driver":"json-file","log-opts":{"max-size":"10m","max-file":"3"}}' > /etc/docker/daemon.json
          - systemctl enable --now docker
          # AL2023 저장소에 compose 플러그인이 없어 공식 릴리스를 checksum으로 확인해 설치합니다.
          - |
            P=/usr/local/lib/docker/cli-plugins/docker-compose
            SUM=a5ea28722d5da628b59226626f7d6c33c89a7ed19e39f750645925242044c9d2
            if ! echo "$SUM  $P" | sha256sum -c --status 2>/dev/null; then
              mkdir -p "$(dirname $P)"
              curl -fsSL -o "$P" https://github.com/docker/compose/releases/download/v2.39.1/docker-compose-linux-x86_64
              echo "$SUM  $P" | sha256sum -c
              chmod 755 "$P"
            fi
          # 데이터 EBS: 처음 붙었을 때만 포맷하고 /data에 마운트합니다.
          - |
            DEV=/dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_$(echo $VOL | tr -d -)
            for i in $(seq 60); do [ -e "$DEV" ] && break; sleep 5; done
            blkid "$DEV" >/dev/null || mkfs.xfs "$DEV"
            mkdir -p /data
            grep -q ' /data ' /etc/fstab || echo "UUID=$(blkid -s UUID -o value $DEV) /data xfs defaults,nofail 0 2" >> /etc/fstab
            mountpoint -q /data || mount /data
            # 이미지별 실행 UID: prometheus 65534, loki 10001, grafana 472
            mkdir -p /data/prometheus /data/loki /data/grafana
            chown 65534:65534 /data/prometheus; chown 10001:10001 /data/loki; chown 472:472 /data/grafana
          - mkdir -p /opt/observability.new
          # GitHub OAuth App 값은 사용자가 SSM에 넣습니다(client-secret은 SecureString). 이 파일만 root가 읽습니다.
          # umask를 쓰면 뒤 명령의 설정 파일까지 600이 되어 컨테이너가 읽지 못하므로, 파일을 600으로 먼저 만듭니다.
          - |
            install -m 600 /dev/null /opt/observability.new/grafana.env
            aws ssm get-parameters --region $REGION --with-decryption \
              --names /dameokja-v3-observability/grafana-github-client-id /dameokja-v3-observability/grafana-github-client-secret \
              --query 'Parameters[].[Name,Value]' --output text | awk '
              /client-id/ {print "GF_AUTH_GITHUB_CLIENT_ID=" $2}
              /client-secret/ {print "GF_AUTH_GITHUB_CLIENT_SECRET=" $2}' > /opt/observability.new/grafana.env
            [ "$(wc -l < /opt/observability.new/grafana.env)" = 2 ]
            echo "GF_SERVER_ROOT_URL=https://$GRAFANA_DOMAIN" >> /opt/observability.new/grafana.env
          - |
            cat > /opt/observability.new/compose.yaml <<'EOF'
            services:
              prometheus:
                image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
                command:
                  - --config.file=/etc/prometheus/prometheus.yml
                  - --storage.tsdb.path=/prometheus
                  # 메트릭 보존 15일. 30GiB 디스크를 Loki·Grafana와 나눠 쓰므로 크기 상한도 둡니다.
                  - --storage.tsdb.retention.time=15d
                  - --storage.tsdb.retention.size=15GB
                  # 클러스터 안 Alloy가 remote_write로 보냅니다.
                  - --web.enable-remote-write-receiver
                volumes:
                  - /opt/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
                  - /data/prometheus:/prometheus
                ports: ["9090:9090"]
                restart: unless-stopped
              loki:
                image: grafana/loki:3.5.0@sha256:4c431d2e6b9b38718694b31c5d56be7c80dc69c513215fde1aeb5b02cd4e2665
                command: [-config.file=/etc/loki/config.yaml]
                volumes:
                  - /opt/observability/loki.yaml:/etc/loki/config.yaml:ro
                  - /data/loki:/loki
                ports: ["3100:3100"]
                restart: unless-stopped
              grafana:
                image: grafana/grafana:12.0.0@sha256:263cbefd5d9b179893c47c415daab4da5c1f3d6770154741eca4f45c81119884
                environment:
                  - GF_AUTH_ANONYMOUS_ENABLED=false
                  - GF_USERS_ALLOW_SIGN_UP=false
                  - GF_SECURITY_COOKIE_SECURE=true
                  # 비밀번호 로그인(화면·API)은 끄고 GitHub 로그인만 둡니다. 복구는 EC2에서 grafana cli로 합니다.
                  - GF_AUTH_DISABLE_LOGIN_FORM=true
                  - GF_AUTH_BASIC_ENABLED=false
                  - GF_AUTH_GITHUB_ENABLED=true
                  - GF_AUTH_GITHUB_SCOPES=user:email
                  # 허용 목록(아래 ROLE_ATTRIBUTE_PATH)에 있는 GitHub 아이디만 첫 로그인 때 자동 가입합니다.
                  - GF_AUTH_GITHUB_ALLOW_SIGN_UP=true
                  # 목록에 없는 아이디는 역할이 나오지 않아 로그인이 거절됩니다.
                  # 역할 동기화 건너뛰기(SKIP_ORG_ROLE_SYNC)를 켜면 이 검사도 건너뛰어 아무나 가입되므로 켜지 않습니다.
                  - GF_AUTH_GITHUB_ROLE_ATTRIBUTE_STRICT=true
                  - GF_AUTH_GITHUB_ALLOW_ASSIGN_GRAFANA_ADMIN=true
                  # 사람 추가·삭제는 이 목록을 고쳐 apply합니다. 역할은 로그인할 때마다 목록대로 맞춰집니다(화면에서 바꾼 역할은 되돌아감).
                  - "GF_AUTH_GITHUB_ROLE_ATTRIBUTE_PATH=contains(['joongsunYoon'], login) && 'GrafanaAdmin' || contains(['1sanguk','dlawnsdnjs','2sg','startupcodekr','iey704','jung-min-ju'], login) && 'Editor'"
                env_file: [/opt/observability/grafana.env]
                volumes:
                  - /opt/observability/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
                  - /opt/observability/dashboards:/etc/grafana/provisioning/dashboards:ro
                  - /data/grafana:/var/lib/grafana
                # SG가 CloudFront만 3000으로 들여보냅니다. SSM 포트 포워딩도 그대로 됩니다.
                ports: ["3000:3000"]
                restart: unless-stopped
            EOF
          - |
            cat > /opt/observability.new/prometheus.yml <<'EOF'
            # 수집 대상은 클러스터 안 Alloy가 정하고 remote_write로 보냅니다. 여기서는 자기 자신만 긁습니다.
            global:
              scrape_interval: 30s
            scrape_configs:
              - job_name: prometheus
                static_configs: [{targets: ['localhost:9090']}]
            EOF
          - |
            cat > /opt/observability.new/loki.yaml <<'EOF'
            # 단일 프로세스, 로컬 디스크 저장
            auth_enabled: false
            server:
              http_listen_port: 3100
            common:
              path_prefix: /loki
              replication_factor: 1
              ring:
                kvstore: {store: inmemory}
              storage:
                filesystem: {chunks_directory: /loki/chunks, rules_directory: /loki/rules}
            schema_config:
              configs:
                - {from: 2026-11-01, store: tsdb, object_store: filesystem, schema: v13, index: {prefix: index_, period: 24h}}
            # 로그 보존 7일. 삭제는 compactor가 합니다.
            limits_config:
              retention_period: 168h
            compactor:
              working_directory: /loki/compactor
              retention_enabled: true
              delete_request_store: filesystem
            EOF
          - |
            cat > /opt/observability.new/datasources.yaml <<'EOF'
            apiVersion: 1
            datasources:
              - {name: Prometheus, type: prometheus, url: 'http://prometheus:9090', isDefault: true}
              - {name: Loki, type: loki, url: 'http://loki:3100'}
            EOF
          # 대시보드는 파일에서만 관리합니다(화면에서 고친 내용은 다음 적용 때 덮어씀).
          - |
            mkdir -p /opt/observability.new/dashboards
            cat > /opt/observability.new/dashboards/provider.yaml <<'EOF'
            apiVersion: 1
            providers:
              - {name: dameokja, type: file, allowUiUpdates: false, options: {path: /etc/grafana/provisioning/dashboards}}
            EOF
          # dev 개요. 데이터 소스는 변수로 골라 Grafana가 만든 uid에 묶이지 않게 합니다.
          # BE는 histogram bucket을 내보내지 않아 p95 대신 평균·최대 응답 시간을 봅니다.
          - |
            cat > /opt/observability.new/dashboards/dev-overview.json <<'EOF'
            {
              "uid": "dameokja-v3-dev", "title": "v3 dev 개요", "schemaVersion": 41, "refresh": "1m",
              "time": {"from": "now-6h", "to": "now"},
              "templating": {"list": [
                {"name": "prom", "type": "datasource", "query": "prometheus"},
                {"name": "loki", "type": "datasource", "query": "loki"}
              ]},
              "panels": [
                {"id": 1, "type": "stat", "title": "Node Ready / 전체", "gridPos": {"x": 0, "y": 0, "w": 6, "h": 4},
                 "datasource": {"type": "prometheus", "uid": "${prom}"},
                 "targets": [
                   {"refId": "A", "legendFormat": "Ready", "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})"},
                   {"refId": "B", "legendFormat": "전체", "expr": "count(kube_node_info)"}]},
                {"id": 2, "type": "stat", "title": "Pending Pod", "gridPos": {"x": 6, "y": 0, "w": 6, "h": 4},
                 "datasource": {"type": "prometheus", "uid": "${prom}"},
                 "targets": [{"refId": "A", "legendFormat": "{{namespace}}", "expr": "sum by (namespace) (kube_pod_status_phase{phase=\"Pending\"})"}]},
                {"id": 3, "type": "timeseries", "title": "Pod 재시작(1시간 증가분)", "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
                 "datasource": {"type": "prometheus", "uid": "${prom}"},
                 "targets": [{"refId": "A", "legendFormat": "{{namespace}}/{{pod}}", "expr": "sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total[1h])) > 0"}]},
                {"id": 4, "type": "timeseries", "title": "Node CPU 사용(core)", "gridPos": {"x": 0, "y": 4, "w": 6, "h": 8},
                 "datasource": {"type": "prometheus", "uid": "${prom}"},
                 "targets": [{"refId": "A", "legendFormat": "{{instance}}", "expr": "sum by (instance) (rate(container_cpu_usage_seconds_total{id=\"/\"}[5m]))"}]},
                {"id": 5, "type": "timeseries", "title": "Node 메모리 사용(working set)", "gridPos": {"x": 6, "y": 4, "w": 6, "h": 8},
                 "datasource": {"type": "prometheus", "uid": "${prom}"}, "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []},
                 "targets": [{"refId": "A", "legendFormat": "{{instance}}", "expr": "container_memory_working_set_bytes{id=\"/\"}"}]},
                {"id": 6, "type": "timeseries", "title": "BE 요청률·5xx(req/s, actuator 제외)", "gridPos": {"x": 0, "y": 12, "w": 12, "h": 8},
                 "datasource": {"type": "prometheus", "uid": "${prom}"},
                 "targets": [
                   {"refId": "A", "legendFormat": "전체", "expr": "sum(rate(http_server_requests_seconds_count{job=\"prometheus.scrape.be\",namespace=\"dev\",cluster=\"dameokja-v3\",uri!~\"/actuator.*\"}[5m]))"},
                   {"refId": "B", "legendFormat": "5xx", "expr": "sum(rate(http_server_requests_seconds_count{job=\"prometheus.scrape.be\",namespace=\"dev\",cluster=\"dameokja-v3\",uri!~\"/actuator.*\",status=~\"5..\"}[5m]))"}]},
                {"id": 7, "type": "timeseries", "title": "BE 응답 시간(평균·최대, actuator 제외)", "gridPos": {"x": 12, "y": 12, "w": 12, "h": 8},
                 "datasource": {"type": "prometheus", "uid": "${prom}"}, "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
                 "targets": [
                   {"refId": "A", "legendFormat": "평균", "expr": "sum(rate(http_server_requests_seconds_sum{job=\"prometheus.scrape.be\",namespace=\"dev\",cluster=\"dameokja-v3\",uri!~\"/actuator.*\"}[5m])) / sum(rate(http_server_requests_seconds_count{job=\"prometheus.scrape.be\",namespace=\"dev\",cluster=\"dameokja-v3\",uri!~\"/actuator.*\"}[5m]))"},
                   {"refId": "B", "legendFormat": "최대", "expr": "max(http_server_requests_seconds_max{job=\"prometheus.scrape.be\",namespace=\"dev\",cluster=\"dameokja-v3\",uri!~\"/actuator.*\"})"}]},
                {"id": 8, "type": "logs", "title": "dev 로그", "gridPos": {"x": 0, "y": 20, "w": 24, "h": 10},
                 "datasource": {"type": "loki", "uid": "${loki}"},
                 "targets": [{"refId": "A", "expr": "{cluster=\"dameokja-v3\", namespace=\"dev\"}"}]}
              ]
            }
            EOF
          # stage 부하·확장 관측. namespace로 dev와 분리하고 UTC로 표시합니다.
          - |
            cat > /opt/observability.new/dashboards/stage-load-test.json <<'EOF'
            {
              "uid": "dameokja-v3-stage-load-test",
              "title": "v3 stage 부하·확장 관측",
              "schemaVersion": 41,
              "timezone": "utc",
              "refresh": "5s",
              "time": {
                "from": "now-30m",
                "to": "now"
              },
              "templating": {
                "list": [
                  {
                    "name": "prom",
                    "type": "datasource",
                    "query": "prometheus"
                  },
                  {
                    "name": "loki",
                    "type": "datasource",
                    "query": "loki"
                  },
                  {
                    "name": "cluster",
                    "type": "constant",
                    "query": "dameokja-v3",
                    "hide": 2
                  },
                  {
                    "name": "namespace",
                    "type": "custom",
                    "query": "stage,dev",
                    "current": {
                      "text": "stage",
                      "value": "stage"
                    }
                  }
                ]
              },
              "panels": [
                {
                  "id": 1,
                  "title": "BE 요청량·5xx",
                  "type": "timeseries",
                  "description": "",
                  "gridPos": {
                    "x": 0,
                    "y": 0,
                    "w": 12,
                    "h": 8
                  },
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${prom}"
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "reqps"
                    },
                    "overrides": []
                  },
                  "targets": [
                    {
                      "refId": "A",
                      "expr": "sum(rate(http_server_requests_seconds_count{cluster=\"$cluster\",namespace=\"$namespace\",job=\"prometheus.scrape.be\",uri!~\"/actuator.*\"}[1m]))",
                      "legendFormat": "전체"
                    },
                    {
                      "refId": "B",
                      "expr": "sum(rate(http_server_requests_seconds_count{cluster=\"$cluster\",namespace=\"$namespace\",job=\"prometheus.scrape.be\",uri!~\"/actuator.*\",status=~\"5..\"}[1m]))",
                      "legendFormat": "5xx"
                    }
                  ]
                },
                {
                  "id": 2,
                  "title": "BE 5xx 비율",
                  "type": "timeseries",
                  "description": "서버에 도달한 요청 기준입니다. ALB·네트워크 실패는 k6 결과와 함께 확인합니다.",
                  "gridPos": {
                    "x": 12,
                    "y": 0,
                    "w": 12,
                    "h": 8
                  },
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${prom}"
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "percentunit"
                    },
                    "overrides": []
                  },
                  "targets": [
                    {
                      "refId": "A",
                      "expr": "(sum(rate(http_server_requests_seconds_count{cluster=\"$cluster\",namespace=\"$namespace\",job=\"prometheus.scrape.be\",uri!~\"/actuator.*\",status=~\"5..\"}[1m])) or vector(0)) / clamp_min(sum(rate(http_server_requests_seconds_count{cluster=\"$cluster\",namespace=\"$namespace\",job=\"prometheus.scrape.be\",uri!~\"/actuator.*\"}[1m])), 0.000001)",
                      "legendFormat": "5xx / 전체"
                    }
                  ]
                },
                {
                  "id": 3,
                  "title": "BE 평균·p95·p99 응답시간",
                  "type": "timeseries",
                  "description": "",
                  "gridPos": {
                    "x": 0,
                    "y": 8,
                    "w": 12,
                    "h": 8
                  },
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${prom}"
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "s"
                    },
                    "overrides": []
                  },
                  "targets": [
                    {
                      "refId": "A",
                      "expr": "sum(rate(http_server_requests_seconds_sum{cluster=\"$cluster\",namespace=\"$namespace\",job=\"prometheus.scrape.be\",uri!~\"/actuator.*\"}[1m])) / clamp_min(sum(rate(http_server_requests_seconds_count{cluster=\"$cluster\",namespace=\"$namespace\",job=\"prometheus.scrape.be\",uri!~\"/actuator.*\"}[1m])),0.000001)",
                      "legendFormat": "평균"
                    },
                    {
                      "refId": "B",
                      "expr": "histogram_quantile(0.95,sum by(le)(rate(http_server_requests_seconds_bucket{cluster=\"$cluster\",namespace=\"$namespace\",job=\"prometheus.scrape.be\",uri!~\"/actuator.*\"}[1m])))",
                      "legendFormat": "p95"
                    },
                    {
                      "refId": "C",
                      "expr": "histogram_quantile(0.99,sum by(le)(rate(http_server_requests_seconds_bucket{cluster=\"$cluster\",namespace=\"$namespace\",job=\"prometheus.scrape.be\",uri!~\"/actuator.*\"}[1m])))",
                      "legendFormat": "p99"
                    }
                  ]
                },
                {
                  "id": 4,
                  "title": "Pod별 성공 요청률",
                  "type": "timeseries",
                  "description": "새 Pod의 트래픽 처리를 15초 수집 간격으로 확인합니다. 최초 성공 요청의 정확한 시각은 아닙니다.",
                  "gridPos": {
                    "x": 12,
                    "y": 8,
                    "w": 12,
                    "h": 8
                  },
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${prom}"
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "reqps"
                    },
                    "overrides": []
                  },
                  "targets": [
                    {
                      "refId": "A",
                      "expr": "sum by(pod)(rate(http_server_requests_seconds_count{cluster=\"$cluster\",namespace=\"$namespace\",job=\"prometheus.scrape.be\",uri!~\"/actuator.*\",status=~\"2..\"}[1m]))",
                      "legendFormat": "{{pod}}"
                    }
                  ]
                },
                {
                  "id": 5,
                  "title": "Pod CPU",
                  "type": "timeseries",
                  "description": "",
                  "gridPos": {
                    "x": 0,
                    "y": 16,
                    "w": 12,
                    "h": 8
                  },
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${prom}"
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "cores"
                    },
                    "overrides": []
                  },
                  "targets": [
                    {
                      "refId": "A",
                      "expr": "sum by(pod) (rate(container_cpu_usage_seconds_total{cluster=\"$cluster\",namespace=\"$namespace\",container!=\"\",container!=\"POD\"}[1m]))",
                      "legendFormat": "{{pod}}"
                    }
                  ]
                },
                {
                  "id": 6,
                  "title": "Pod 메모리 working set",
                  "type": "timeseries",
                  "description": "",
                  "gridPos": {
                    "x": 12,
                    "y": 16,
                    "w": 12,
                    "h": 8
                  },
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${prom}"
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "bytes"
                    },
                    "overrides": []
                  },
                  "targets": [
                    {
                      "refId": "A",
                      "expr": "sum by(pod) (container_memory_working_set_bytes{cluster=\"$cluster\",namespace=\"$namespace\",container!=\"\",container!=\"POD\"})",
                      "legendFormat": "{{pod}}"
                    }
                  ]
                },
                {
                  "id": 7,
                  "title": "Pod CPU / requests",
                  "type": "timeseries",
                  "description": "",
                  "gridPos": {
                    "x": 0,
                    "y": 24,
                    "w": 12,
                    "h": 8
                  },
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${prom}"
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "percentunit"
                    },
                    "overrides": []
                  },
                  "targets": [
                    {
                      "refId": "A",
                      "expr": "sum by(pod) (rate(container_cpu_usage_seconds_total{cluster=\"$cluster\",namespace=\"$namespace\",container!=\"\",container!=\"POD\"}[1m])) / (sum by(pod) (kube_pod_container_resource_requests{cluster=\"$cluster\",namespace=\"$namespace\",resource=\"cpu\"}) > 0)",
                      "legendFormat": "{{pod}}"
                    }
                  ]
                },
                {
                  "id": 8,
                  "title": "Pod 메모리 / requests",
                  "type": "timeseries",
                  "description": "",
                  "gridPos": {
                    "x": 12,
                    "y": 24,
                    "w": 12,
                    "h": 8
                  },
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${prom}"
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "percentunit"
                    },
                    "overrides": []
                  },
                  "targets": [
                    {
                      "refId": "A",
                      "expr": "sum by(pod) (container_memory_working_set_bytes{cluster=\"$cluster\",namespace=\"$namespace\",container!=\"\",container!=\"POD\"}) / (sum by(pod) (kube_pod_container_resource_requests{cluster=\"$cluster\",namespace=\"$namespace\",resource=\"memory\"}) > 0)",
                      "legendFormat": "{{pod}}"
                    }
                  ]
                },
                {
                  "id": 9,
                  "title": "Node CPU",
                  "type": "timeseries",
                  "description": "이 환경의 Pod가 배치된 Node입니다. 전체 Node 사용량이므로 공유 Node의 다른 환경 사용량도 포함합니다.",
                  "gridPos": {
                    "x": 0,
                    "y": 32,
                    "w": 12,
                    "h": 8
                  },
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${prom}"
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "cores"
                    },
                    "overrides": []
                  },
                  "targets": [
                    {
                      "refId": "A",
                      "expr": "label_replace(sum by(instance) (rate(container_cpu_usage_seconds_total{cluster=\"$cluster\",id=\"/\"}[1m])),\"node\",\"$1\",\"instance\",\"(.+)\") * on(node) group_left() max by(node) (kube_pod_info{cluster=\"$cluster\",namespace=\"$namespace\"})",
                      "legendFormat": "{{node}} cores"
                    }
                  ]
                },
                {
                  "id": 10,
                  "title": "Node 메모리 working set",
                  "type": "timeseries",
                  "description": "",
                  "gridPos": {
                    "x": 12,
                    "y": 32,
                    "w": 12,
                    "h": 8
                  },
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${prom}"
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "bytes"
                    },
                    "overrides": []
                  },
                  "targets": [
                    {
                      "refId": "A",
                      "expr": "label_replace(container_memory_working_set_bytes{cluster=\"$cluster\",id=\"/\"},\"node\",\"$1\",\"instance\",\"(.+)\") * on(node) group_left() max by(node) (kube_pod_info{cluster=\"$cluster\",namespace=\"$namespace\"})",
                      "legendFormat": "{{node}}"
                    }
                  ]
                },
                {
                  "id": 11,
                  "title": "Node CPU / 전체 Pod requests",
                  "type": "timeseries",
                  "description": "",
                  "gridPos": {
                    "x": 0,
                    "y": 40,
                    "w": 12,
                    "h": 8
                  },
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${prom}"
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "percentunit"
                    },
                    "overrides": []
                  },
                  "targets": [
                    {
                      "refId": "A",
                      "expr": "(label_replace(sum by(instance) (rate(container_cpu_usage_seconds_total{cluster=\"$cluster\",id=\"/\"}[1m])),\"node\",\"$1\",\"instance\",\"(.+)\") * on(node) group_left() max by(node) (kube_pod_info{cluster=\"$cluster\",namespace=\"$namespace\"})) / on(node) (sum by(node)(kube_pod_container_resource_requests{cluster=\"$cluster\",resource=\"cpu\"}) > 0)",
                      "legendFormat": "{{node}}"
                    }
                  ]
                },
                {
                  "id": 12,
                  "title": "Node 메모리 / 전체 Pod requests",
                  "type": "timeseries",
                  "description": "",
                  "gridPos": {
                    "x": 12,
                    "y": 40,
                    "w": 12,
                    "h": 8
                  },
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${prom}"
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "percentunit"
                    },
                    "overrides": []
                  },
                  "targets": [
                    {
                      "refId": "A",
                      "expr": "(label_replace(container_memory_working_set_bytes{cluster=\"$cluster\",id=\"/\"},\"node\",\"$1\",\"instance\",\"(.+)\") * on(node) group_left() max by(node) (kube_pod_info{cluster=\"$cluster\",namespace=\"$namespace\"})) / on(node) (sum by(node)(kube_pod_container_resource_requests{cluster=\"$cluster\",resource=\"memory\"}) > 0)",
                      "legendFormat": "{{node}}"
                    }
                  ]
                },
                {
                  "id": 13,
                  "title": "HPA current·desired·max",
                  "type": "timeseries",
                  "description": "",
                  "gridPos": {
                    "x": 0,
                    "y": 48,
                    "w": 12,
                    "h": 8
                  },
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${prom}"
                  },
                  "fieldConfig": {
                    "defaults": {
                      "unit": "short"
                    },
                    "overrides": []
                  },
                  "targets": [
                    {
                      "refId": "A",
                      "expr": "kube_horizontalpodautoscaler_status_current_replicas{cluster=\"$cluster\",namespace=\"$namespace\",horizontalpodautoscaler=\"be-load-test\"}",
                      "legendFormat": "current"
                    },
                    {
                      "refId": "B",
                      "expr": "kube_horizontalpodautoscaler_status_desired_replicas{cluster=\"$cluster\",namespace=\"$namespace\",horizontalpodautoscaler=\"be-load-test\"}",
                      "legendFormat": "desired"
                    },
                    {
                      "refId": "C",
                      "expr": "kube_horizontalpodautoscaler_spec_max_replicas{cluster=\"$cluster\",namespace=\"$namespace\",horizontalpodautoscaler=\"be-load-test\"}",
                      "legendFormat": "max"
                    }
                  ]
                },
                {
                  "id": 14,
                  "title": "HPA 조건",
                  "type": "timeseries",
                  "description": "",
                  "gridPos": {
                    "x": 12,
                    "y": 48,
                    "w": 12,
                    "h": 8
                  },
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${prom}"
                  },
