AWSTemplateFormatVersion: "2010-09-09"
Description: dameokja v2 dev (ECS on EC2, app instance nginx/FE/BE/Redis + AI API instance)

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: existing public subnet in ap-northeast-2b
  InstanceType:
    Type: String
    Default: t3.medium
  AiInstanceType:
    Type: String
    Default: t3.small
  # 지금 인스턴스의 AMI로 고정. SSM 권장 AMI 경로를 쓰면 AWS가 새 AMI를 낼 때마다 다음 배포에서 인스턴스가 교체됨
  AmiId:
    Type: AWS::EC2::Image::Id
    Default: ami-01c8e9f48048c29a4
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: dameokja.com hosted zone
  DbSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: existing dev1 DB server security group

  GhcrCredentialsArn:
    Type: String
    Description: Secrets Manager secret ARN with GHCR username/PAT (read:packages), created by hand
  S3BucketName:
    Type: String
    Default: dameokja-906462447513-ap-northeast-2-an
  S3UploadPrefix:
    Type: String
    Default: image/

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: dameokja-dev

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: dameokja v2 dev instance (nginx 80/443)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
      Tags:
        - { Key: Name, Value: dameokja-dev-v2 }

  # ECS 에이전트가 클러스터에 등록하고, SSM으로 SSH 없이 접속하기 위한 역할
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      # certbot DNS 방식(certbot-dns-route53)으로 dev/v2 도메인 인증서를 받기 위한 권한. _acme-challenge TXT 레코드만 바꿀 수 있음
      Policies:
        - PolicyName: certbot-dns-route53
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [route53:ListHostedZones, route53:GetChange]
                Resource: "*"
              - Effect: Allow
                Action: route53:ChangeResourceRecordSets
                Resource: !Sub "arn:aws:route53:::hostedzone/${HostedZoneId}"
                Condition:
                  ForAllValues:StringEquals:
                    route53:ChangeResourceRecordSetsNormalizedRecordNames:
                      - _acme-challenge.dev.dameokja.com
                      - _acme-challenge.v2.dameokja.com
                    route53:ChangeResourceRecordSetsRecordTypes: [TXT]

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref InstanceSecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          echo "ECS_CLUSTER=${Cluster}" >> /etc/ecs/ecs.config
      Tags:
        - { Key: Name, Value: dameokja-dev-v2 }

  # AI API 서버: 모델은 외부에서 돌고 이 서버는 API 처리만 함. 앱 인스턴스(BE)에서만 접근
  AiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: dameokja v2 dev AI API (8000 from app instance)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8000, ToPort: 8000, SourceSecurityGroupId: !Ref InstanceSecurityGroup }
        # 임시: 테스트용 전체 공개. 테스트 끝나면 이 줄 삭제
        - { IpProtocol: tcp, FromPort: 8000, ToPort: 8000, CidrIp: 0.0.0.0/0 }
      Tags:
        - { Key: Name, Value: dameokja-dev-v2-ai }

  # 같은 ECS 클러스터에 등록. Task는 인스턴스 타입(attribute:ecs.instance-type)으로 앱/AI 인스턴스를 구분해 배치
  AiInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref AiInstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref AiSecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          echo "ECS_CLUSTER=${Cluster}" >> /etc/ecs/ecs.config
      Tags:
        - { Key: Name, Value: dameokja-dev-v2-ai }

  # 서버 시간대를 KST로. UserData는 처음 부팅 때만 실행되고 바꾸면 인스턴스가 재시작되므로, 실행 중인 인스턴스에 SSM으로 적용
  TimezoneAssociation:
    Type: AWS::SSM::Association
    Properties:
      Name: AWS-RunShellScript
      Targets:
        - { Key: InstanceIds, Values: [!Ref Instance, !Ref AiInstance] }
      Parameters:
        commands: [timedatectl set-timezone Asia/Seoul]

  # BE 컨테이너는 uid 10001로 /var/log/dameokja에 로그를 씀. ECS가 없는 호스트 경로를 root 소유로 만들기 전에 미리 생성
  LogDirAssociation:
    Type: AWS::SSM::Association
    Properties:
      Name: AWS-RunShellScript
      Targets:
        - { Key: InstanceIds, Values: [!Ref Instance] }
      Parameters:
        commands:
          - mkdir -p /var/log/dameokja/nginx
          - chown 10001:10001 /var/log/dameokja

  # CloudWatch Agent: nginx·BE 파일 로그와 메모리·디스크·BE 지표 수집 (v1 setup-host.sh와 같은 작업).
  # 설정을 바꾸면 이 Association이 다시 실행되어 Agent에 반영됨
  CloudWatchAgentAssociation:
    Type: AWS::SSM::Association
    DependsOn: LogDirAssociation
    Properties:
      Name: AWS-RunShellScript
      Targets:
        - { Key: InstanceIds, Values: [!Ref Instance] }
      Parameters:
        commands:
          - set -e
          - dnf install -y amazon-cloudwatch-agent logrotate
          - |
            cat > /etc/logrotate.d/dameokja-nginx <<'EOF'
            # nginx SLI 접근 로그 회전. 컨테이너가 파일을 계속 열고 있으므로 copytruncate로 같은 파일을 비운다.
            # CloudWatch Agent는 파일 크기가 줄어들면 처음부터 다시 읽는다.
            /var/log/dameokja/nginx/*.log {
                daily
                rotate 7
                maxsize 50M
                missingok
                notifempty
                compress
                delaycompress
                copytruncate
            }
            EOF
          - |
            cat > /opt/aws/amazon-cloudwatch-agent/etc/prometheus.yaml <<'EOF'
            # CloudWatch Agent가 BE의 Spring Boot Actuator(Prometheus 형식)를 1분마다 읽는다.
            # 서버 위치: /opt/aws/amazon-cloudwatch-agent/etc/prometheus.yaml
            global:
              scrape_interval: 1m
              scrape_timeout: 10s
            scrape_configs:
              - job_name: dameokja-backend
                metrics_path: /actuator/prometheus
                sample_limit: 10000
                static_configs:
                  - targets: ["127.0.0.1:8080"]   # host 네트워크의 BE 포트
                    labels:
                      env: dev
                # info 타입(jvm_info 등)은 Agent가 처리하지 못해 매분 오류 로그를 남기므로 수집 단계에서 버린다.
                metric_relabel_configs:
                  - source_labels: [__name__]
                    regex: ".*_info"
                    action: drop
            EOF
          - |
            cat > /opt/aws/amazon-cloudwatch-agent/etc/dameokja.json <<'EOF'
            {
              "agent": {
                "metrics_collection_interval": 60,
                "run_as_user": "root",
                "omit_hostname": true
              },
              "logs": {
                "logs_collected": {
                  "files": {
                    "collect_list": [
                      {
                        "file_path": "/var/log/dameokja/nginx/access.json.log",
                        "log_group_name": "/dameokja/dev/nginx-access",
                        "log_stream_name": "{instance_id}",
                        "retention_in_days": 30
                      },
                      {
                        "file_path": "/var/log/dameokja/backend.log",
                        "log_group_name": "/dameokja/dev/backend",
                        "log_stream_name": "{instance_id}",
                        "retention_in_days": 30,
                        "multi_line_start_pattern": "^\\d{4}-\\d{2}-\\d{2}T"
                      }
                    ]
                  }
                },
                "metrics_collected": {
                  "prometheus": {
                    "log_group_name": "/dameokja/dev/prometheus",
                    "prometheus_config_path": "/opt/aws/amazon-cloudwatch-agent/etc/prometheus.yaml",
                    "emf_processor": {
                      "metric_declaration_dedup": true,
                      "metric_namespace": "Dameokja/dev/App",
                      "metric_declaration": [
                        {
                          "source_labels": [
                            "job"
                          ],
                          "label_matcher": "^dameokja-backend$",
                          "dimensions": [
                            [
                              "env"
                            ]
                          ],
                          "metric_selectors": [
                            "^tomcat_threads_(busy|current|config_max)_threads$",
                            "^hikaricp_connections_(active|idle|pending|max)$",
                            "^hikaricp_connections_timeout_total$",
                            "^jvm_threads_(live|daemon|peak)_threads$"
                          ]
                        },
                        {
                          "source_labels": [
                            "job"
                          ],
                          "label_matcher": "^dameokja-backend$",
                          "dimensions": [
                            [
                              "env",
                              "state"
                            ]
                          ],
                          "metric_selectors": [
                            "^jvm_threads_states_threads$"
                          ]
                        },
                        {
                          "source_labels": [
                            "job",
                            "uri"
                          ],
                          "label_matcher": "^dameokja-backend;/api/v1/(refrigerators/\\{refrigeratorId\\}/(ingredients|notifications|notifications/stream|notifications/unread-count)|ingredients/\\{ingredientId\\})$",
                          "dimensions": [
                            [
                              "env",
                              "method",
                              "uri"
                            ]
                          ],
                          "metric_selectors": [
                            "^http_server_requests_seconds_(count|sum)$"
                          ]
                        }
                      ]
                    }
                  }
                }
              },
              "metrics": {
                "namespace": "CWAgent",
                "append_dimensions": {
                  "InstanceId": "${aws:InstanceId}"
                },
                "metrics_collected": {
                  "mem": {
                    "measurement": [
                      "mem_used_percent"
                    ]
                  },
                  "disk": {
                    "measurement": [
                      "used_percent"
                    ],
                    "resources": [
                      "/"
                    ],
                    "drop_device": true
                  },
                  "net": {
                    "measurement": [
                      "err_in",
                      "err_out",
                      "drop_in",
                      "drop_out"
                    ],
                    "resources": [
                      "ens5"
                    ]
                  },
                  "netstat": {
                    "measurement": [
                      "tcp_established",
                      "tcp_time_wait"
                    ]
                  },
                  "processes": {
                    "measurement": [
                      "running",
                      "blocked"
                    ]
                  },
                  "procstat": [
                    {
                      "exe": "java",
                      "measurement": [
                        "cpu_usage",
                        "memory_rss"
                      ]
                    },
                    {
                      "exe": "nginx",
                      "measurement": [
                        "cpu_usage",
                        "memory_rss"
                      ]
                    },
                    {
                      "exe": "node",
                      "measurement": [
                        "cpu_usage",
                        "memory_rss"
                      ]
                    }
                  ]
                }
              }
            }
            EOF
          - /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -s -c file:/opt/aws/amazon-cloudwatch-agent/etc/dameokja.json

  # AI 서버 CloudWatch Agent: FastAPI /metrics(RunPod 처리·LLM·프로세스)와 서버 메모리 사용률 (#137)
  # /metrics는 루프백 요청이면 내부 API 키 없이 열림(AI 저장소). 설정을 바꾸면 이 Association이 다시 실행됨
  AiCloudWatchAgentAssociation:
    Type: AWS::SSM::Association
    Properties:
      Name: AWS-RunShellScript
      Targets:
        - { Key: InstanceIds, Values: [!Ref AiInstance] }
      Parameters:
        commands:
          - set -e
          - dnf install -y amazon-cloudwatch-agent
          - |
            cat > /opt/aws/amazon-cloudwatch-agent/etc/prometheus.yaml <<'EOF'
            global:
              scrape_interval: 1m
              scrape_timeout: 10s
            scrape_configs:
              - job_name: dameokja-ai
                metrics_path: /metrics
                static_configs:
                  - targets: ["127.0.0.1:8000"]   # host 네트워크의 AI 포트
                    labels:
                      env: dev
                metric_relabel_configs:
                  - source_labels: [__name__]
                    regex: "process_(cpu_seconds_total|resident_memory_bytes)|dameokja_analysis_(queue_size|active)|dameokja_remote_worker_stage_seconds_(sum|count)|dameokja_remote_llm_(tokens_total|tokens_per_second_(sum|count)|model_load_seconds_(sum|count))"
                    action: keep
            EOF
          - |
            cat > /opt/aws/amazon-cloudwatch-agent/etc/dameokja.json <<'EOF'
            {
              "agent": {
                "metrics_collection_interval": 60,
                "run_as_user": "root",
                "omit_hostname": true
              },
              "logs": {
                "metrics_collected": {
                  "prometheus": {
                    "log_group_name": "/dameokja/dev/prometheus",
                    "prometheus_config_path": "/opt/aws/amazon-cloudwatch-agent/etc/prometheus.yaml",
                    "emf_processor": {
                      "metric_declaration_dedup": true,
                      "metric_namespace": "Dameokja/dev/Ai",
                      "metric_declaration": [
                        {
                          "source_labels": [
                            "job"
                          ],
                          "label_matcher": "^dameokja-ai$",
                          "dimensions": [
                            [
                              "env"
                            ]
                          ],
                          "metric_selectors": [
                            "^process_(cpu_seconds_total|resident_memory_bytes)$",
                            "^dameokja_analysis_(queue_size|active)$",
                            "^dameokja_remote_llm_model_load_seconds_(sum|count)$"
                          ]
                        },
                        {
                          "source_labels": [
                            "job",
                            "stage"
                          ],
                          "label_matcher": "^dameokja-ai;(worker_total|worker_queue_wait|ocr|llm)$",
                          "dimensions": [
                            [
                              "env",
                              "stage"
                            ]
                          ],
                          "metric_selectors": [
                            "^dameokja_remote_worker_stage_seconds_(sum|count)$"
                          ]
                        },
                        {
                          "source_labels": [
                            "job",
                            "type"
                          ],
                          "label_matcher": "^dameokja-ai;(prompt|completion)$",
                          "dimensions": [
                            [
                              "env",
                              "type"
                            ]
                          ],
                          "metric_selectors": [
                            "^dameokja_remote_llm_tokens_total$",
                            "^dameokja_remote_llm_tokens_per_second_(sum|count)$"
                          ]
                        }
                      ]
                    }
                  }
                }
              },
              "metrics": {
                "namespace": "CWAgent",
                "append_dimensions": {
                  "InstanceId": "${aws:InstanceId}"
                },
                "metrics_collected": {
                  "mem": {
                    "measurement": [
                      "mem_used_percent"
                    ]
                  }
                }
              }
            }
            EOF
          - /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -s -c file:/opt/aws/amazon-cloudwatch-agent/etc/dameokja.json

  # 고정 IP 없이 자동 할당 공인 IP를 가리킴. 인스턴스를 중지/시작하면 IP가 바뀌므로 스택을 다시 배포해야 갱신됨
  DnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: v2.dameokja.com.
      Type: A
      TTL: "300"
      ResourceRecords: [!GetAtt Instance.PublicIp]

  # 사용자가 쓰는 dev 주소. v1 → v2를 가중치 레코드로 옮긴 뒤 v1 레코드는 제거함(#51)
  DevDomainV2Record:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: dev.dameokja.com.
      Type: A
      TTL: "300"
      SetIdentifier: v2
      Weight: 100
      ResourceRecords: [!GetAtt Instance.PublicIp]

  # 기존 dev1 DB 보안그룹에 앱 인스턴스(BE)의 3306 접근만 추가. 스택 삭제 시 이 규칙만 제거됨
  DbIngressFromApp:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DbSecurityGroupId
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref InstanceSecurityGroup
      Description: dameokja v2 dev app instance

  # nginx 설정. 컨테이너가 시작할 때 이 값을 conf.d/default.conf로 씀 (v1은 서버에 파일 복사)
  NginxConfParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /dameokja-v2-dev/nginx/default.conf
      Type: String
      Value: |
        map $http_upgrade $connection_upgrade {
            default upgrade;
            '' close;
        }

        # SLI 집계용 API 분류 (v1/dev/nginx/default.conf와 같음)
        map "$request_method $uri" $slo_route {
            default "-";
            "~^POST /api/v1/refrigerators/[^/]+/ingredients$" ingredient_create;
            "~^GET /api/v1/refrigerators/[^/]+/ingredients$" ingredient_read;
            "~^GET /api/v1/ingredients/[^/]+$" ingredient_read;
            "~^GET /api/v1/refrigerators/[^/]+/notifications(/stream|/unread-count)?$" notification_poll;
            "~^POST /api/v1/ingredients/[^/]+$" aux_consume;
            "~^POST /api/v1/push-subscriptions$" aux_push_subscribe;
        }

        log_format slo_json escape=json '{"time":"$time_iso8601","method":"$request_method",'
            '"uri":"$uri","status":$status,"route":"$slo_route","request_time":$request_time,'
            '"upstream_status":"$upstream_status","upstream_time":"$upstream_response_time",'
            '"bytes":$body_bytes_sent}';

        server {
            listen 80;
            server_name dev.dameokja.com v2.dameokja.com;
            return 308 https://$host$request_uri;
        }

        server {
            listen 443 ssl;
            server_name dev.dameokja.com v2.dameokja.com;

            # dev·v2 두 도메인이 들어 있는 인증서 (certbot DNS 방식으로 발급)
            ssl_certificate /etc/letsencrypt/live/dev.dameokja.com/fullchain.pem;
            ssl_certificate_key /etc/letsencrypt/live/dev.dameokja.com/privkey.pem;
            ssl_protocols TLSv1.2 TLSv1.3;

            access_log /var/log/nginx/access.log main;
            access_log /var/log/nginx/app/access.json.log slo_json;

            location = /nginx-health {
                access_log off;
                default_type text/plain;
                return 200 "ok\n";
            }

            proxy_http_version 1.1;
            # location 안에 proxy_set_header가 하나라도 있으면 여기 값은 상속되지 않음 (/api, /는 따로 적음)
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # host 네트워크라 FE·BE는 같은 인스턴스의 127.0.0.1 포트
            location ~ ^/(swagger-ui(?:/|$)|swagger-ui\.html$|v3/api-docs(?:\.yaml$|/|$)) {
                proxy_pass http://127.0.0.1:8080;
            }

            location ~ ^/api(?:/|$) {
                proxy_pass http://127.0.0.1:8080;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $remote_addr;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_buffering off;
            }

            location / {
                proxy_pass http://127.0.0.1:3000;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $remote_addr;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_buffering off;
            }
        }

  # ECS 에이전트가 이미지 받기(GHCR 토큰)와 SSM 값 읽기에 쓰는 역할
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dameokja-dev-ecs-task-execution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-app-config
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameters
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/dameokja-v2-dev/*"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/dameokja-v2-dev-fe/*"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/dameokja-v2-dev-ai/*"
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref GhcrCredentialsArn

  # BE 컨테이너가 쓰는 역할. 프로필 이미지 버킷의 업로드 경로만 허용
  BackendTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dameokja-dev-backend-task
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: profile-images
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub "arn:aws:s3:::${S3BucketName}/${S3UploadPrefix}*"
              # 프로필 기본 이미지 한 파일만 읽기
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${S3BucketName}/profiles/default.png"

  # AI 서버: BE가 올린 이미지를 읽어 서명 URL을 만듦
  AiTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dameokja-dev-ai-task
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: read-images
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${S3BucketName}/${S3UploadPrefix}*"

  # 팀원(IAM 그룹 dameokja-iam, 콘솔에서 관리)이 v2 dev 설정값(SSM)을 조회·생성·수정·삭제하고, 인스턴스에 Session Manager로 접속
  TeamSsmAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: dameokja-v2-dev-ssm-team
      Groups: [dameokja-iam]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:GetParametersByPath
              - ssm:GetParameterHistory
              - ssm:PutParameter
              - ssm:DeleteParameter
              - ssm:DeleteParameters
              - ssm:AddTagsToResource
              - ssm:ListTagsForResource
            Resource:
              - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/dameokja-v2-dev/*"
              - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/dameokja-v2-dev-*"
          # 콘솔 목록 보기용 (값은 볼 수 없음)
          - Effect: Allow
            Action: ssm:DescribeParameters
            Resource: "*"
          # Session Manager로 v2 dev 인스턴스(앱, AI)에 접속
          - Effect: Allow
            Action: ssm:StartSession
            Resource:
              - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Instance}"
              - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${AiInstance}"
              - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:document/SSM-SessionManagerRunShell"
          # 자기 세션만 종료·재개
          - Effect: Allow
            Action: [ssm:TerminateSession, ssm:ResumeSession]
            Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:session/${!aws:username}-*"
          # 콘솔에서 접속 가능한 인스턴스·세션 목록 보기
          - Effect: Allow
            Action: [ssm:DescribeInstanceInformation, ssm:DescribeSessions, ssm:GetConnectionStatus]
            Resource: "*"

  # BE/FE(dev 브랜치)와 CLOUD(main) GitHub Actions가 Task Definition 등록과 Service 갱신에 쓰는 역할
  GitHubEcsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dameokja-dev-github-ecs-deploy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  - repo:100-hours-a-week@167328634/KTB4-5th-BE@1344691625:ref:refs/heads/dev
                  - repo:100-hours-a-week@167328634/KTB4-5th-FE@1344691246:ref:refs/heads/dev
                  - repo:100-hours-a-week@167328634/KTB4-5th-CLOUD@1349507673:ref:refs/heads/main
                  - repo:100-hours-a-week@167328634/KTB4-5th-AI@1344690862:ref:refs/heads/main
      Policies:
        - PolicyName: ecs-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # 파라미터 이름만 조회한다. 이 API는 리소스별 권한 제한을 지원하지 않는다.
              - Effect: Allow
                Action: ssm:DescribeParameters
                Resource: "*"
              - Effect: Allow
                Action: [ecs:RegisterTaskDefinition, ecs:DescribeTaskDefinition]
                Resource: "*"
              - Effect: Allow
                Action: [ecs:UpdateService, ecs:DescribeServices]
                Resource: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/${Cluster}/*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: [!GetAtt TaskExecutionRole.Arn, !GetAtt BackendTaskRole.Arn, !GetAtt AiTaskRole.Arn]

  # 서비스별 Task Definition은 infra/v2/ecs/dev/*.json (ecs-deploy.yml이 등록)
  # 인스턴스 1대·포트 직접 사용(host 네트워크)이라 옛 Task를 내리고 새 Task를 올림(배포 중 잠깐 끊김)
  # 새 Task가 계속 실패하면 ECS가 이전 버전으로 되돌림
  # TaskDefinition은 버전(revision) 없이 family만 적어 최신 버전을 씀. 새 버전은 ecs-deploy.yml이 올리고 스택은 건드리지 않음

  # 80/443, TLS 종료 후 FE(3000)/BE(8080)로 전달
  NginxService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: dameokja-dev-nginx
      Cluster: !Ref Cluster
      TaskDefinition: dameokja-dev-nginx
      LaunchType: EC2
      DesiredCount: 1
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      PlacementConstraints:
        - Type: memberOf
          Expression: !Sub "attribute:ecs.instance-type == ${InstanceType}"

  # FE (3000)
  FrontendService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: dameokja-dev-frontend
      Cluster: !Ref Cluster
      TaskDefinition: dameokja-dev-frontend
      LaunchType: EC2
      DesiredCount: 1
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      PlacementConstraints:
        - Type: memberOf
          Expression: !Sub "attribute:ecs.instance-type == ${InstanceType}"

  # BE (8080)
  BackendService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: dameokja-dev-backend
      Cluster: !Ref Cluster
      TaskDefinition: dameokja-dev-backend
      LaunchType: EC2
      DesiredCount: 1
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      PlacementConstraints:
        - Type: memberOf
          Expression: !Sub "attribute:ecs.instance-type == ${InstanceType}"

  # Redis (127.0.0.1:6379, 같은 인스턴스의 BE만 사용)
  RedisService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: dameokja-dev-redis
      Cluster: !Ref Cluster
      TaskDefinition: dameokja-dev-redis
      LaunchType: EC2
      DesiredCount: 1
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      PlacementConstraints:
        - Type: memberOf
          Expression: !Sub "attribute:ecs.instance-type == ${InstanceType}"

  # AI API (8000, AI 인스턴스. 앱 인스턴스의 BE만 호출)
  AiService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: dameokja-dev-ai
      Cluster: !Ref Cluster
      TaskDefinition: dameokja-dev-ai
      LaunchType: EC2
      DesiredCount: 1
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      PlacementConstraints:
        - Type: memberOf
          Expression: !Sub "attribute:ecs.instance-type == ${AiInstanceType}"

  # AI 대시보드 (#137)
  AiDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: dameokja-dev-ai
      DashboardBody: !Sub '{"widgets": [{"type": "text", "x": 0, "y": 0, "width": 24, "height": 2, "properties": {"markdown": "## 다먹자 dev AI\nCPU·메모리는 ECS·EC2 기본 지표와 AI 서버 Agent, 나머지는 FastAPI `/metrics`를 Agent가 1분마다 수집(#137). RunPod·LLM 지표는 분석 요청이 있어야 생깁니다."}}, {"type": "text", "x": 0, "y": 2, "width": 24, "height": 1, "properties": {"markdown": "### AI 자원·FastAPI 프로세스 (Dameokja/dev/Ai, CloudWatch Agent)"}}, {"type": "metric", "x": 0, "y": 3, "width": 8, "height": 6, "properties": {"title": "AI CPU 사용률(%)", "view": "timeSeries", "region": "${AWS::Region}", "period": 60, "stat": "Average", "metrics": [["AWS/ECS", "CPUUtilization", "ClusterName", "${Cluster}", "ServiceName", "dameokja-dev-ai", {"label": "ECS 서비스"}], ["AWS/EC2", "CPUUtilization", "InstanceId", "${AiInstance}", {"label": "AI 서버"}], [{"expression": "cpu / 60 * 100", "label": "FastAPI 프로세스(1 vCPU 기준)"}], ["Dameokja/dev/Ai", "process_cpu_seconds_total", "env", "dev", {"id": "cpu", "stat": "Sum", "visible": false}]], "yAxis": {"left": {"min": 0, "max": 100}}}}, {"type": "metric", "x": 8, "y": 3, "width": 8, "height": 6, "properties": {"title": "AI 메모리 사용률(%)", "view": "timeSeries", "region": "${AWS::Region}", "period": 60, "stat": "Average", "metrics": [["AWS/ECS", "MemoryUtilization", "ClusterName", "${Cluster}", "ServiceName", "dameokja-dev-ai", {"label": "ECS 서비스(예약 대비)"}], ["CWAgent", "mem_used_percent", "InstanceId", "${AiInstance}", {"label": "AI 서버"}]], "yAxis": {"left": {"min": 0, "max": 100}}}}, {"type": "metric", "x": 16, "y": 3, "width": 8, "height": 6, "properties": {"title": "FastAPI 프로세스", "view": "timeSeries", "region": "${AWS::Region}", "period": 60, "stat": "Average", "metrics": [[{"expression": "rss / 1048576", "label": "메모리 RSS(MB)"}], ["Dameokja/dev/Ai", "process_resident_memory_bytes", "env", "dev", {"id": "rss", "visible": false}], ["Dameokja/dev/Ai", "dameokja_analysis_queue_size", "env", "dev", {"label": "대기열", "yAxis": "right", "stat": "Maximum"}], ["Dameokja/dev/Ai", "dameokja_analysis_active", "env", "dev", {"label": "처리 중", "yAxis": "right", "stat": "Maximum"}]]}}, {"type": "text", "x": 0, "y": 9, "width": 24, "height": 1, "properties": {"markdown": "### RunPod 처리 (Worker 응답의 단계 시간)"}}, {"type": "metric", "x": 0, "y": 10, "width": 16, "height": 6, "properties": {"title": "단계별 평균 시간(초)", "view": "timeSeries", "region": "${AWS::Region}", "period": 60, "stat": "Average", "metrics": [[{"expression": "IF(c0 > 0, s0 / c0, 0)", "label": "Worker 전체"}], ["Dameokja/dev/Ai", "dameokja_remote_worker_stage_seconds_sum", "env", "dev", "stage", "worker_total", {"id": "s0", "stat": "Sum", "visible": false}], ["Dameokja/dev/Ai", "dameokja_remote_worker_stage_seconds_count", "env", "dev", "stage", "worker_total", {"id": "c0", "stat": "Sum", "visible": false}], [{"expression": "IF(c1 > 0, s1 / c1, 0)", "label": "Worker 대기"}], ["Dameokja/dev/Ai", "dameokja_remote_worker_stage_seconds_sum", "env", "dev", "stage", "worker_queue_wait", {"id": "s1", "stat": "Sum", "visible": false}], ["Dameokja/dev/Ai", "dameokja_remote_worker_stage_seconds_count", "env", "dev", "stage", "worker_queue_wait", {"id": "c1", "stat": "Sum", "visible": false}], [{"expression": "IF(c2 > 0, s2 / c2, 0)", "label": "OCR"}], ["Dameokja/dev/Ai", "dameokja_remote_worker_stage_seconds_sum", "env", "dev", "stage", "ocr", {"id": "s2", "stat": "Sum", "visible": false}], ["Dameokja/dev/Ai", "dameokja_remote_worker_stage_seconds_count", "env", "dev", "stage", "ocr", {"id": "c2", "stat": "Sum", "visible": false}], [{"expression": "IF(c3 > 0, s3 / c3, 0)", "label": "LLM"}], ["Dameokja/dev/Ai", "dameokja_remote_worker_stage_seconds_sum", "env", "dev", "stage", "llm", {"id": "s3", "stat": "Sum", "visible": false}], ["Dameokja/dev/Ai", "dameokja_remote_worker_stage_seconds_count", "env", "dev", "stage", "llm", {"id": "c3", "stat": "Sum", "visible": false}]]}}, {"type": "metric", "x": 16, "y": 10, "width": 8, "height": 6, "properties": {"title": "RunPod 호출 수", "view": "timeSeries", "region": "${AWS::Region}", "period": 60, "stat": "Sum", "metrics": [["Dameokja/dev/Ai", "dameokja_remote_worker_stage_seconds_count", "env", "dev", "stage", "worker_total", {"label": "RunPod 호출 성공"}]]}}, {"type": "text", "x": 0, "y": 16, "width": 24, "height": 1, "properties": {"markdown": "### LLM (RunPod Ollama)"}}, {"type": "metric", "x": 0, "y": 17, "width": 8, "height": 6, "properties": {"title": "토큰 수(분당)", "view": "timeSeries", "region": "${AWS::Region}", "period": 60, "stat": "Sum", "metrics": [["Dameokja/dev/Ai", "dameokja_remote_llm_tokens_total", "env", "dev", "type", "prompt", {"label": "프롬프트"}], ["Dameokja/dev/Ai", "dameokja_remote_llm_tokens_total", "env", "dev", "type", "completion", {"label": "생성"}]]}}, {"type": "metric", "x": 8, "y": 17, "width": 8, "height": 6, "properties": {"title": "평균 처리량(토큰/초)", "view": "timeSeries", "region": "${AWS::Region}", "period": 60, "stat": "Average", "metrics": [[{"expression": "IF(n0 > 0, t0 / n0, 0)", "label": "프롬프트"}], ["Dameokja/dev/Ai", "dameokja_remote_llm_tokens_per_second_sum", "env", "dev", "type", "prompt", {"id": "t0", "stat": "Sum", "visible": false}], ["Dameokja/dev/Ai", "dameokja_remote_llm_tokens_per_second_count", "env", "dev", "type", "prompt", {"id": "n0", "stat": "Sum", "visible": false}], [{"expression": "IF(n1 > 0, t1 / n1, 0)", "label": "생성"}], ["Dameokja/dev/Ai", "dameokja_remote_llm_tokens_per_second_sum", "env", "dev", "type", "completion", {"id": "t1", "stat": "Sum", "visible": false}], ["Dameokja/dev/Ai", "dameokja_remote_llm_tokens_per_second_count", "env", "dev", "type", "completion", {"id": "n1", "stat": "Sum", "visible": false}]]}}, {"type": "metric", "x": 16, "y": 17, "width": 8, "height": 6, "properties": {"title": "모델 로드 평균 시간(초)", "view": "timeSeries", "region": "${AWS::Region}", "period": 60, "stat": "Average", "metrics": [[{"expression": "IF(lc > 0, ls / lc, 0)", "label": "평균"}], ["Dameokja/dev/Ai", "dameokja_remote_llm_model_load_seconds_sum", "env", "dev", {"id": "ls", "stat": "Sum", "visible": false}], ["Dameokja/dev/Ai", "dameokja_remote_llm_model_load_seconds_count", "env", "dev", {"id": "lc", "stat": "Sum", "visible": false}]]}}]}'

Outputs:
  ClusterName:
    Value: !Ref Cluster
  InstanceId:
    Value: !Ref Instance
  PublicIp:
    Value: !GetAtt Instance.PublicIp
  InstanceSecurityGroupId:
    Value: !Ref InstanceSecurityGroup
  AiInstanceId:
    Value: !Ref AiInstance
  AiPrivateIp:
    Value: !GetAtt AiInstance.PrivateIp
