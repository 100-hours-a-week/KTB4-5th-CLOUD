AWSTemplateFormatVersion: "2010-09-09"
Description: dameokja v2 dev (ECS on EC2, app instance nginx/FE/BE/Redis + AI API instance)

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: existing public subnet in ap-northeast-2b
  InstanceType:
    Type: String
    Default: t3.medium
  AiInstanceType:
    Type: String
    Default: t3.small
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ecs/optimized-ami/amazon-linux-2023/recommended/image_id
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: dameokja.com hosted zone
  DbSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: existing dev1 DB server security group

  GhcrCredentialsArn:
    Type: String
    Description: Secrets Manager secret ARN with GHCR username/PAT (read:packages), created by hand
  FeImage:
    Type: String
    Default: ghcr.io/100-hours-a-week/ktb4-5th-fe:not-deployed
  BeImage:
    Type: String
    Default: ghcr.io/100-hours-a-week/ktb4-5th-be:not-deployed
  AppDesiredCount:
    Type: Number
    Default: 0
    Description: 0 until amd64 images exist
  S3BucketName:
    Type: String
    Default: dameokja-906462447513-ap-northeast-2-an
  S3UploadPrefix:
    Type: String
    Default: image/

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: dameokja-dev

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: dameokja v2 dev instance (nginx 80/443)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
      Tags:
        - { Key: Name, Value: dameokja-dev-v2 }

  # ECS 에이전트가 클러스터에 등록하고, SSM으로 SSH 없이 접속하기 위한 역할
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      # certbot DNS 방식(certbot-dns-route53)으로 dev/v2 도메인 인증서를 받기 위한 권한. _acme-challenge TXT 레코드만 바꿀 수 있음
      Policies:
        - PolicyName: certbot-dns-route53
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [route53:ListHostedZones, route53:GetChange]
                Resource: "*"
              - Effect: Allow
                Action: route53:ChangeResourceRecordSets
                Resource: !Sub "arn:aws:route53:::hostedzone/${HostedZoneId}"
                Condition:
                  ForAllValues:StringEquals:
                    route53:ChangeResourceRecordSetsNormalizedRecordNames:
                      - _acme-challenge.dev.dameokja.com
                      - _acme-challenge.v2.dameokja.com
                    route53:ChangeResourceRecordSetsRecordTypes: [TXT]

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref InstanceSecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          echo "ECS_CLUSTER=${Cluster}" >> /etc/ecs/ecs.config
      Tags:
        - { Key: Name, Value: dameokja-dev-v2 }

  # AI API 서버: 모델은 외부에서 돌고 이 서버는 API 처리만 함. 앱 인스턴스(BE)에서만 접근
  AiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: dameokja v2 dev AI API (8000 from app instance)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8000, ToPort: 8000, SourceSecurityGroupId: !Ref InstanceSecurityGroup }
      Tags:
        - { Key: Name, Value: dameokja-dev-v2-ai }

  # 같은 ECS 클러스터에 등록. Task는 인스턴스 타입(attribute:ecs.instance-type)으로 앱/AI 인스턴스를 구분해 배치
  AiInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref AiInstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref AiSecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          echo "ECS_CLUSTER=${Cluster}" >> /etc/ecs/ecs.config
      Tags:
        - { Key: Name, Value: dameokja-dev-v2-ai }

  # 서버 시간대를 KST로. UserData는 처음 부팅 때만 실행되고 바꾸면 인스턴스가 재시작되므로, 실행 중인 인스턴스에 SSM으로 적용
  TimezoneAssociation:
    Type: AWS::SSM::Association
    Properties:
      Name: AWS-RunShellScript
      Targets:
        - { Key: InstanceIds, Values: [!Ref Instance, !Ref AiInstance] }
      Parameters:
        commands: [timedatectl set-timezone Asia/Seoul]

  # BE 컨테이너는 uid 10001로 /var/log/dameokja에 로그를 씀. ECS가 없는 호스트 경로를 root 소유로 만들기 전에 미리 생성
  LogDirAssociation:
    Type: AWS::SSM::Association
    Properties:
      Name: AWS-RunShellScript
      Targets:
        - { Key: InstanceIds, Values: [!Ref Instance] }
      Parameters:
        commands:
          - mkdir -p /var/log/dameokja/nginx
          - chown 10001:10001 /var/log/dameokja

  # 고정 IP 없이 자동 할당 공인 IP를 가리킴. 인스턴스를 중지/시작하면 IP가 바뀌므로 스택을 다시 배포해야 갱신됨
  DnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: v2.dameokja.com.
      Type: A
      TTL: "300"
      ResourceRecords: [!GetAtt Instance.PublicIp]

  # 기존 dev1 DB 보안그룹에 앱 인스턴스(BE)의 3306 접근만 추가. 스택 삭제 시 이 규칙만 제거됨
  DbIngressFromApp:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DbSecurityGroupId
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref InstanceSecurityGroup
      Description: dameokja v2 dev app instance

  # nginx 설정. 컨테이너가 시작할 때 이 값을 conf.d/default.conf로 씀 (v1은 서버에 파일 복사)
  NginxConfParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /dameokja-v2-dev/nginx/default.conf
      Type: String
      Value: |
        map $http_upgrade $connection_upgrade {
            default upgrade;
            '' close;
        }

        # SLI 집계용 API 분류 (v1/dev/nginx/default.conf와 같음)
        map "$request_method $uri" $slo_route {
            default "-";
            "~^POST /api/v1/refrigerators/[^/]+/ingredients$" ingredient_create;
            "~^GET /api/v1/refrigerators/[^/]+/ingredients$" ingredient_read;
            "~^GET /api/v1/ingredients/[^/]+$" ingredient_read;
            "~^GET /api/v1/refrigerators/[^/]+/notifications(/stream|/unread-count)?$" notification_poll;
            "~^POST /api/v1/ingredients/[^/]+$" aux_consume;
            "~^POST /api/v1/push-subscriptions$" aux_push_subscribe;
        }

        log_format slo_json escape=json '{"time":"$time_iso8601","method":"$request_method",'
            '"uri":"$uri","status":$status,"route":"$slo_route","request_time":$request_time,'
            '"upstream_status":"$upstream_status","upstream_time":"$upstream_response_time",'
            '"bytes":$body_bytes_sent}';

        server {
            listen 80;
            server_name dev.dameokja.com v2.dameokja.com;
            return 308 https://$host$request_uri;
        }

        server {
            listen 443 ssl;
            server_name dev.dameokja.com v2.dameokja.com;

            # dev·v2 두 도메인이 들어 있는 인증서 (certbot DNS 방식으로 발급)
            ssl_certificate /etc/letsencrypt/live/dev.dameokja.com/fullchain.pem;
            ssl_certificate_key /etc/letsencrypt/live/dev.dameokja.com/privkey.pem;
            ssl_protocols TLSv1.2 TLSv1.3;

            access_log /var/log/nginx/access.log main;
            access_log /var/log/nginx/app/access.json.log slo_json;

            location = /nginx-health {
                access_log off;
                default_type text/plain;
                return 200 "ok\n";
            }

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # host 네트워크라 FE·BE는 같은 인스턴스의 127.0.0.1 포트
            location ~ ^/(swagger-ui(?:/|$)|swagger-ui\.html$|v3/api-docs(?:\.yaml$|/|$)) {
                proxy_pass http://127.0.0.1:8080;
            }

            location ~ ^/api(?:/|$) {
                proxy_pass http://127.0.0.1:8080;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_buffering off;
            }

            location / {
                proxy_pass http://127.0.0.1:3000;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_buffering off;
            }
        }

  # ECS 에이전트가 이미지 받기(GHCR 토큰)와 SSM 값 읽기에 쓰는 역할
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dameokja-dev-ecs-task-execution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-app-config
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameters
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/dameokja-v2-dev/*"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/dameokja-v2-dev-fe/*"
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref GhcrCredentialsArn

  # BE 컨테이너가 쓰는 역할. 프로필 이미지 버킷의 업로드 경로만 허용
  BackendTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dameokja-dev-backend-task
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: profile-images
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub "arn:aws:s3:::${S3BucketName}/${S3UploadPrefix}*"

  # BE/FE(dev 브랜치)와 CLOUD(main) GitHub Actions가 Task Definition 등록과 Service 갱신에 쓰는 역할
  GitHubEcsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dameokja-dev-github-ecs-deploy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  - repo:100-hours-a-week@167328634/KTB4-5th-BE@1344691625:ref:refs/heads/dev
                  - repo:100-hours-a-week@167328634/KTB4-5th-FE@1344691246:ref:refs/heads/dev
                  - repo:100-hours-a-week@167328634/KTB4-5th-CLOUD@1349507673:ref:refs/heads/main
      Policies:
        - PolicyName: ecs-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ecs:RegisterTaskDefinition, ecs:DescribeTaskDefinition]
                Resource: "*"
              - Effect: Allow
                Action: [ecs:UpdateService, ecs:DescribeServices]
                Resource: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/${Cluster}/*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: [!GetAtt TaskExecutionRole.Arn, !GetAtt BackendTaskRole.Arn]

  # 앱 인스턴스 Task: nginx, FE, BE. host 네트워크라 포트를 인스턴스에서 직접 씀
  AppTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: dameokja-dev-app
      NetworkMode: host
      RequiresCompatibilities: [EC2]
      # 인스턴스 등록 메모리 3839 중 OS·에이전트 몫을 남긴 Task 전체 한계 (컨테이너는 이 안에서 나눠 씀)
      Memory: "3584"
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt BackendTaskRole.Arn
      Volumes:
        - { Name: letsencrypt, Host: { SourcePath: /etc/letsencrypt } }
        - { Name: nginx-log, Host: { SourcePath: /var/log/dameokja/nginx } }
        - { Name: backend-log, Host: { SourcePath: /var/log/dameokja } }
        - { Name: localtime, Host: { SourcePath: /etc/localtime } }
      ContainerDefinitions:
        - Name: nginx
          Image: nginx:stable
          Essential: true
          EntryPoint: [sh, -c]
          Command: ['printf "%s" "$NGINX_CONF" > /etc/nginx/conf.d/default.conf && exec nginx -g "daemon off;"']
          Secrets:
            - { Name: NGINX_CONF, ValueFrom: !Ref NginxConfParameter }
          MountPoints:
            - { SourceVolume: letsencrypt, ContainerPath: /etc/letsencrypt, ReadOnly: true }
            - { SourceVolume: nginx-log, ContainerPath: /var/log/nginx/app }
            - { SourceVolume: localtime, ContainerPath: /etc/localtime, ReadOnly: true }
        - Name: frontend
          Image: !Ref FeImage
          Essential: true
          RepositoryCredentials: { CredentialsParameter: !Ref GhcrCredentialsArn }
          Secrets:
            - { Name: DISCORD_BUG_REPORT_WEBHOOK_URL, ValueFrom: /dameokja-v2-dev-fe/DISCORD_BUG_REPORT_WEBHOOK_URL }
        - Name: backend
          Image: !Ref BeImage
          Essential: true
          RepositoryCredentials: { CredentialsParameter: !Ref GhcrCredentialsArn }
          Environment:
            - { Name: SERVER_TOMCAT_MBEANREGISTRY_ENABLED, Value: "true" }
          Secrets:
            - { Name: SERVER_PORT, ValueFrom: /dameokja-v2-dev/SERVER_PORT }
            - { Name: SERVER_FORWARD_HEADERS_STRATEGY, ValueFrom: /dameokja-v2-dev/SERVER_FORWARD_HEADERS_STRATEGY }
            - { Name: SPRING_DATASOURCE_URL, ValueFrom: /dameokja-v2-dev/SPRING_DATASOURCE_URL }
            - { Name: SPRING_DATASOURCE_USERNAME, ValueFrom: /dameokja-v2-dev/SPRING_DATASOURCE_USERNAME }
            - { Name: SPRING_DATASOURCE_PASSWORD, ValueFrom: /dameokja-v2-dev/SPRING_DATASOURCE_PASSWORD }
            - { Name: SPRING_JPA_HIBERNATE_DDL_AUTO, ValueFrom: /dameokja-v2-dev/SPRING_JPA_HIBERNATE_DDL_AUTO }
            - { Name: DB_USERNAME, ValueFrom: /dameokja-v2-dev/DB_USERNAME }
            - { Name: DB_PASSWORD, ValueFrom: /dameokja-v2-dev/DB_PASSWORD }
            - { Name: JWT_SECRET, ValueFrom: /dameokja-v2-dev/JWT_SECRET }
            - { Name: AUTH_COOKIE_SECURE, ValueFrom: /dameokja-v2-dev/AUTH_COOKIE_SECURE }
            - { Name: PUSH_AUTH_ENCRYPTION_KEY, ValueFrom: /dameokja-v2-dev/PUSH_AUTH_ENCRYPTION_KEY }
            - { Name: PUSH_AUTH_ENCRYPTION_KEY_VERSION, ValueFrom: /dameokja-v2-dev/PUSH_AUTH_ENCRYPTION_KEY_VERSION }
            - { Name: PUSH_VAPID_PRIVATE_KEY, ValueFrom: /dameokja-v2-dev/PUSH_VAPID_PRIVATE_KEY }
            - { Name: PUSH_VAPID_PUBLIC_KEY, ValueFrom: /dameokja-v2-dev/PUSH_VAPID_PUBLIC_KEY }
            - { Name: PUSH_VAPID_KEY_VERSION, ValueFrom: /dameokja-v2-dev/PUSH_VAPID_KEY_VERSION }
            - { Name: SENTRY_AUTO_INIT, ValueFrom: /dameokja-v2-dev/SENTRY_AUTO_INIT }
            - { Name: OTEL_TRACES_EXPORTER, ValueFrom: /dameokja-v2-dev/OTEL_TRACES_EXPORTER }
            - { Name: OTEL_METRICS_EXPORTER, ValueFrom: /dameokja-v2-dev/OTEL_METRICS_EXPORTER }
            - { Name: OTEL_LOGS_EXPORTER, ValueFrom: /dameokja-v2-dev/OTEL_LOGS_EXPORTER }
            - { Name: SENTRY_ENVIRONMENT, ValueFrom: /dameokja-v2-dev/SENTRY_ENVIRONMENT }
            - { Name: S3_BUCKET, ValueFrom: /dameokja-v2-dev/S3_BUCKET }
            - { Name: S3_REGION, ValueFrom: /dameokja-v2-dev/S3_REGION }
            - { Name: S3_UPLOAD_PREFIX, ValueFrom: /dameokja-v2-dev/S3_UPLOAD_PREFIX }
            - { Name: S3_PRESIGNED_URL_TTL, ValueFrom: /dameokja-v2-dev/S3_PRESIGNED_URL_TTL }
            - { Name: S3_MAX_UPLOAD_BYTES, ValueFrom: /dameokja-v2-dev/S3_MAX_UPLOAD_BYTES }
            - { Name: S3_ALLOWED_CONTENT_TYPES, ValueFrom: /dameokja-v2-dev/S3_ALLOWED_CONTENT_TYPES }
            - { Name: AI_BASE_URL, ValueFrom: /dameokja-v2-dev/AI_BASE_URL }
            - { Name: AI_INTERNAL_API_KEY, ValueFrom: /dameokja-v2-dev/AI_INTERNAL_API_KEY }
            - { Name: AI_CONNECT_TIMEOUT, ValueFrom: /dameokja-v2-dev/AI_CONNECT_TIMEOUT }
            - { Name: AI_READ_TIMEOUT, ValueFrom: /dameokja-v2-dev/AI_READ_TIMEOUT }
            - { Name: ANALYSIS_JOB_TTL, ValueFrom: /dameokja-v2-dev/ANALYSIS_JOB_TTL }
          MountPoints:
            - { SourceVolume: backend-log, ContainerPath: /var/log/dameokja }
            - { SourceVolume: localtime, ContainerPath: /etc/localtime, ReadOnly: true }

  # 인스턴스 1대·포트 직접 사용이라 옛 Task를 내리고 새 Task를 올림(배포 중 잠깐 끊김)
  AppService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: dameokja-dev-app
      Cluster: !Ref Cluster
      TaskDefinition: !Ref AppTaskDefinition
      LaunchType: EC2
      DesiredCount: !Ref AppDesiredCount
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        # Task가 계속 실패하면 배포를 멈추고 실패로 끝냄 (없으면 CloudFormation이 몇 시간 동안 안정화를 기다림)
        DeploymentCircuitBreaker: { Enable: true, Rollback: false }
      PlacementConstraints:
        - Type: memberOf
          Expression: !Sub "attribute:ecs.instance-type == ${InstanceType}"

Outputs:
  ClusterName:
    Value: !Ref Cluster
  InstanceId:
    Value: !Ref Instance
  PublicIp:
    Value: !GetAtt Instance.PublicIp
  InstanceSecurityGroupId:
    Value: !Ref InstanceSecurityGroup
  AiInstanceId:
    Value: !Ref AiInstance
  AiPrivateIp:
    Value: !GetAtt AiInstance.PrivateIp
