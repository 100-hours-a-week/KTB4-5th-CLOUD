AWSTemplateFormatVersion: "2010-09-09"
Description: dameokja v2 DB 마이그레이션 테스트 (원본 = stage DB, 대상 = 이 스택의 신규 MySQL, 부하·전환 실행 서버)

# stage 스택(dameokja-stage)은 수정하지 않는다. 이 스택만 만들고 지우면 테스트 자원이 함께 정리된다
# 예외: 신규 DB(복제)·실행 서버(덤프·부하·검사)가 stage DB 3306에 붙도록 stage DB 보안그룹 인바운드 2개를 이 스택 소유로 추가한다
# stage DB의 복제·관리 계정(migadmin·repl)은 같은 SSM 비밀번호로 stage DB에 별도로 만든다
# 접속 계정 비밀번호는 스택 밖에서 만든 SSM SecureString(/dameokja-migtest/MIG_PASSWORD, REPL_PASSWORD)을 인스턴스가 읽는다
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: stage VPC (10.10.0.0/16)
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: stage private 서브넷 (stage 앱 사용자는 10.10.32.0/19에서만 접속 가능)
  StageDbSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: stage DbSecurityGroup (dameokja-stage-db)
  # stage와 같은 고정 일반 AL2023 x86_64 AMI (params/stage.json의 DbAmiId)
  AmiId:
    Type: AWS::EC2::Image::Id
  # 신규 DB는 설계의 대상 M7i·AMD64 (크기 미확정, stage DB와 같은 large)
  DbInstanceType:
    Type: String
    Default: m7i.large
  # DB 직접 부하(쓰기 100·읽기 200/초)에서 CPU 10% 미만이라 작은 크기로 충분 (2026-10-16 측정)
  RunnerInstanceType:
    Type: String
    Default: t3.small
  DbVolumeGiB:
    Type: Number
    Default: 30
  # 원본(v1)·stage와 같은 버전으로 고정
  MysqlVersion:
    Type: String
    Default: 8.4.11

Mappings:
  Scripts:
    Db:
      # 신규 DB 설치. AL2023의 mysql-community /etc/my.cnf는 my.cnf.d를 읽지 않아 includedir를 직접 추가함
      # (stage DB는 이 줄이 없어 dameokja.cnf의 gtid_mode=ON 등이 적용되지 않은 상태로 확인됨, 2026-10-16)
      Setup: |
        timedatectl set-timezone Asia/Seoul
        dnf install -y https://dev.mysql.com/get/mysql84-community-release-el9-1.noarch.rpm amazon-cloudwatch-agent
        dnf install -y mysql-community-server-$MYSQL_VERSION
        mkdir -p /etc/my.cnf.d
        grep -q '^!includedir /etc/my.cnf.d' /etc/my.cnf || echo '!includedir /etc/my.cnf.d' >> /etc/my.cnf
        cat > /etc/my.cnf.d/dameokja.cnf <<EOF
        [mysqld]
        server_id=$SERVER_ID
        log_bin=binlog
        gtid_mode=ON
        enforce_gtid_consistency=ON
        log_replica_updates=ON
        binlog_expire_logs_seconds=2592000
        default_time_zone='+09:00'
        skip_replica_start=ON
        relay_log_recovery=ON
        EOF
        systemctl enable --now mysqld
        # 임시 root 비밀번호로 계정을 만들고 root는 알 수 없는 값으로 바꿈. 이후 관리는 migadmin으로 함
        # RPM 설치본은 validate_password(MEDIUM)가 켜져 있어 대소문자·숫자·특수문자를 모두 포함해야 함
        TMP=$(grep 'temporary password' /var/log/mysqld.log | tail -1 | awk '{print $NF}')
        MIG=$(aws ssm get-parameter --region ap-northeast-2 --name /dameokja-migtest/MIG_PASSWORD --with-decryption --query Parameter.Value --output text)
        REPL=$(aws ssm get-parameter --region ap-northeast-2 --name /dameokja-migtest/REPL_PASSWORD --with-decryption --query Parameter.Value --output text)
        ROOT="Rt_$(openssl rand -hex 16)_9z"
        mysql --connect-expired-password -uroot -p"$TMP" <<SQL
        ALTER USER 'root'@'localhost' IDENTIFIED BY '$ROOT';
        CREATE USER 'migadmin'@'10.10.%' IDENTIFIED BY '$MIG';
        GRANT ALL PRIVILEGES ON *.* TO 'migadmin'@'10.10.%' WITH GRANT OPTION;
        CREATE USER 'repl'@'10.10.%' IDENTIFIED BY '$REPL';
        GRANT REPLICATION SLAVE ON *.* TO 'repl'@'10.10.%';
        SET PERSIST super_read_only = $READ_ONLY;
        SQL
        /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -s -c ssm:/dameokja-migtest/cloudwatch-agent

Resources:
  RunnerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: dameokja migtest runner (no inbound)
      VpcId: !Ref VpcId
      Tags:
        - { Key: Name, Value: dameokja-migtest-runner }

  # 신규 DB. 실행 서버에서 오는 3306만 허용
  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: dameokja migtest target MySQL (3306 from runner)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 3306, ToPort: 3306, SourceSecurityGroupId: !Ref RunnerSecurityGroup }
      Tags:
        - { Key: Name, Value: dameokja-migtest-db }

  # stage DB(원본) 3306: 신규 DB의 복제 연결, 실행 서버의 덤프·부하·검사. 스택 삭제 시 이 규칙들만 사라짐
  StageDbFromTargetIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref StageDbSecurityGroupId
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref DbSecurityGroup
      Description: migtest target replication
  StageDbFromRunnerIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref StageDbSecurityGroupId
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref RunnerSecurityGroup
      Description: migtest runner

  # Session Manager 접속, CloudWatch Agent 지표, 테스트 계정 비밀번호 읽기
  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: migtest-parameters
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/dameokja-migtest/*"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref Role]

  # CPU·메모리·디스크 60초 수집. 네임스페이스를 분리해 기존 대시보드와 섞지 않음
  CloudWatchAgentConfig:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /dameokja-migtest/cloudwatch-agent
      Type: String
      Value: |
        {"metrics":{"namespace":"dameokja/migtest","append_dimensions":{"InstanceId":"${aws:InstanceId}"},
         "metrics_collected":{"cpu":{"measurement":["usage_active","usage_iowait"],"totalcpu":true,"metrics_collection_interval":60},
          "mem":{"measurement":["used_percent","available"],"metrics_collection_interval":60},
          "disk":{"measurement":["used_percent","used","free","total"],"resources":["/"],"metrics_collection_interval":60}}}}

  # 신규: 복제 수신 전용으로 시작. 계정 생성 후 super_read_only를 영구 설정해 조기 쓰기를 막음
  TargetDbInstance:
    Type: AWS::EC2::Instance
    DependsOn: CloudWatchAgentConfig
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref DbInstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref DbSecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      MetadataOptions: { HttpTokens: required }
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: !Ref DbVolumeGiB, VolumeType: gp3 }
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            set -e
            SERVER_ID=2 READ_ONLY=ON MYSQL_VERSION=${MysqlVersion}
            ${Setup}
          - Setup: !FindInMap [Scripts, Db, Setup]
      Tags:
        - { Key: Name, Value: dameokja-migtest-target-db }

  # 실행 서버: mysql 클라이언트·mysqldump(stage DB와 같은 버전), Percona Toolkit, Python(PyMySQL)
  RunnerInstance:
    Type: AWS::EC2::Instance
    DependsOn: CloudWatchAgentConfig
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref RunnerInstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref RunnerSecurityGroup]
      IamInstanceProfile: !Ref InstanceProfile
      MetadataOptions: { HttpTokens: required }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          timedatectl set-timezone Asia/Seoul
          dnf install -y https://dev.mysql.com/get/mysql84-community-release-el9-1.noarch.rpm amazon-cloudwatch-agent
          # pt-table-checksum은 perl 기본 모듈(Sys::Hostname 등)이 필요해 perl 전체 묶음을 설치
          dnf install -y mysql-community-client-${MysqlVersion} perl perl-Sys-Hostname perl-DBI perl-DBD-MySQL \
            perl-IO-Socket-SSL python3-pip diffutils
          # Percona Toolkit 버전 고정 (MySQL 8.4의 SHOW REPLICA STATUS 지원)
          curl -fsSL -o /tmp/pt.tgz https://downloads.percona.com/downloads/percona-toolkit/3.7.0/source/tarball/percona-toolkit-3.7.0.tar.gz
          tar -xzf /tmp/pt.tgz -C /opt && ln -sf /opt/percona-toolkit-3.7.0/bin/pt-table-checksum /usr/local/bin/
          pip3 install PyMySQL==1.1.1
          /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -s -c ssm:/dameokja-migtest/cloudwatch-agent
      Tags:
        - { Key: Name, Value: dameokja-migtest-runner }

Outputs:
  TargetDbInstanceId:
    Value: !Ref TargetDbInstance
  TargetDbPrivateIp:
    Value: !GetAtt TargetDbInstance.PrivateIp
  RunnerInstanceId:
    Value: !Ref RunnerInstance
