AWSTemplateFormatVersion: "2010-09-09"
Description: dameokja v2 prod DB 자동 장애조치 (Orchestrator, 승격 훅, fencing)

# prod.yaml이 CloudFormation 템플릿 크기 한도(51,200바이트)에 가까워 DB 장애조치 자원은 이 스택(dameokja-prod-db-ha)에 따로 둠 (#183)
# prod 스택의 VPC·DB·사설 영역 ID는 params/prod-db-ha.json에 적음. Primary·Standby가 바뀌면(장애조치 원복 등) 이 값도 같이 고침
Parameters:
  ProdStackName:
    Type: String
    Default: dameokja-prod
  VpcId:
    Type: AWS::EC2::VPC::Id
  # private 서브넷 B(2c). Primary(2b)와 다른 AZ
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  DbSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  DbHostedZoneId:
    Type: String
  PrimaryInstanceId:
    Type: AWS::EC2::Instance::Id
  # prod DB 서버 역할 이름. 아래 계정 Association이 서버 안에서 비밀번호를 읽도록 권한을 덧붙임
  DbRoleName:
    Type: String
  PrimaryIp:
    Type: String
  StandbyIp:
    Type: String
  # prod DB와 같은 고정 AL2023 AMI
  AmiId:
    Type: AWS::EC2::Image::Id

Resources:
  # --- Orchestrator: Primary 장애를 감지해 Standby를 자동 승격 (#183, v2 설계 22·25번)
  # 단일 인스턴스(ASG 1대 고정, 죽으면 ASG가 새로 띄움), Primary와 다른 AZ(2c). 백엔드는 로컬 SQLite라 새 서버는 토폴로지를 다시 발견함
  # Raft 쿼럼이 없어 승격 훅에서 기존 Primary를 격리(fencing)해 split-brain을 막음
  OrchestratorSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: dameokja v2 prod orchestrator (no inbound, API on localhost only)
      VpcId: !Ref VpcId
      Tags:
        - { Key: Name, Value: dameokja-prod-orchestrator }

  # Orchestrator → Primary·Standby 3306 (토폴로지 조회·승격)
  DbFromOrchestratorIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DbSecurityGroupId
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref OrchestratorSecurityGroup
      Description: orchestrator to MySQL

  # 장애조치 때 기존 Primary에 붙이는 격리 보안 그룹. 앱·복제 접속은 막고 Orchestrator만 허용(상태 확인용)
  # 보안 그룹을 바꿔도 이미 맺어진 연결은 바로 끊기지 않으므로 훅에서 super_read_only도 함께 켬
  DbFencedSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: dameokja v2 prod MySQL fenced (old primary after failover)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 3306, ToPort: 3306, SourceSecurityGroupId: !Ref OrchestratorSecurityGroup }
      Tags:
        - { Key: Name, Value: dameokja-prod-db-fenced }

  # Orchestrator가 MySQL에 접속하는 계정 비밀번호. 사람이 만들지 않고 생성 시 자동으로 정함
  OrchestratorDbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: dameokja-v2-prod/db-orchestrator
      GenerateSecretString:
        PasswordLength: 32
        RequireEachIncludedType: true
        ExcludeCharacters: "'\"`$\\/@%&;|<>(){}[]!*?#~^ "

  DbRoleReadOrchestratorSecret:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: read-db-orchestrator-secret
      Roles: [!Ref DbRoleName]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Ref OrchestratorDbSecret

  # Primary에 orchestrator 계정을 만듦. 복제로 Standby에도 생김. 비밀번호는 서버 안에서 읽음
  # SUPER: read_only 변경·복제 제어, PROCESS: 복제본 발견(processlist)
  DbOrchestratorUserAssociation:
    Type: AWS::SSM::Association
    DependsOn: DbRoleReadOrchestratorSecret
    Properties:
      AssociationName: dameokja-prod-db-orchestrator-user
      Name: AWS-RunShellScript
      Targets:
        - { Key: InstanceIds, Values: [!Ref PrimaryInstanceId] }
      Parameters:
        commands:
          - set -e
          - for i in $(seq 1 90); do mysql -uroot -e 'SELECT 1' >/dev/null 2>&1 && break; sleep 10; done
          - !Sub PW=$(aws secretsmanager get-secret-value --region ${AWS::Region} --secret-id ${OrchestratorDbSecret} --query SecretString --output text)
          - mysql -uroot -e "CREATE USER IF NOT EXISTS 'orchestrator'@'10.20.32.0/255.255.224.0' IDENTIFIED BY '$PW'; ALTER USER 'orchestrator'@'10.20.32.0/255.255.224.0' IDENTIFIED BY '$PW'; GRANT SUPER, PROCESS, REPLICATION SLAVE, REPLICATION CLIENT, RELOAD ON *.* TO 'orchestrator'@'10.20.32.0/255.255.224.0'; GRANT SELECT ON mysql.slave_master_info TO 'orchestrator'@'10.20.32.0/255.255.224.0';"

  OrchestratorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: orchestrator-failover
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref OrchestratorDbSecret
              # 승격 훅: DB 고정 이름을 새 Primary IP로
              - Effect: Allow
                Action: route53:ChangeResourceRecordSets
                Resource: !Sub "arn:aws:route53:::hostedzone/${DbHostedZoneId}"
              - Effect: Allow
                Action: [route53:GetChange, ec2:DescribeInstances]
                Resource: "*"
              # 승격 훅: 기존 Primary를 격리 보안 그룹으로. 이 스택의 DB 서버(Primary·Standby)만
              - Effect: Allow
                Action: ec2:ModifyInstanceAttribute
                Resource: !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/aws:cloudformation:stack-name: !Ref ProdStackName
                    aws:ResourceTag/aws:cloudformation:logical-id: [DbInstance, StandbyInstance]
              - Effect: Allow
                Action: ec2:ModifyInstanceAttribute
                Resource:
                  - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:security-group/${DbFencedSecurityGroup}"
                  - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:security-group/${DbSecurityGroupId}"

  OrchestratorInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref OrchestratorRole]

  # Percona Orchestrator 3.2.6(MySQL 8.4 용어 지원, Amazon Linux 2023 패키지)를 버전 고정으로 설치
  # UserData를 바꾸면 Launch Template 새 버전만 생기고 지금 서버는 그대로임. 반영하려면 서버를 종료해 ASG가 새로 띄우게 함
  OrchestratorLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref AmiId
        InstanceType: t3.micro
        IamInstanceProfile: { Arn: !GetAtt OrchestratorInstanceProfile.Arn }
        SecurityGroupIds: [!Ref OrchestratorSecurityGroup]
        MetadataOptions: { HttpTokens: required }
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - { Key: Name, Value: dameokja-prod-orchestrator }
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -e
            timedatectl set-timezone Asia/Seoul
            cat > /etc/yum.repos.d/percona-pdps-84-lts.repo <<'EOF'
            [percona-pdps-84-lts]
            name=Percona Distribution for MySQL 8.4 LTS
            baseurl=https://repo.percona.com/pdps-84-lts/yum/release/2023/RPMS/x86_64
            gpgcheck=1
            gpgkey=https://repo.percona.com/yum/PERCONA-PACKAGING-KEY
            EOF
            dnf install -y percona-orchestrator-3.2.6-22.amzn2023 jq
            # 훅에서 read_only를 바꿀 MySQL 클라이언트
            dnf install -y https://dev.mysql.com/get/mysql84-community-release-el9-1.noarch.rpm
            dnf install -y mysql-community-client

            PW=$(aws secretsmanager get-secret-value --region ${AWS::Region} --secret-id ${OrchestratorDbSecret} --query SecretString --output text)
            install -m 600 /dev/null /etc/orchestrator-topology.cnf
            printf '[client]\nuser=orchestrator\npassword=%s\n' "$PW" > /etc/orchestrator-topology.cnf
            mkdir -p /var/lib/orchestrator

            cat > /etc/orchestrator.conf.json <<'EOF'
            {
              "ListenAddress": "127.0.0.1:3000",
              "BackendDB": "sqlite",
              "SQLite3DataFile": "/var/lib/orchestrator/orchestrator.db",
              "MySQLTopologyCredentialsConfigFile": "/etc/orchestrator-topology.cnf",
              "MySQLConnectTimeoutSeconds": 1,
              "DefaultInstancePort": 3306,
              "InstancePollSeconds": 5,
              "DiscoverByShowSlaveHosts": false,
              "HostnameResolveMethod": "none",
              "MySQLHostnameResolveMethod": "",
              "SkipBinlogServerUnresolveCheck": true,
              "DetectClusterAliasQuery": "SELECT 'dameokja-prod'",
              "RecoverMasterClusterFilters": ["*"],
              "RecoverIntermediateMasterClusterFilters": [],
              "RecoveryPeriodBlockSeconds": 600,
              "ApplyMySQLPromotionAfterMasterFailover": true,
              "FailMasterPromotionIfSQLThreadNotUpToDate": true,
              "PreventCrossDataCenterMasterFailover": false,
              "DetachLostReplicasAfterMasterFailover": true,
              "MasterFailoverLostInstancesDowntimeMinutes": 60,
              "PostMasterFailoverProcesses": [
                "/usr/local/bin/dameokja-db-failover.sh '{command}' '{failedHost}' '{successorHost}' >> /var/log/orchestrator-hook.log 2>&1"
              ]
            }
            EOF

            # 승격 뒤 훅: 1) 기존 Primary 격리(보안 그룹 교체, 계획된 교체는 제외) 2) DB 고정 이름을 새 Primary로 3) 새 Primary 쓰기 허용을 재시작 뒤에도 유지 4) 기존 Primary super_read_only(닿을 때만)
            cat > /usr/local/bin/dameokja-db-failover.sh <<'EOF'
            #!/bin/bash
            cmd=$1; failed=$2; new=$3
            log() { echo "$(date '+%F %T') $*"; }
            log "시작 command=$cmd failed=$failed successor=$new"
            if [ "$cmd" != graceful-master-takeover ]; then
              id=$(aws ec2 describe-instances --region REGION --filters Name=private-ip-address,Values=$failed --query 'Reservations[].Instances[].InstanceId' --output text)
              if [ -n "$id" ] && aws ec2 modify-instance-attribute --region REGION --instance-id $id --groups FENCED_SG; then log "격리 보안 그룹 적용 $id"; else log "격리 보안 그룹 실패 id=$id"; fi
            fi
            aws route53 change-resource-record-sets --hosted-zone-id ZONE_ID --change-batch "{\"Changes\":[{\"Action\":\"UPSERT\",\"ResourceRecordSet\":{\"Name\":\"db.prod.dameokja.internal.\",\"Type\":\"A\",\"TTL\":5,\"ResourceRecords\":[{\"Value\":\"$new\"}]}}]}" && log "DNS -> $new" || log "DNS 변경 실패"
            mysql --defaults-extra-file=/etc/orchestrator-topology.cnf -h "$new" --connect-timeout=3 -e "SET PERSIST super_read_only=OFF; SET PERSIST read_only=OFF;" && log "새 Primary 쓰기 허용 유지" || log "새 Primary PERSIST 실패"
            if [ "$cmd" != graceful-master-takeover ]; then
              timeout 5 mysql --defaults-extra-file=/etc/orchestrator-topology.cnf -h "$failed" --connect-timeout=3 -e "SET PERSIST super_read_only=ON;" && log "기존 Primary super_read_only" || log "기존 Primary에 닿지 않음(격리 보안 그룹만 적용)"
            fi
            log "끝"
            EOF
            sed -i -e 's/REGION/${AWS::Region}/g' -e 's/FENCED_SG/${DbFencedSecurityGroup}/g' -e 's/ZONE_ID/${DbHostedZoneId}/g' /usr/local/bin/dameokja-db-failover.sh
            chmod 755 /usr/local/bin/dameokja-db-failover.sh

            systemctl enable --now orchestrator
            for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/api/status >/dev/null && break; sleep 2; done
            # 처음 발견할 서버. 장애조치 뒤 기존 Primary가 섞여도 Orchestrator가 역할을 구분함
            curl -s http://127.0.0.1:3000/api/discover/${PrimaryIp}/3306 >/dev/null
            curl -s http://127.0.0.1:3000/api/discover/${StandbyIp}/3306 >/dev/null

  OrchestratorAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: DbOrchestratorUserAssociation
    Properties:
      AutoScalingGroupName: dameokja-prod-orchestrator
      MinSize: "1"
      MaxSize: "1"
      DesiredCapacity: "1"
      VPCZoneIdentifier: [!Ref SubnetId]
      LaunchTemplate:
        LaunchTemplateId: !Ref OrchestratorLaunchTemplate
        Version: !GetAtt OrchestratorLaunchTemplate.LatestVersionNumber
      HealthCheckType: EC2

Outputs:
  OrchestratorAsgName:
    Value: !Ref OrchestratorAutoScalingGroup
  DbFencedSecurityGroupId:
    Value: !Ref DbFencedSecurityGroup
