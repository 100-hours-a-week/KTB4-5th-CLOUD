AWSTemplateFormatVersion: "2010-09-09"
Description: dameokja v2 prod 네트워크(VPC·서브넷·NAT). v2 앱은 v3 EKS로 전환되어 제거, v3가 이 네트워크를 재사용

# stage.yaml과 같은 구성의 v2 prod. dev(172.31)·v1 prod(10.0.0.0/24)·stage(10.10) VPC와 겹치지 않는 10.20 VPC를 새로 만듦
# 구조: dameokja.com -> ALB(TLS 종료) -> private 서브넷 ECS Task(frontend·backend 서비스, awsvpc. ALB가 경로로 나눔) -> Redis / prod 전용 MySQL
# dameokja.com은 v1 prod를 그대로 가리킴. 전환은 나중에 Route 53 가중치 레코드로 함
# Task Definition은 infra/v2/ecs/prod/*.json. Service보다 먼저 등록되어 있어야 함
# 2026-11-10 v3 EKS prod 전환 뒤 v2 앱(ECS·ALB·DB·Redis 등)을 제거하고 네트워크만 남김. v3(EKS·prod-db 등)가 이 VPC·PrivateSubnetA·NAT를 씀.
# 남은 리소스는 모두 DeletionPolicy Retain이라 이 스택을 지워도 삭제되지 않음. 네트워크는 v3 스택으로 가져온(import) 뒤 이 스택을 지울 예정.
Parameters:
  VpcCidr:
    Type: String
    Default: 10.20.0.0/16
  AzA:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: ap-northeast-2b
  AzB:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: ap-northeast-2c
  PublicSubnetACidr:
    Type: String
    Default: 10.20.0.0/20
  PublicSubnetBCidr:
    Type: String
    Default: 10.20.16.0/20
  PrivateSubnetACidr:
    Type: String
    Default: 10.20.32.0/20
  PrivateSubnetBCidr:
    Type: String
    Default: 10.20.48.0/20
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: dameokja.com hosted zone

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: dameokja-prod }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Tags:
        - { Key: Name, Value: dameokja-prod }

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # --- 서브넷: public(ALB, NAT) / private(ECS 인스턴스·Task, Redis, DB) x 2AZ
  # 앱 서버(ECS)는 2b 한 곳에만 둠. AZ 분리는 DB만 (private 2c는 DB Standby용, ALB는 서브넷 2AZ가 필수)
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AzA
      CidrBlock: !Ref PublicSubnetACidr
      Tags:
        - { Key: Name, Value: dameokja-prod-public-a }

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AzB
      CidrBlock: !Ref PublicSubnetBCidr
      Tags:
        - { Key: Name, Value: dameokja-prod-public-b }

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AzA
      CidrBlock: !Ref PrivateSubnetACidr
      Tags:
        - { Key: Name, Value: dameokja-prod-private-a }

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AzB
      CidrBlock: !Ref PrivateSubnetBCidr
      Tags:
        - { Key: Name, Value: dameokja-prod-private-b }

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: dameokja-prod-public-rt }

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # --- NAT 1개(AzA). AzA 장애 시 AzB private의 외부 통신도 끊기는 것은 감수 (구현 기록 임시 기본값)
  NatEip:
    Type: AWS::EC2::EIP
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - { Key: Name, Value: dameokja-prod-nat }

  NatGateway:
    Type: AWS::EC2::NatGateway
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - { Key: Name, Value: dameokja-prod-nat }

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: dameokja-prod-private-rt }

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # S3 트래픽(이미지 업로드·조회, ECR 레이어 등)이 NAT를 타지 않게 (무료)
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PrivateRouteTable]

  # ALB 액세스 로그 보관(30일). ALB는 버킷 정책을 확인한 뒤에야 로그 설정을 받음
  AlbLogBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "dameokja-prod-alb-logs-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - { Id: expire-30d, Status: Enabled, ExpirationInDays: 30 }

  # 서울 리전은 ELB 계정(600734575887)이 로그를 씀
  AlbLogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref AlbLogBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { AWS: arn:aws:iam::600734575887:root }
            Action: s3:PutObject
            Resource: !Sub "${AlbLogBucket.Arn}/alb/AWSLogs/${AWS::AccountId}/*"

  # --- 컨테이너 로그 (awslogs). 서비스마다 로그 그룹 하나
  # /dameokja/prod/*는 v1 prod(CloudWatch Agent)가 이미 쓰고 있어 v2 prod는 /dameokja/v2-prod/*
  FrontendLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /dameokja/v2-prod/frontend
      RetentionInDays: 30

  # BE 로그는 수집·저장 비용이 가장 커서 14일만 보관 (#175)
  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /dameokja/v2-prod/backend
      RetentionInDays: 14

  AiLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /dameokja/v2-prod/ai
      RetentionInDays: 30

  # BE 연결 풀(HikariCP) 지표 수집용 CloudWatch Agent 사이드카 설정 (ecs/prod/backend.json의 cloudwatch-agent 컨테이너가 읽음)
  # dev는 EC2 Agent(dev.yaml CloudWatchAgentAssociation)로 같은 지표를 이미 수집함
  PrometheusLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /dameokja/v2-prod/prometheus
      RetentionInDays: 30

  # CLOUD prod-dns-weight.yml(승인 job)이 dameokja.com A 레코드의 v1·v2 가중치만 바꾸는 역할
  GitHubDnsRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: dameokja-prod-github-dns
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:100-hours-a-week@167328634/KTB4-5th-CLOUD@1349507673:environment:prod
      Policies:
        - PolicyName: apex-weight
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: route53:ChangeResourceRecordSets
                Resource: !Sub "arn:aws:route53:::hostedzone/${HostedZoneId}"
                Condition:
                  ForAllValues:StringEquals:
                    route53:ChangeResourceRecordSetsNormalizedRecordNames: [dameokja.com]
                    route53:ChangeResourceRecordSetsRecordTypes: [A]
              - Effect: Allow
                Action: route53:ListResourceRecordSets
                Resource: !Sub "arn:aws:route53:::hostedzone/${HostedZoneId}"
              - Effect: Allow
                Action: route53:GetChange
                Resource: arn:aws:route53:::change/*
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Ref AWS::StackId

  # 팀원(IAM 그룹 dameokja-iam)이 prod 설정값(SSM)을 관리하고, prod 인스턴스에 Session Manager로 접속
  TeamSsmAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ManagedPolicyName: dameokja-v2-prod-ssm-team
      Groups: [dameokja-iam]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:GetParametersByPath
              - ssm:GetParameterHistory
              - ssm:PutParameter
              - ssm:DeleteParameter
              - ssm:DeleteParameters
              - ssm:AddTagsToResource
              - ssm:ListTagsForResource
            Resource:
              - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/dameokja-v2-prod/*"
              - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/dameokja-v2-prod-*"
          # ASG가 인스턴스를 바꾸므로 ID 대신 Name 태그로 허용 (앱 dameokja-prod, DB dameokja-prod-db)
          - Effect: Allow
            Action: ssm:StartSession
            Resource: !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
            Condition:
              StringLike:
                ssm:resourceTag/Name: dameokja-prod*

  # 팀원이 프로젝트 로그를 콘솔·Logs Insights에서 분석하도록 허용한다. 로그 변경·삭제 권한은 포함하지 않는다.
  TeamLogsInsightsAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ManagedPolicyName: dameokja-team-logs-insights
      Groups: [dameokja-iam]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # dev·stage·v1/v2 prod 및 프로젝트 알림 Lambda 로그만 쿼리 대상으로 허용한다.
          - Sid: QueryProjectLogGroups
            Effect: Allow
            Action:
              - logs:StartQuery
              - logs:GetLogGroupFields
              - logs:GetQueryResults
              - logs:GetLogRecord
            Resource:
              - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/dameokja/*"
              - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/dameokja-*"
          # 쿼리 결과·목록과 콘솔 선택기에 사용하는 조회는 개별 로그 그룹으로 범위를 지정할 수 없다.
          - Sid: ReadQueryResultsAndConsoleMetadata
            Effect: Allow
            Action:
              - logs:StopQuery
              - logs:DescribeFieldIndexes
              - logs:DescribeQueries
              - logs:DescribeQueryDefinitions
              - logs:DescribeLookupTables
              - logs:ListAggregateLogGroupSummaries
              - oam:ListSinks
              - tag:GetResources
            Resource: "*"

Outputs:
  VpcId:
    Value: !Ref Vpc
  PrivateSubnetA:
    Value: !Ref PrivateSubnetA
  PrivateSubnetB:
    Value: !Ref PrivateSubnetB
