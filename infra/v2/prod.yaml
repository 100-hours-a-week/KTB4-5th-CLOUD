AWSTemplateFormatVersion: "2010-09-09"
Description: dameokja v2 prod (stage와 같은 구성. 서브넷 2AZ, 앱 서버는 2b 한 곳, NAT, ALB, ECS on EC2 ASG, 자체 구축 Redis·MySQL)

# stage.yaml과 같은 구성의 v2 prod. dev(172.31)·v1 prod(10.0.0.0/24)·stage(10.10) VPC와 겹치지 않는 10.20 VPC를 새로 만듦
# 구조: dameokja.com -> ALB(TLS 종료) -> private 서브넷 ECS Task(frontend·backend 서비스, awsvpc. ALB가 경로로 나눔) -> Redis / prod 전용 MySQL
# dameokja.com은 v1 prod를 그대로 가리킴. 전환은 나중에 Route 53 가중치 레코드로 함
# Task Definition은 infra/v2/ecs/prod/*.json. Service보다 먼저 등록되어 있어야 함
Parameters:
  VpcCidr:
    Type: String
    Default: 10.20.0.0/16
  AzA:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: ap-northeast-2b
  AzB:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: ap-northeast-2c
  PublicSubnetACidr:
    Type: String
    Default: 10.20.0.0/20
  PublicSubnetBCidr:
    Type: String
    Default: 10.20.16.0/20
  PrivateSubnetACidr:
    Type: String
    Default: 10.20.32.0/20
  PrivateSubnetBCidr:
    Type: String
    Default: 10.20.48.0/20
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: dameokja.com hosted zone
  # ALB 인증서 도메인. dameokja.com 레코드는 v1·v2 가중치 레코드로 prod-dns-weight.yml이 관리 (prod 서브도메인 없음)
  DomainName:
    Type: String
    Default: dameokja.com
  # prod와 같은 m7i 계열. m7i는 large(2 vCPU, 8GB)가 가장 작은 크기
  InstanceType:
    Type: String
    Default: m7i.large
  # 지금 stage 앱 서버와 같은 ECS 최적화 AMI로 고정. SSM 권장 AMI 경로를 쓰면 AWS가 새 AMI를 낼 때마다 다음 배포에서 LaunchTemplate이 바뀜
  AmiId:
    Type: AWS::EC2::Image::Id
    Default: ami-08afa937d0ef1a748
  MinSize:
    Type: Number
    Default: 2
  MaxSize:
    Type: Number
    Default: 4
  # 10-19~24 CPU 평균 1~2%라 m7i.large(8GB)에서 줄임 (#134). MySQL 버퍼 풀 기본값 + PostgreSQL 512MB가 4GB 안에 들어감
  DbInstanceType:
    Type: String
    Default: t3.medium
  RedisInstanceType:
    Type: String
    Default: t3.small
  # 일반 AL2023 AMI(ECS 최적화 아님) ID 고정. SSM 최신 AMI 경로를 쓰면 새 AMI가 나올 때마다 DB 인스턴스가 교체됨
  DbAmiId:
    Type: AWS::EC2::Image::Id
  GhcrCredentialsArn:
    Type: String
    Description: Secrets Manager secret ARN with GHCR username/PAT (read:packages), created by hand
  S3BucketName:
    Type: String
    Default: dameokja-906462447513-ap-northeast-2-an
  S3UploadPrefix:
    Type: String
    Default: image/prod/

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: dameokja-prod }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: dameokja-prod }

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # --- 서브넷: public(ALB, NAT) / private(ECS 인스턴스·Task, Redis, DB) x 2AZ
  # 앱 서버(ECS)는 2b 한 곳에만 둠. AZ 분리는 DB만 (private 2c는 DB Standby용, ALB는 서브넷 2AZ가 필수)
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AzA
      CidrBlock: !Ref PublicSubnetACidr
      Tags:
        - { Key: Name, Value: dameokja-prod-public-a }

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AzB
      CidrBlock: !Ref PublicSubnetBCidr
      Tags:
        - { Key: Name, Value: dameokja-prod-public-b }

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AzA
      CidrBlock: !Ref PrivateSubnetACidr
      Tags:
        - { Key: Name, Value: dameokja-prod-private-a }

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AzB
      CidrBlock: !Ref PrivateSubnetBCidr
      Tags:
        - { Key: Name, Value: dameokja-prod-private-b }

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: dameokja-prod-public-rt }

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # --- NAT 1개(AzA). AzA 장애 시 AzB private의 외부 통신도 끊기는 것은 감수 (구현 기록 임시 기본값)
  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - { Key: Name, Value: dameokja-prod-nat }

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - { Key: Name, Value: dameokja-prod-nat }

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: dameokja-prod-private-rt }

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # S3 트래픽(이미지 업로드·조회, ECR 레이어 등)이 NAT를 타지 않게 (무료)
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PrivateRouteTable]

  # --- 보안그룹
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: dameokja v2 prod ALB (80/443 public)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
      Tags:
        - { Key: Name, Value: dameokja-prod-alb }

  # ECS 인스턴스 자체. Task는 awsvpc라 각자 ENI와 아래 Task용 보안그룹을 따로 가짐
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: dameokja v2 prod ECS instances (no inbound)
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: dameokja-prod-instance }

  # backend Task. ALB에서 오는 8080만. 이름·설명은 바꾸면 보안 그룹이 새로 만들어져서 app 시절 그대로 둠
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: dameokja v2 prod app task (80 from ALB)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8080, ToPort: 8080, SourceSecurityGroupId: !Ref AlbSecurityGroup }
      Tags:
        - { Key: Name, Value: dameokja-prod-app }

  # frontend Task(FE). ALB에서 오는 3000만. DB·Redis·AI에는 접근하지 않음
  FrontendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: dameokja v2 prod frontend task (3000 from ALB)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 3000, ToPort: 3000, SourceSecurityGroupId: !Ref AlbSecurityGroup }
      Tags:
        - { Key: Name, Value: dameokja-prod-frontend }

  # AI API Task. 앱 Task(BE)에서 오는 8000만
  AiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: dameokja v2 prod AI task (8000 from app task)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8000, ToPort: 8000, SourceSecurityGroupId: !Ref AppSecurityGroup }
      Tags:
        - { Key: Name, Value: dameokja-prod-ai }

  RedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: dameokja v2 prod Redis (6379 from app task)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 6379, ToPort: 6379, SourceSecurityGroupId: !Ref AppSecurityGroup }
      Tags:
        - { Key: Name, Value: dameokja-prod-redis }

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: dameokja v2 prod MySQL (3306 from app task)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 3306, ToPort: 3306, SourceSecurityGroupId: !Ref AppSecurityGroup }
      Tags:
        - { Key: Name, Value: dameokja-prod-db }

  # Replica·Standby → Primary 복제·CLONE(3306). 같은 보안 그룹 안에서만 허용 (#145, #179)
  DbReplicationIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DbSecurityGroup
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref DbSecurityGroup
      Description: DB replica to primary

  # AI Task → DB 서버 PostgreSQL(5432). 같은 서버의 MySQL과 포트만 다름
  DbPostgresFromAiIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DbSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref AiSecurityGroup
      Description: AI task PostgreSQL

  # --- 진입점: ACM 인증서 + ALB + 리스너. 서비스별 타겟 그룹·규칙은 아래
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    # internet-facing ALB는 VPC에 IGW가 붙어 있어야 만들어짐. 액세스 로그는 버킷 정책이 먼저 있어야 켜짐
    DependsOn: [InternetGatewayAttachment, AlbLogBucketPolicy]
    Properties:
      Name: dameokja-prod-alb
      Type: application
      Scheme: internet-facing
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - { Key: idle_timeout.timeout_seconds, Value: "300" } # SSE 연결 유지 (구현 기록 임시 기본값)
        # 요청별 로그(경로·상태 코드·처리 시간). nginx 로그 대신 SLO 집계에 씀(#147). Athena 테이블은 모니터링 스택
        - { Key: access_logs.s3.enabled, Value: "true" }
        - { Key: access_logs.s3.bucket, Value: !Ref AlbLogBucket }
        - { Key: access_logs.s3.prefix, Value: alb }

  # ALB 액세스 로그 보관(30일). ALB는 버킷 정책을 확인한 뒤에야 로그 설정을 받음
  AlbLogBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "dameokja-prod-alb-logs-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - { Id: expire-30d, Status: Enabled, ExpirationInDays: 30 }

  # 서울 리전은 ELB 계정(600734575887)이 로그를 씀
  AlbLogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AlbLogBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { AWS: arn:aws:iam::600734575887:root }
            Action: s3:PutObject
            Resource: !Sub "${AlbLogBucket.Arn}/alb/AWSLogs/${AWS::AccountId}/*"

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig: { Protocol: HTTPS, Port: "443", StatusCode: HTTP_301 }

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref Certificate
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig: { StatusCode: "404", ContentType: text/plain, MessageBody: not found }

  # --- backend·frontend 서비스(#147). nginx 없이 ALB가 경로로 나눠 보냄
  # 서비스마다 타겟 그룹 2개(Blue/Green)와 리스너 규칙 하나. swagger는 밖에 열지 않음(/api만)
  BackendTargetGroupBlue:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: dameokja-prod-be-blue
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 8080
      TargetType: ip
      HealthCheckPath: /actuator/health
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }

  BackendTargetGroupGreen:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: dameokja-prod-be-green
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 8080
      TargetType: ip
      HealthCheckPath: /actuator/health
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }

  FrontendTargetGroupBlue:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: dameokja-prod-fe-blue
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 3000
      TargetType: ip
      HealthCheckPath: /
      Matcher: { HttpCode: "200-399" }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }

  FrontendTargetGroupGreen:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: dameokja-prod-fe-green
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 3000
      TargetType: ip
      HealthCheckPath: /
      Matcher: { HttpCode: "200-399" }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }

  # ECS Native Blue/Green이 배포 때마다 아래 두 규칙의 가중치를 바꿔 blue <-> green을 전환
  # 그래서 실제 가중치는 템플릿(blue 100)과 다를 수 있음(2026-10-27 prod 확인: 둘 다 green 100).
  # 규칙 속성을 고치면 CloudFormation이 템플릿 가중치로 되돌려 빈 타겟 그룹으로 요청이 갈 수 있으니, 먼저 실제 가중치를 확인하고 템플릿을 맞춘다
  BackendListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 10
      Conditions:
        - Field: path-pattern
          PathPatternConfig: { Values: ["/api", "/api/*"] }
      Actions:
        - Type: forward
          ForwardConfig:
            TargetGroups:
              - { TargetGroupArn: !Ref BackendTargetGroupBlue, Weight: 100 }
              - { TargetGroupArn: !Ref BackendTargetGroupGreen, Weight: 0 }

  FrontendListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 20
      Conditions:
        - Field: path-pattern
          PathPatternConfig: { Values: ["/*"] }
      Actions:
        - Type: forward
          ForwardConfig:
            TargetGroups:
              - { TargetGroupArn: !Ref FrontendTargetGroupBlue, Weight: 100 }
              - { TargetGroupArn: !Ref FrontendTargetGroupGreen, Weight: 0 }

  # --- Redis: EC2 자체 구축 단일 노드, 이중화 없음 (v2 22번), AOF 영속화
  # AMI는 DB와 같은 고정 일반 AL2023, 역할도 DB와 같은 SSM 접속용
  RedisInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref DbAmiId
      InstanceType: !Ref RedisInstanceType
      SubnetId: !Ref PrivateSubnetA
      SecurityGroupIds: [!Ref RedisSecurityGroup]
      IamInstanceProfile: !Ref DbInstanceProfile
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -e
          timedatectl set-timezone Asia/Seoul
          dnf install -y redis6
          sed -i -e 's/^bind .*/bind 0.0.0.0/' -e 's/^protected-mode yes/protected-mode no/' \
            -e 's/^appendonly no/appendonly yes/' /etc/redis6/redis6.conf
          systemctl enable --now redis6
      Tags:
        - { Key: Name, Value: dameokja-prod-redis }

  # dev와 같은 Redis 버전(redis:7.4-alpine)을 Docker로 실행. UserData의 redis6(6.2)는 끄고 쓰지 않음
  # UserData를 바꾸면 처음 부팅 때만 실행되므로 Association으로 적용. 꺼져 있으면 켜질 때 실행되고, 이미 돌고 있으면 그대로 둠
  RedisDockerAssociation:
    Type: AWS::SSM::Association
    Properties:
      AssociationName: dameokja-prod-redis-docker
      Name: AWS-RunShellScript
      Targets:
        - { Key: InstanceIds, Values: [!Ref RedisInstance] }
      Parameters:
        commands:
          - set -e
          - dnf install -y docker
          - systemctl enable --now docker
          - systemctl disable --now redis6 || true
          - mkdir -p /var/lib/redis-data
          - if [ -z "$(docker ps -q --filter name=^redis$ --filter ancestor=redis:7.4-alpine)" ]; then docker rm -f redis || true; docker run -d --name redis --restart unless-stopped --network host -v /var/lib/redis-data:/data redis:7.4-alpine redis-server --protected-mode no --appendonly yes; fi

  # --- prod 전용 MySQL 8.4. Primary(2b) + Standby(2c, 아래 StandbyInstance). Orchestrator는 DB 이중화 다음 단계에서 추가 (#120)
  # 복제를 붙일 수 있게 처음부터 binlog·GTID를 켬. 계정·스키마는 처음 한 번 Session Manager로 만듦
  DbRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      # 앱 DB 계정 Association이 비밀번호를 서버 안에서 읽도록 (명령 기록에 비밀번호를 남기지 않음)
      Policies:
        - PolicyName: read-db-password
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/dameokja-v2-prod/SPRING_DATASOURCE_PASSWORD"
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref ReplicationSecret

  # 복제 계정(repl) 비밀번호. 사람이 만들지 않고 생성 시 자동으로 정함 (#145)
  ReplicationSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: dameokja-v2-prod/db-replication
      GenerateSecretString:
        PasswordLength: 32
        # MySQL 기본 비밀번호 정책(대소문자·숫자·특수문자)을 맞추되 셸·SQL 따옴표에 걸리는 문자는 뺌
        RequireEachIncludedType: true
        ExcludeCharacters: "'\"`$\\/@%&;|<>(){}[]!*?#~^ "

  DbInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref DbRole]

  DbInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref DbAmiId
      InstanceType: !Ref DbInstanceType
      SubnetId: !Ref PrivateSubnetA
      SecurityGroupIds: [!Ref DbSecurityGroup]
      IamInstanceProfile: !Ref DbInstanceProfile
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 30, VolumeType: gp3 }
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -e
          timedatectl set-timezone Asia/Seoul
          dnf install -y https://dev.mysql.com/get/mysql84-community-release-el9-1.noarch.rpm
          dnf install -y mysql-community-server
          cat > /etc/my.cnf.d/dameokja.cnf <<'EOF'
          [mysqld]
          server_id=1
          log_bin=binlog
          gtid_mode=ON
          enforce_gtid_consistency=ON
          default_time_zone='+09:00'
          EOF
          systemctl enable --now mysqld
      Tags:
        - { Key: Name, Value: dameokja-prod-db }

  # MySQL RPM의 /etc/my.cnf는 my.cnf.d를 읽지 않아 위 dameokja.cnf(GTID 등)가 적용되지 않음. 포함 줄을 넣고,
  # v1 prod DB에서 복제받을 수 있게 복제본 설정을 zz-replica.cnf로 덧씀(파일 이름순으로 나중에 읽혀 server_id를 덮음)
  # UserData를 바꾸면 DB 서버가 교체될 수 있어 Association으로 적용. 서버가 바뀌어도 대상이 따라가고, 꺼져 있으면 켜질 때 실행됨
  # 설정이 바뀐 경우에만 MySQL 재시작
  # 스택 생성 때 Association이 UserData의 MySQL 설치보다 먼저 돌아 /etc/my.cnf가 include 한 줄만 남고 기본 설정이 my.cnf.rpmnew로 밀려난 적이 있음.
  # 그래서 설치가 끝날 때까지 기다리고, rpmnew가 있으면 기본 설정을 되살린 뒤 include를 넣음
  DbConfigAssociation:
    Type: AWS::SSM::Association
    Properties:
      AssociationName: dameokja-prod-db-mycnf
      Name: AWS-RunShellScript
      Targets:
        - { Key: InstanceIds, Values: [!Ref DbInstance] }
      Parameters:
        commands:
          - set -e; changed=
          - for i in $(seq 1 90); do systemctl is-enabled mysqld >/dev/null 2>&1 && break; sleep 10; done
          - systemctl is-enabled mysqld >/dev/null 2>&1 || { echo 'MySQL 설치가 끝나지 않음'; exit 1; }
          - if [ -f /etc/my.cnf.rpmnew ] && ! grep -q '^\[mysqld\]' /etc/my.cnf; then cp /etc/my.cnf.rpmnew /etc/my.cnf; rm -f /etc/my.cnf.rpmnew; changed=1; fi
          - grep -q '^!includedir /etc/my.cnf.d' /etc/my.cnf || { echo '!includedir /etc/my.cnf.d' >> /etc/my.cnf; changed=1; }
          - printf '[mysqld]\nserver_id=2\nlog_replica_updates=ON\nskip_replica_start=ON\nrelay_log_recovery=ON\n' > /tmp/zz-replica.cnf
          - cmp -s /tmp/zz-replica.cnf /etc/my.cnf.d/zz-replica.cnf || { mv /tmp/zz-replica.cnf /etc/my.cnf.d/zz-replica.cnf; changed=1; }
          - if [ -n "$changed" ]; then systemctl restart mysqld; fi

  # BE가 쓰는 앱 DB 계정. 비밀번호는 SSM에서 서버 안에서 읽어 명령 기록에 남지 않음. 비밀번호를 바꾸면 이 Association을 다시 실행
  # root는 sudo 접속(auth_socket)으로 바꿔 둔 상태를 전제로 함 (2026-10-19 수동 적용)
  DbAppUserAssociation:
    Type: AWS::SSM::Association
    DependsOn: DbConfigAssociation
    Properties:
      AssociationName: dameokja-prod-db-app-user
      Name: AWS-RunShellScript
      Targets:
        - { Key: InstanceIds, Values: [!Ref DbInstance] }
      Parameters:
        commands:
          - set -e
          - for i in $(seq 1 90); do mysql -uroot -e 'SELECT 1' >/dev/null 2>&1 && break; sleep 10; done
          - !Sub PW=$(aws ssm get-parameter --region ${AWS::Region} --name /dameokja-v2-prod/SPRING_DATASOURCE_PASSWORD --with-decryption --query Parameter.Value --output text)
          - mysql -uroot -e "CREATE DATABASE IF NOT EXISTS app DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_as_cs; CREATE USER IF NOT EXISTS 'dameokja'@'10.20.32.0/255.255.224.0' IDENTIFIED BY '$PW'; ALTER USER 'dameokja'@'10.20.32.0/255.255.224.0' IDENTIFIED BY '$PW'; GRANT ALL PRIVILEGES ON app.* TO 'dameokja'@'10.20.32.0/255.255.224.0';"

  # Primary에 복제 계정과 CLONE 플러그인을 둠. Replica가 처음 한 번 CLONE으로 데이터를 받고 이후 GTID로 복제 (#145)
  DbReplicationSourceAssociation:
    Type: AWS::SSM::Association
    DependsOn: DbConfigAssociation
    Properties:
      AssociationName: dameokja-prod-db-replication-source
      Name: AWS-RunShellScript
      Targets:
        - { Key: InstanceIds, Values: [!Ref DbInstance] }
      Parameters:
        commands:
          - set -e
          - for i in $(seq 1 90); do mysql -uroot -e 'SELECT 1' >/dev/null 2>&1 && break; sleep 10; done
          - mysql -uroot -Ne "SELECT 1 FROM information_schema.plugins WHERE plugin_name='clone'" | grep -q 1 || mysql -uroot -e "INSTALL PLUGIN clone SONAME 'mysql_clone.so'"
          - !Sub PW=$(aws secretsmanager get-secret-value --region ${AWS::Region} --secret-id ${ReplicationSecret} --query SecretString --output text)
          - mysql -uroot -e "CREATE USER IF NOT EXISTS 'repl'@'10.20.32.0/255.255.224.0' IDENTIFIED BY '$PW'; ALTER USER 'repl'@'10.20.32.0/255.255.224.0' IDENTIFIED BY '$PW'; GRANT REPLICATION SLAVE, BACKUP_ADMIN ON *.* TO 'repl'@'10.20.32.0/255.255.224.0';"

  # --- Standby: Primary와 다른 AZ(private 서브넷 B, 2c)에 두는 승격 대상. 평소에는 읽기 전용으로 GTID 복제만 받음 (#179, #120)
  # 앱 트래픽은 받지 않음(읽기 분산 없음). 승격은 다음 단계의 Orchestrator가 함
  StandbyInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref DbAmiId
      InstanceType: !Ref DbInstanceType
      SubnetId: !Ref PrivateSubnetB
      SecurityGroupIds: [!Ref DbSecurityGroup]
      IamInstanceProfile: !Ref DbInstanceProfile
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 30, VolumeType: gp3 }
      # 설정은 아래 Association이 함(Primary에서 UserData 설정이 적용되지 않았던 문제를 피함)
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -e
          timedatectl set-timezone Asia/Seoul
          dnf install -y https://dev.mysql.com/get/mysql84-community-release-el9-1.noarch.rpm
          dnf install -y mysql-community-server
          systemctl enable mysqld
      Tags:
        - { Key: Name, Value: dameokja-prod-db-standby }

  # Replica(#145)와 같은 순서: 설정 → root를 sudo 접속으로 → Primary에서 CLONE → GTID 복제 시작
  # 승격되면 Primary로 쓰이므로 binlog·log_replica_updates를 켜 둠. 이미 복제 중이면 아무것도 하지 않음
  StandbyAssociation:
    Type: AWS::SSM::Association
    DependsOn: DbReplicationSourceAssociation
    Properties:
      AssociationName: dameokja-prod-db-standby
      Name: AWS-RunShellScript
      Targets:
        - { Key: InstanceIds, Values: [!Ref StandbyInstance] }
      Parameters:
        executionTimeout: ["3600"]
        commands:
          - set -e; changed=
          - for i in $(seq 1 90); do systemctl is-enabled mysqld >/dev/null 2>&1 && break; sleep 10; done
          - grep -q '^!includedir /etc/my.cnf.d' /etc/my.cnf || { echo '!includedir /etc/my.cnf.d' >> /etc/my.cnf; changed=1; }
          # replica_net_timeout 10초 + heartbeat 2초: Primary가 응답 없이 사라져도(EC2 중단) 복제가 빨리 끊겨 Orchestrator가 장애로 판단 (#183)
          - printf '[mysqld]\nserver_id=3\nlog_bin=binlog\ngtid_mode=ON\nenforce_gtid_consistency=ON\nlog_replica_updates=ON\ndefault_time_zone=+09:00\nread_only=ON\nrelay_log_recovery=ON\nreplica_net_timeout=10\n' > /tmp/zz-replica.cnf
          - cmp -s /tmp/zz-replica.cnf /etc/my.cnf.d/zz-replica.cnf || { mv /tmp/zz-replica.cnf /etc/my.cnf.d/zz-replica.cnf; changed=1; }
          - if systemctl is-active -q mysqld; then [ -z "$changed" ] || systemctl restart mysqld; else systemctl start mysqld; fi
          - waitdb() { for i in $(seq 1 90); do mysql -uroot -e 'SELECT 1' >/dev/null 2>&1 && return 0; sleep 10; done; return 1; }
          # 새로 설치한 MySQL은 root가 임시 비밀번호 상태라 Primary처럼 sudo 접속(auth_socket)으로 바꿈. CLONE 뒤에는 Primary 계정이 그대로 옴
          - "if ! mysql -uroot -e 'SELECT 1' >/dev/null 2>&1; then for i in $(seq 1 30); do grep -q 'temporary password' /var/log/mysqld.log && break; sleep 10; done; TMP=$(grep 'temporary password' /var/log/mysqld.log | tail -1 | awk '{print $NF}'); R=Aa1-$(openssl rand -hex 16); mysql -uroot -p\"$TMP\" --connect-expired-password -e \"ALTER USER root@localhost IDENTIFIED BY '$R'\"; mysql -uroot -p\"$R\" -e \"INSTALL PLUGIN auth_socket SONAME 'auth_socket.so'; ALTER USER root@localhost IDENTIFIED WITH auth_socket;\"; fi"
          - waitdb
          - if mysql -uroot -e 'SHOW REPLICA STATUS\G' | grep -q 'Source_Host'; then HB=$(mysql -uroot -Ne "SELECT HEARTBEAT_INTERVAL FROM performance_schema.replication_connection_configuration WHERE CHANNEL_NAME=''"); if [ "${HB%%.*}" != 2 ]; then mysql -uroot -e "SET GLOBAL super_read_only=OFF; STOP REPLICA; CHANGE REPLICATION SOURCE TO SOURCE_HEARTBEAT_PERIOD=2; START REPLICA;"; fi; mysql -uroot -e 'SET PERSIST super_read_only=ON'; echo '이미 복제 중'; exit 0; fi
          # 복제 설정이 없는데 app 스키마가 있으면 Orchestrator가 승격한 서버임. CLONE하면 새 Primary 데이터를 덮어쓰므로 멈춤 (#183)
          - if mysql -uroot -e 'USE app' 2>/dev/null; then echo '복제 설정 없음 + 데이터 있음(승격된 서버로 판단). CLONE하지 않음'; exit 0; fi
          - !Sub PW=$(aws secretsmanager get-secret-value --region ${AWS::Region} --secret-id ${ReplicationSecret} --query SecretString --output text)
          - mysql -uroot -Ne "SELECT 1 FROM information_schema.plugins WHERE plugin_name='clone'" | grep -q 1 || mysql -uroot -e "INSTALL PLUGIN clone SONAME 'mysql_clone.so'"
          - !Sub "mysql -uroot -e \"SET GLOBAL super_read_only=OFF; SET GLOBAL clone_valid_donor_list='${DbInstance.PrivateIp}:3306'; CLONE INSTANCE FROM 'repl'@'${DbInstance.PrivateIp}':3306 IDENTIFIED BY '$PW';\" || true"
          - sleep 20; systemctl is-active -q mysqld || systemctl start mysqld; waitdb
          - mysql -uroot -e 'USE app' || { echo 'CLONE 실패(app 스키마 없음)'; exit 1; }
          - !Sub "mysql -uroot -e \"SET GLOBAL super_read_only=OFF; CHANGE REPLICATION SOURCE TO SOURCE_HOST='${DbInstance.PrivateIp}', SOURCE_USER='repl', SOURCE_PASSWORD='$PW', SOURCE_AUTO_POSITION=1, GET_SOURCE_PUBLIC_KEY=1, SOURCE_HEARTBEAT_PERIOD=2; START REPLICA; SET PERSIST super_read_only=ON;\""
          - sleep 10; mysql -uroot -e 'SHOW REPLICA STATUS\G' | grep -E 'Replica_(IO|SQL)_Running:|Seconds_Behind_Source|Last_.*Error:'

  # --- BE가 DB를 찾는 고정 이름: db.prod.dameokja.internal (TTL 5초) (#179)
  # Cloud Map 영역(prod.dameokja.internal)에는 레코드를 직접 넣을 수 없어(403) DB 전용 사설 영역을 따로 둠 (#181)
  # 이름이 더 구체적이라 같은 VPC에서 Cloud Map 영역보다 먼저 쓰임. Orchestrator 훅 권한도 이 영역 하나로 좁힐 수 있음
  DbHostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: db.prod.dameokja.internal
      VPCs:
        - { VPCId: !Ref Vpc, VPCRegion: !Ref AWS::Region }

  # 장애조치 때 Orchestrator 훅이 이 레코드를 새 Primary IP로 바꿈. 템플릿 값(DbInstance IP)이 바뀌지 않으면 스택 업데이트가 되돌리지 않음
  DbDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref DbHostedZone
      Name: db.prod.dameokja.internal.
      Type: A
      TTL: "5"
      ResourceRecords: [!GetAtt DbInstance.PrivateIp]

  # --- Orchestrator: Primary 장애를 감지해 Standby를 자동 승격 (#183, v2 설계 22·25번)
  # 단일 인스턴스(ASG 1대 고정, 죽으면 ASG가 새로 띄움), Primary와 다른 AZ(2c). 백엔드는 로컬 SQLite라 새 서버는 토폴로지를 다시 발견함
  # Raft 쿼럼이 없어 승격 훅에서 기존 Primary를 격리(fencing)해 split-brain을 막음
  OrchestratorSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: dameokja v2 prod orchestrator (no inbound, API on localhost only)
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: dameokja-prod-orchestrator }

  # Orchestrator → Primary·Standby 3306 (토폴로지 조회·승격)
  DbFromOrchestratorIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DbSecurityGroup
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref OrchestratorSecurityGroup
      Description: orchestrator to MySQL

  # 장애조치 때 기존 Primary에 붙이는 격리 보안 그룹. 앱·복제 접속은 막고 Orchestrator만 허용(상태 확인용)
  # 보안 그룹을 바꿔도 이미 맺어진 연결은 바로 끊기지 않으므로 훅에서 super_read_only도 함께 켬
  DbFencedSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: dameokja v2 prod MySQL fenced (old primary after failover)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 3306, ToPort: 3306, SourceSecurityGroupId: !Ref OrchestratorSecurityGroup }
      Tags:
        - { Key: Name, Value: dameokja-prod-db-fenced }

  # Orchestrator가 MySQL에 접속하는 계정 비밀번호. 사람이 만들지 않고 생성 시 자동으로 정함
  OrchestratorDbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: dameokja-v2-prod/db-orchestrator
      GenerateSecretString:
        PasswordLength: 32
        RequireEachIncludedType: true
        ExcludeCharacters: "'\"`$\\/@%&;|<>(){}[]!*?#~^ "

  # Primary에 orchestrator 계정을 만듦. 복제로 Standby에도 생김. 비밀번호는 서버 안에서 읽음
  # SUPER: read_only 변경·복제 제어, PROCESS: 복제본 발견(processlist)
  DbOrchestratorUserAssociation:
    Type: AWS::SSM::Association
    DependsOn: DbConfigAssociation
    Properties:
      AssociationName: dameokja-prod-db-orchestrator-user
      Name: AWS-RunShellScript
      Targets:
        - { Key: InstanceIds, Values: [!Ref DbInstance] }
      Parameters:
        commands:
          - set -e
          - for i in $(seq 1 90); do mysql -uroot -e 'SELECT 1' >/dev/null 2>&1 && break; sleep 10; done
          - !Sub PW=$(aws secretsmanager get-secret-value --region ${AWS::Region} --secret-id ${OrchestratorDbSecret} --query SecretString --output text)
          - mysql -uroot -e "CREATE USER IF NOT EXISTS 'orchestrator'@'10.20.32.0/255.255.224.0' IDENTIFIED BY '$PW'; ALTER USER 'orchestrator'@'10.20.32.0/255.255.224.0' IDENTIFIED BY '$PW'; GRANT SUPER, PROCESS, REPLICATION SLAVE, REPLICATION CLIENT, RELOAD ON *.* TO 'orchestrator'@'10.20.32.0/255.255.224.0'; GRANT SELECT ON mysql.slave_master_info TO 'orchestrator'@'10.20.32.0/255.255.224.0';"

  OrchestratorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: orchestrator-failover
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref OrchestratorDbSecret
              # 승격 훅: DB 고정 이름을 새 Primary IP로
              - Effect: Allow
                Action: route53:ChangeResourceRecordSets
                Resource: !Sub "arn:aws:route53:::hostedzone/${DbHostedZone}"
              - Effect: Allow
                Action: [route53:GetChange, ec2:DescribeInstances]
                Resource: "*"
              # 승격 훅: 기존 Primary를 격리 보안 그룹으로. 이 스택의 DB 서버(Primary·Standby)만
              - Effect: Allow
                Action: ec2:ModifyInstanceAttribute
                Resource: !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/aws:cloudformation:stack-name: !Ref AWS::StackName
                    aws:ResourceTag/aws:cloudformation:logical-id: [DbInstance, StandbyInstance]
              - Effect: Allow
                Action: ec2:ModifyInstanceAttribute
                Resource:
                  - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:security-group/${DbFencedSecurityGroup}"
                  - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:security-group/${DbSecurityGroup}"

  OrchestratorInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref OrchestratorRole]

  # Percona Orchestrator 3.2.6(MySQL 8.4 용어 지원, Amazon Linux 2023 패키지)를 버전 고정으로 설치
  # UserData를 바꾸면 Launch Template 새 버전만 생기고 지금 서버는 그대로임. 반영하려면 서버를 종료해 ASG가 새로 띄우게 함
  OrchestratorLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref DbAmiId
        InstanceType: t3.micro
        IamInstanceProfile: { Arn: !GetAtt OrchestratorInstanceProfile.Arn }
        SecurityGroupIds: [!Ref OrchestratorSecurityGroup]
        MetadataOptions: { HttpTokens: required }
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - { Key: Name, Value: dameokja-prod-orchestrator }
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -e
            timedatectl set-timezone Asia/Seoul
            cat > /etc/yum.repos.d/percona-pdps-84-lts.repo <<'EOF'
            [percona-pdps-84-lts]
            name=Percona Distribution for MySQL 8.4 LTS
            baseurl=https://repo.percona.com/pdps-84-lts/yum/release/2023/RPMS/x86_64
            gpgcheck=1
            gpgkey=https://repo.percona.com/yum/PERCONA-PACKAGING-KEY
            EOF
            dnf install -y percona-orchestrator-3.2.6-22.amzn2023 jq
            # 훅에서 read_only를 바꿀 MySQL 클라이언트
            dnf install -y https://dev.mysql.com/get/mysql84-community-release-el9-1.noarch.rpm
            dnf install -y mysql-community-client

            PW=$(aws secretsmanager get-secret-value --region ${AWS::Region} --secret-id ${OrchestratorDbSecret} --query SecretString --output text)
            install -m 600 /dev/null /etc/orchestrator-topology.cnf
            printf '[client]\nuser=orchestrator\npassword=%s\n' "$PW" > /etc/orchestrator-topology.cnf
            mkdir -p /var/lib/orchestrator

            cat > /etc/orchestrator.conf.json <<'EOF'
            {
              "ListenAddress": "127.0.0.1:3000",
              "BackendDB": "sqlite",
              "SQLite3DataFile": "/var/lib/orchestrator/orchestrator.db",
              "MySQLTopologyCredentialsConfigFile": "/etc/orchestrator-topology.cnf",
              "MySQLConnectTimeoutSeconds": 1,
              "DefaultInstancePort": 3306,
              "InstancePollSeconds": 5,
              "DiscoverByShowSlaveHosts": false,
              "HostnameResolveMethod": "none",
              "MySQLHostnameResolveMethod": "",
              "SkipBinlogServerUnresolveCheck": true,
              "DetectClusterAliasQuery": "SELECT 'dameokja-prod'",
              "RecoverMasterClusterFilters": ["*"],
              "RecoverIntermediateMasterClusterFilters": [],
              "RecoveryPeriodBlockSeconds": 600,
              "ApplyMySQLPromotionAfterMasterFailover": true,
              "FailMasterPromotionIfSQLThreadNotUpToDate": true,
              "PreventCrossDataCenterMasterFailover": false,
              "DetachLostReplicasAfterMasterFailover": true,
              "MasterFailoverLostInstancesDowntimeMinutes": 60,
              "PostMasterFailoverProcesses": [
                "/usr/local/bin/dameokja-db-failover.sh '{command}' '{failedHost}' '{successorHost}' >> /var/log/orchestrator-hook.log 2>&1"
              ]
            }
            EOF

            # 승격 뒤 훅: 1) 기존 Primary 격리(보안 그룹 교체, 계획된 교체는 제외) 2) DB 고정 이름을 새 Primary로 3) 새 Primary 쓰기 허용을 재시작 뒤에도 유지 4) 기존 Primary super_read_only(닿을 때만)
            cat > /usr/local/bin/dameokja-db-failover.sh <<'EOF'
            #!/bin/bash
            cmd=$1; failed=$2; new=$3
            log() { echo "$(date '+%F %T') $*"; }
            log "시작 command=$cmd failed=$failed successor=$new"
            if [ "$cmd" != graceful-master-takeover ]; then
              id=$(aws ec2 describe-instances --region REGION --filters Name=private-ip-address,Values=$failed --query 'Reservations[].Instances[].InstanceId' --output text)
              if [ -n "$id" ] && aws ec2 modify-instance-attribute --region REGION --instance-id $id --groups FENCED_SG; then log "격리 보안 그룹 적용 $id"; else log "격리 보안 그룹 실패 id=$id"; fi
            fi
            aws route53 change-resource-record-sets --hosted-zone-id ZONE_ID --change-batch "{\"Changes\":[{\"Action\":\"UPSERT\",\"ResourceRecordSet\":{\"Name\":\"db.prod.dameokja.internal.\",\"Type\":\"A\",\"TTL\":5,\"ResourceRecords\":[{\"Value\":\"$new\"}]}}]}" && log "DNS -> $new" || log "DNS 변경 실패"
            mysql --defaults-extra-file=/etc/orchestrator-topology.cnf -h "$new" --connect-timeout=3 -e "SET PERSIST super_read_only=OFF; SET PERSIST read_only=OFF;" && log "새 Primary 쓰기 허용 유지" || log "새 Primary PERSIST 실패"
            if [ "$cmd" != graceful-master-takeover ]; then
              timeout 5 mysql --defaults-extra-file=/etc/orchestrator-topology.cnf -h "$failed" --connect-timeout=3 -e "SET PERSIST super_read_only=ON;" && log "기존 Primary super_read_only" || log "기존 Primary에 닿지 않음(격리 보안 그룹만 적용)"
            fi
            log "끝"
            EOF
            sed -i -e 's/REGION/${AWS::Region}/g' -e 's/FENCED_SG/${DbFencedSecurityGroup}/g' -e 's/ZONE_ID/${DbHostedZone}/g' /usr/local/bin/dameokja-db-failover.sh
            chmod 755 /usr/local/bin/dameokja-db-failover.sh

            systemctl enable --now orchestrator
            for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/api/status >/dev/null && break; sleep 2; done
            # 처음 발견할 서버. 장애조치 뒤 기존 Primary가 섞여도 Orchestrator가 역할을 구분함
            curl -s http://127.0.0.1:3000/api/discover/${DbInstance.PrivateIp}/3306 >/dev/null
            curl -s http://127.0.0.1:3000/api/discover/${StandbyInstance.PrivateIp}/3306 >/dev/null

  OrchestratorAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: DbOrchestratorUserAssociation
    Properties:
      AutoScalingGroupName: dameokja-prod-orchestrator
      MinSize: "1"
      MaxSize: "1"
      DesiredCapacity: "1"
      VPCZoneIdentifier: [!Ref PrivateSubnetB]
      LaunchTemplate:
        LaunchTemplateId: !Ref OrchestratorLaunchTemplate
        Version: !GetAtt OrchestratorLaunchTemplate.LatestVersionNumber
      HealthCheckType: EC2

  # AI용 PostgreSQL 16을 MySQL과 같은 DB 서버에 둠 (dev는 AI 서버에 직접 설치). 메모리 상한 shared_buffers 512MB
  # 계정 비밀번호는 SSM /dameokja-v2-prod-ai/POSTGRES_PASSWORD를 서버 안에서 읽음(명령 기록에 남기지 않음). 스키마·기준 데이터는 dev에서 따로 옮김
  DbPostgresAssociation:
    Type: AWS::SSM::Association
    DependsOn: DbConfigAssociation
    Properties:
      AssociationName: dameokja-prod-db-postgres
      Name: AWS-RunShellScript
      Targets:
        - { Key: InstanceIds, Values: [!Ref DbInstance] }
      Parameters:
        executionTimeout: ["1800"]
        commands:
          - set -e; changed=
          - for i in $(seq 1 90); do systemctl is-enabled mysqld >/dev/null 2>&1 && break; sleep 10; done
          - rpm -q postgresql16-server >/dev/null 2>&1 || dnf install -y postgresql16-server postgresql16-contrib
          - D=/var/lib/pgsql/data; [ -f $D/PG_VERSION ] || postgresql-setup --initdb
          - echo "listen_addresses = '*'" > /tmp/dameokja.conf; echo "shared_buffers = 512MB" >> /tmp/dameokja.conf; echo "password_encryption = scram-sha-256" >> /tmp/dameokja.conf
          - mkdir -p $D/conf.d && chown postgres:postgres $D/conf.d; grep -q "^include_dir = 'conf.d'" $D/postgresql.conf || { echo "include_dir = 'conf.d'" >> $D/postgresql.conf; changed=1; }
          - cmp -s /tmp/dameokja.conf $D/conf.d/dameokja.conf || { install -o postgres -g postgres -m 600 /tmp/dameokja.conf $D/conf.d/dameokja.conf; changed=1; }
          - !Sub "grep -q '^host receipt_ai receipt_ai ${PrivateSubnetACidr} scram-sha-256' $D/pg_hba.conf || { echo 'host receipt_ai receipt_ai ${PrivateSubnetACidr} scram-sha-256' >> $D/pg_hba.conf; changed=1; }"
          - systemctl enable postgresql; if systemctl is-active -q postgresql; then [ -z "$changed" ] || systemctl restart postgresql; else systemctl start postgresql; fi
          - !Sub "PW=$(aws ssm get-parameter --region ${AWS::Region} --name /dameokja-v2-prod-ai/POSTGRES_PASSWORD --with-decryption --query Parameter.Value --output text)"
          - sudo -u postgres psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='receipt_ai'" | grep -q 1 || sudo -u postgres psql -c "CREATE ROLE receipt_ai LOGIN"
          - echo "ALTER ROLE receipt_ai PASSWORD :'pw';" | sudo -u postgres psql -v ON_ERROR_STOP=1 -v pw="$PW" >/dev/null
          - sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='receipt_ai'" | grep -q 1 || sudo -u postgres createdb -O receipt_ai receipt_ai
          - sudo -u postgres psql -d receipt_ai -c "CREATE EXTENSION IF NOT EXISTS pg_trgm"

  # --- ECS 클러스터 + ASG(private 2b) + Capacity Provider
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: dameokja-prod
      # 태스크·컨테이너 단위 CPU·메모리 확인용 (#142)
      ClusterSettings:
        - { Name: containerInsights, Value: enabled }

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  # 새 인스턴스는 처음 부팅 때 클러스터 등록과 KST 설정. 템플릿을 바꾸면 이후 새로 뜨는 인스턴스부터 적용
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: dameokja-prod
      LaunchTemplateData:
        ImageId: !Ref AmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile: { Arn: !GetAtt InstanceProfile.Arn }
        SecurityGroupIds: [!Ref InstanceSecurityGroup]
        MetadataOptions: { HttpTokens: required }
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - { Key: Name, Value: dameokja-prod }
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            echo "ECS_CLUSTER=${Cluster}" >> /etc/ecs/ecs.config
            timedatectl set-timezone Asia/Seoul

  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: dameokja-prod
      VPCZoneIdentifier: [!Ref PrivateSubnetA]
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      MinSize: !Ref MinSize
      MaxSize: !Ref MaxSize

  # Task를 올릴 자리가 모자라면 ECS가 ASG 인스턴스 수를 늘리고, 남으면 줄임 (min~max 안에서)
  CapacityProvider:
    Type: AWS::ECS::CapacityProvider
    Properties:
      AutoScalingGroupProvider:
        AutoScalingGroupArn: !Ref AutoScalingGroup
        ManagedScaling:
          Status: ENABLED
          TargetCapacity: 100
        ManagedTerminationProtection: DISABLED

  ClusterCapacityProviders:
    Type: AWS::ECS::ClusterCapacityProviderAssociations
    Properties:
      Cluster: !Ref Cluster
      CapacityProviders: [!Ref CapacityProvider]
      DefaultCapacityProviderStrategy:
        - { CapacityProvider: !Ref CapacityProvider, Weight: 1 }

  # --- BE가 AI를 찾는 내부 주소: ai.prod.dameokja.internal (AI Task가 뜨면 IP가 등록됨)
  PrivateNamespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: prod.dameokja.internal
      Vpc: !Ref Vpc

  AiDiscoveryService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: ai
      NamespaceId: !Ref PrivateNamespace
      DnsConfig:
        RoutingPolicy: MULTIVALUE
        DnsRecords:
          - { Type: A, TTL: 10 }
      HealthCheckCustomConfig:
        FailureThreshold: 1

  # --- 스택이 정하는 설정값. 콘솔에서 바꾸면 다음 배포 때 덮어씀
  RedisHostParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /dameokja-v2-prod/SPRING_DATA_REDIS_HOST
      Type: String
      Value: !GetAtt RedisInstance.PrivateIp

  RedisPortParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /dameokja-v2-prod/SPRING_DATA_REDIS_PORT
      Type: String
      Value: "6379"

  AiBaseUrlParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /dameokja-v2-prod/AI_BASE_URL
      Type: String
      Value: http://ai.prod.dameokja.internal:8000

  # --- 컨테이너 로그 (awslogs). 서비스마다 로그 그룹 하나
  # /dameokja/prod/*는 v1 prod(CloudWatch Agent)가 이미 쓰고 있어 v2 prod는 /dameokja/v2-prod/*
  FrontendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /dameokja/v2-prod/frontend
      RetentionInDays: 30

  # BE 로그는 수집·저장 비용이 가장 커서 14일만 보관 (#175)
  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /dameokja/v2-prod/backend
      RetentionInDays: 14

  AiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /dameokja/v2-prod/ai
      RetentionInDays: 30

  # BE 연결 풀(HikariCP) 지표 수집용 CloudWatch Agent 사이드카 설정 (ecs/prod/backend.json의 cloudwatch-agent 컨테이너가 읽음)
  # dev는 EC2 Agent(dev.yaml CloudWatchAgentAssociation)로 같은 지표를 이미 수집함
  PrometheusLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /dameokja/v2-prod/prometheus
      RetentionInDays: 30

  CloudWatchAgentConfigParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /dameokja-v2-prod/cloudwatch-agent/config
      Type: String
      Value: '{"agent":{"metrics_collection_interval":60,"omit_hostname":true,"region":"ap-northeast-2"},"logs":{"metrics_collected":{"prometheus":{"log_group_name":"/dameokja/v2-prod/prometheus","prometheus_config_path":"env:PROMETHEUS_CONFIG_CONTENT","emf_processor":{"metric_declaration_dedup":true,"metric_namespace":"Dameokja/v2-prod/App","metric_declaration":[{"source_labels":["job"],"label_matcher":"^dameokja-backend$","dimensions":[["env"]],"metric_selectors":["^hikaricp_connections_(active|idle|pending|max)$","^hikaricp_connections_timeout_total$"]}]}}}}}'

  PrometheusScrapeConfigParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /dameokja-v2-prod/cloudwatch-agent/prometheus
      Type: String
      Value: |
        global:
          scrape_interval: 1m
          scrape_timeout: 10s
        scrape_configs:
          - job_name: dameokja-backend
            metrics_path: /actuator/prometheus
            sample_limit: 10000
            static_configs:
              - targets: ["127.0.0.1:8080"]
                labels:
                  env: prod
            metric_relabel_configs:
              - source_labels: [__name__]
                regex: "hikaricp_connections.*"
                action: keep

  # AI 지표(RunPod 처리·LLM·FastAPI 프로세스) 수집용 CloudWatch Agent 사이드카 설정 (ecs/prod/ai.json의 cloudwatch-agent 컨테이너가 읽음, #137)
  # AI /metrics는 루프백 요청이면 내부 API 키 없이 열림(AI 저장소). 로그 그룹은 BE 사이드카와 같은 PrometheusLogGroup
  AiCloudWatchAgentConfigParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /dameokja-v2-prod-ai/cloudwatch-agent/config
      Type: String
      Value: '{"agent":{"metrics_collection_interval":60,"omit_hostname":true,"region":"ap-northeast-2"},"logs":{"metrics_collected":{"prometheus":{"log_group_name":"/dameokja/v2-prod/prometheus","prometheus_config_path":"env:PROMETHEUS_CONFIG_CONTENT","emf_processor":{"metric_declaration_dedup":true,"metric_namespace":"Dameokja/v2-prod/Ai","metric_declaration":[{"source_labels":["job"],"label_matcher":"^dameokja-ai$","dimensions":[["env"]],"metric_selectors":["^process_(cpu_seconds_total|resident_memory_bytes)$","^dameokja_analysis_(queue_size|active)$","^dameokja_remote_llm_model_load_seconds_(sum|count)$"]},{"source_labels":["job","stage"],"label_matcher":"^dameokja-ai;(worker_total|worker_queue_wait|ocr|llm)$","dimensions":[["env","stage"]],"metric_selectors":["^dameokja_remote_worker_stage_seconds_(sum|count)$"]},{"source_labels":["job","type"],"label_matcher":"^dameokja-ai;(prompt|completion)$","dimensions":[["env","type"]],"metric_selectors":["^dameokja_remote_llm_tokens_total$","^dameokja_remote_llm_tokens_per_second_(sum|count)$"]}]}}}}}'

  AiPrometheusScrapeConfigParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /dameokja-v2-prod-ai/cloudwatch-agent/prometheus
      Type: String
      Value: |
        global:
          scrape_interval: 1m
          scrape_timeout: 10s
        scrape_configs:
          - job_name: dameokja-ai
            metrics_path: /metrics
            static_configs:
              - targets: ["127.0.0.1:8000"]
                labels:
                  env: prod
            metric_relabel_configs:
              - source_labels: [__name__]
                regex: "process_(cpu_seconds_total|resident_memory_bytes)|dameokja_analysis_(queue_size|active)|dameokja_remote_worker_stage_seconds_(sum|count)|dameokja_remote_llm_(tokens_total|tokens_per_second_(sum|count)|model_load_seconds_(sum|count))"
                action: keep

  # --- IAM
  # ECS 에이전트가 이미지 받기(GHCR 토큰)와 SSM 값 읽기에 쓰는 역할
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dameokja-prod-ecs-task-execution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-app-config
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameters
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/dameokja-v2-prod/*"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/dameokja-v2-prod-fe/*"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/dameokja-v2-prod-ai/*"
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref GhcrCredentialsArn

  # BE 컨테이너: 이미지 버킷의 prod 업로드 경로만
  BackendTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dameokja-prod-backend-task
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: profile-images
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub "arn:aws:s3:::${S3BucketName}/${S3UploadPrefix}*"
              # 프로필 기본 이미지 한 파일만 읽기
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${S3BucketName}/profiles/default.png"
        # 같은 Task의 CloudWatch Agent 사이드카가 연결 풀 지표를 EMF 로그로 보냄
        - PolicyName: prometheus-emf
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams]
                Resource: !Sub "${PrometheusLogGroup.Arn}"
              - Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"
              # Agent가 시작할 때 인스턴스 태그·볼륨을 조회함. 없으면 설정 변환이 실패하고 종료됨 (2026-10-20 확인)
              - Effect: Allow
                Action: [ec2:DescribeTags, ec2:DescribeVolumes]
                Resource: "*"

  # AI 서버: BE가 올린 이미지 읽기
  AiTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dameokja-prod-ai-task
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: read-images
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${S3BucketName}/${S3UploadPrefix}*"
        # 같은 Task의 CloudWatch Agent 사이드카가 AI 지표를 EMF 로그로 보냄 (BackendTaskRole prometheus-emf와 같음, #137)
        - PolicyName: prometheus-emf
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams]
                Resource: !Sub "${PrometheusLogGroup.Arn}"
              - Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"
              - Effect: Allow
                Action: [ec2:DescribeTags, ec2:DescribeVolumes]
                Resource: "*"

  # ECS Native Blue/Green이 배포 중 리스너 규칙·타겟 그룹을 바꿀 때 쓰는 역할
  EcsInfrastructureRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dameokja-prod-ecs-infrastructure
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonECSInfrastructureRolePolicyForLoadBalancers

  # CLOUD prod 승인 job(prod-approval.yml)이 prod Task Definition 등록과 Service 갱신에 쓰는 역할
  GitHubEcsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dameokja-prod-github-ecs-deploy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # prod는 CLOUD prod-approval.yml의 GitHub Environments "prod" 승인 job만. FE·BE·AI main이 직접 바꾸지 못하게 함
                token.actions.githubusercontent.com:sub: repo:100-hours-a-week@167328634/KTB4-5th-CLOUD@1349507673:environment:prod
      Policies:
        - PolicyName: ecs-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ecs:RegisterTaskDefinition, ecs:DescribeTaskDefinition]
                Resource: "*"
              - Effect: Allow
                Action: [ecs:UpdateService, ecs:DescribeServices]
                Resource: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/${Cluster}/*"
              - Effect: Allow
                Action: [ecs:DescribeServiceDeployments, ecs:ListServiceDeployments]
                Resource: "*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: [!GetAtt TaskExecutionRole.Arn, !GetAtt BackendTaskRole.Arn, !GetAtt AiTaskRole.Arn]

  # CLOUD prod-dns-weight.yml(승인 job)이 dameokja.com A 레코드의 v1·v2 가중치만 바꾸는 역할
  GitHubDnsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dameokja-prod-github-dns
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:100-hours-a-week@167328634/KTB4-5th-CLOUD@1349507673:environment:prod
      Policies:
        - PolicyName: apex-weight
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: route53:ChangeResourceRecordSets
                Resource: !Sub "arn:aws:route53:::hostedzone/${HostedZoneId}"
                Condition:
                  ForAllValues:StringEquals:
                    route53:ChangeResourceRecordSetsNormalizedRecordNames: [dameokja.com]
                    route53:ChangeResourceRecordSetsRecordTypes: [A]
              - Effect: Allow
                Action: route53:ListResourceRecordSets
                Resource: !Sub "arn:aws:route53:::hostedzone/${HostedZoneId}"
              - Effect: Allow
                Action: route53:GetChange
                Resource: arn:aws:route53:::change/*
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Ref AWS::StackId

  # 팀원(IAM 그룹 dameokja-iam)이 prod 설정값(SSM)을 관리하고, prod 인스턴스에 Session Manager로 접속
  TeamSsmAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: dameokja-v2-prod-ssm-team
      Groups: [dameokja-iam]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:GetParametersByPath
              - ssm:GetParameterHistory
              - ssm:PutParameter
              - ssm:DeleteParameter
              - ssm:DeleteParameters
              - ssm:AddTagsToResource
              - ssm:ListTagsForResource
            Resource:
              - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/dameokja-v2-prod/*"
              - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/dameokja-v2-prod-*"
          # ASG가 인스턴스를 바꾸므로 ID 대신 Name 태그로 허용 (앱 dameokja-prod, DB dameokja-prod-db)
          - Effect: Allow
            Action: ssm:StartSession
            Resource: !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
            Condition:
              StringLike:
                ssm:resourceTag/Name: dameokja-prod*

  # 팀원이 프로젝트 로그를 콘솔·Logs Insights에서 분석하도록 허용한다. 로그 변경·삭제 권한은 포함하지 않는다.
  TeamLogsInsightsAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: dameokja-team-logs-insights
      Groups: [dameokja-iam]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # dev·stage·v1/v2 prod 및 프로젝트 알림 Lambda 로그만 쿼리 대상으로 허용한다.
          - Sid: QueryProjectLogGroups
            Effect: Allow
            Action:
              - logs:StartQuery
              - logs:GetLogGroupFields
              - logs:GetQueryResults
              - logs:GetLogRecord
            Resource:
              - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/dameokja/*"
              - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/dameokja-*"
          # 쿼리 결과·목록과 콘솔 선택기에 사용하는 조회는 개별 로그 그룹으로 범위를 지정할 수 없다.
          - Sid: ReadQueryResultsAndConsoleMetadata
            Effect: Allow
            Action:
              - logs:StopQuery
              - logs:DescribeFieldIndexes
              - logs:DescribeQueries
              - logs:DescribeQueryDefinitions
              - logs:DescribeLookupTables
              - logs:ListAggregateLogGroupSummaries
              - oam:ListSinks
              - tag:GetResources
            Resource: "*"

  # --- ECS Service. Task Definition은 infra/v2/ecs/prod/*.json (ecs-deploy.yml이 등록). family만 적어 최신 버전을 씀
  # Task는 메모리가 덜 남은 서버부터 채움(binpack). ECS는 돌던 Task를 옮기지 않아서, 흩어지면 빈 서버가 안 생겨 서버 수가 줄지 않음(#147)
  # ECS Native Blue/Green: 새 버전을 다른 쪽 타겟 그룹에 띄우고 헬스체크 통과 후 리스너 규칙을 그쪽으로 전환,
  # 대기(Bake) 시간 동안 문제가 생기면 되돌림
  # BE, FE. Task Definition은 infra/v2/ecs/prod/backend.json, frontend.json
  # 0개로 만들고 Task 수는 자동 조정(2~4)이 정함. 자동 조정이 2개로 올린 뒤에도 스택이 Task 수를 되돌리지 않게 하기 위함
  BackendService:
    Type: AWS::ECS::Service
    DependsOn: ClusterCapacityProviders
    Properties:
      ServiceName: dameokja-prod-backend
      Cluster: !Ref Cluster
      TaskDefinition: dameokja-prod-backend
      DesiredCount: 2
      CapacityProviderStrategy:
        - { CapacityProvider: !Ref CapacityProvider, Weight: 1 }
      PlacementStrategies:
        - { Type: binpack, Field: memory }
      AvailabilityZoneRebalancing: DISABLED # 앱 서버는 2b 한 곳이라 쓸 일 없고, 켜져 있으면 binpack을 못 씀
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: [!Ref PrivateSubnetA]
          SecurityGroups: [!Ref AppSecurityGroup]
      HealthCheckGracePeriodSeconds: 300
      LoadBalancers:
        - ContainerName: backend
          ContainerPort: 8080
          TargetGroupArn: !Ref BackendTargetGroupBlue
          AdvancedConfiguration:
            AlternateTargetGroupArn: !Ref BackendTargetGroupGreen
            ProductionListenerRule: !Ref BackendListenerRule
            RoleArn: !GetAtt EcsInfrastructureRole.Arn
      DeploymentConfiguration:
        Strategy: BLUE_GREEN
        BakeTimeInMinutes: 5
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }

  FrontendService:
    Type: AWS::ECS::Service
    DependsOn: ClusterCapacityProviders
    Properties:
      ServiceName: dameokja-prod-frontend
      Cluster: !Ref Cluster
      TaskDefinition: dameokja-prod-frontend
      DesiredCount: 2
      CapacityProviderStrategy:
        - { CapacityProvider: !Ref CapacityProvider, Weight: 1 }
      PlacementStrategies:
        - { Type: binpack, Field: memory }
      AvailabilityZoneRebalancing: DISABLED # 앱 서버는 2b 한 곳이라 쓸 일 없고, 켜져 있으면 binpack을 못 씀
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: [!Ref PrivateSubnetA]
          SecurityGroups: [!Ref FrontendSecurityGroup]
      HealthCheckGracePeriodSeconds: 300
      LoadBalancers:
        - ContainerName: frontend
          ContainerPort: 3000
          TargetGroupArn: !Ref FrontendTargetGroupBlue
          AdvancedConfiguration:
            AlternateTargetGroupArn: !Ref FrontendTargetGroupGreen
            ProductionListenerRule: !Ref FrontendListenerRule
            RoleArn: !GetAtt EcsInfrastructureRole.Arn
      DeploymentConfiguration:
        Strategy: BLUE_GREEN
        BakeTimeInMinutes: 5
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }

  # AI API. BE는 ai.prod.dameokja.internal:8000으로 호출 (Cloud Map에 Task IP 등록)
  AiService:
    Type: AWS::ECS::Service
    DependsOn: ClusterCapacityProviders
    Properties:
      ServiceName: dameokja-prod-ai
      Cluster: !Ref Cluster
      TaskDefinition: dameokja-prod-ai
      DesiredCount: 1
      CapacityProviderStrategy:
        - { CapacityProvider: !Ref CapacityProvider, Weight: 1 }
      PlacementStrategies:
        - { Type: binpack, Field: memory }
      AvailabilityZoneRebalancing: DISABLED # 앱 서버는 2b 한 곳이라 쓸 일 없고, 켜져 있으면 binpack을 못 씀
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: [!Ref PrivateSubnetA]
          SecurityGroups: [!Ref AiSecurityGroup]
      ServiceRegistries:
        - RegistryArn: !GetAtt AiDiscoveryService.Arn
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }

  # 앱 Task 수 자동 조정 (Target Tracking, v2 20번). Task가 늘어 자리가 모자라면 Capacity Provider가 인스턴스를 늘림
  BackendScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub "service/${Cluster}/${BackendService.Name}"
      MinCapacity: 2
      MaxCapacity: 4

  BackendCpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: dameokja-prod-backend-cpu
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref BackendScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 60
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization

  FrontendScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub "service/${Cluster}/${FrontendService.Name}"
      MinCapacity: 2
      MaxCapacity: 4

  FrontendCpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: dameokja-prod-frontend-cpu
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref FrontendScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 60
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization

Outputs:
  VpcId:
    Value: !Ref Vpc
  ClusterName:
    Value: !Ref Cluster
  AlbDnsName:
    Value: !GetAtt Alb.DNSName
  AlbHostedZoneId:
    Value: !GetAtt Alb.CanonicalHostedZoneID
  PrivateSubnetA:
    Value: !Ref PrivateSubnetA
  PrivateSubnetB:
    Value: !Ref PrivateSubnetB
  AppSecurityGroupId:
    Value: !Ref AppSecurityGroup
  AiSecurityGroupId:
    Value: !Ref AiSecurityGroup
  RedisPrivateIp:
    Value: !GetAtt RedisInstance.PrivateIp
  DbInstanceId:
    Value: !Ref DbInstance
  DbPrivateIp:
    Value: !GetAtt DbInstance.PrivateIp
  StandbyPrivateIp:
    Value: !GetAtt StandbyInstance.PrivateIp
  OrchestratorAsgName:
    Value: !Ref OrchestratorAutoScalingGroup
  DbFencedSecurityGroupId:
    Value: !Ref DbFencedSecurityGroup
