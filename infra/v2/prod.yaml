AWSTemplateFormatVersion: "2010-09-09"
Description: dameokja v2 prod (stage와 같은 구성. 서브넷 2AZ, 앱 서버는 2b 한 곳, NAT, ALB, ECS on EC2 ASG, 자체 구축 Redis·MySQL)

# stage.yaml과 같은 구성의 v2 prod. dev(172.31)·v1 prod(10.0.0.0/24)·stage(10.10) VPC와 겹치지 않는 10.20 VPC를 새로 만듦
# 구조: dameokja.com -> ALB(TLS 종료) -> private 서브넷 ECS Task(nginx+FE+BE, awsvpc) -> Redis / prod 전용 MySQL
# dameokja.com은 v1 prod를 그대로 가리킴. 전환은 나중에 Route 53 가중치 레코드로 함
# Task Definition은 infra/v2/ecs/prod/*.json. Service보다 먼저 등록되어 있어야 함
Parameters:
  VpcCidr:
    Type: String
    Default: 10.20.0.0/16
  AzA:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: ap-northeast-2b
  AzB:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: ap-northeast-2c
  PublicSubnetACidr:
    Type: String
    Default: 10.20.0.0/20
  PublicSubnetBCidr:
    Type: String
    Default: 10.20.16.0/20
  PrivateSubnetACidr:
    Type: String
    Default: 10.20.32.0/20
  PrivateSubnetBCidr:
    Type: String
    Default: 10.20.48.0/20
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: dameokja.com hosted zone
  # ALB 인증서 도메인. dameokja.com 레코드는 v1·v2 가중치 레코드로 prod-dns-weight.yml이 관리 (prod 서브도메인 없음)
  DomainName:
    Type: String
    Default: dameokja.com
  # prod와 같은 m7i 계열. m7i는 large(2 vCPU, 8GB)가 가장 작은 크기
  InstanceType:
    Type: String
    Default: m7i.large
  # 지금 stage 앱 서버와 같은 ECS 최적화 AMI로 고정. SSM 권장 AMI 경로를 쓰면 AWS가 새 AMI를 낼 때마다 다음 배포에서 LaunchTemplate이 바뀜
  AmiId:
    Type: AWS::EC2::Image::Id
    Default: ami-08afa937d0ef1a748
  MinSize:
    Type: Number
    Default: 2
  MaxSize:
    Type: Number
    Default: 4
  # 10-19~24 CPU 평균 1~2%라 m7i.large(8GB)에서 줄임 (#134). MySQL 버퍼 풀 기본값 + PostgreSQL 512MB가 4GB 안에 들어감
  DbInstanceType:
    Type: String
    Default: t3.medium
  RedisInstanceType:
    Type: String
    Default: t3.small
  # 일반 AL2023 AMI(ECS 최적화 아님) ID 고정. SSM 최신 AMI 경로를 쓰면 새 AMI가 나올 때마다 DB 인스턴스가 교체됨
  DbAmiId:
    Type: AWS::EC2::Image::Id
  GhcrCredentialsArn:
    Type: String
    Description: Secrets Manager secret ARN with GHCR username/PAT (read:packages), created by hand
  S3BucketName:
    Type: String
    Default: dameokja-906462447513-ap-northeast-2-an
  S3UploadPrefix:
    Type: String
    Default: image/prod/

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: dameokja-prod }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: dameokja-prod }

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # --- 서브넷: public(ALB, NAT) / private(ECS 인스턴스·Task, Redis, DB) x 2AZ
  # 앱 서버(ECS)는 2b 한 곳에만 둠. AZ 분리는 DB만 (private 2c는 DB Standby용, ALB는 서브넷 2AZ가 필수)
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AzA
      CidrBlock: !Ref PublicSubnetACidr
      Tags:
        - { Key: Name, Value: dameokja-prod-public-a }

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AzB
      CidrBlock: !Ref PublicSubnetBCidr
      Tags:
        - { Key: Name, Value: dameokja-prod-public-b }

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AzA
      CidrBlock: !Ref PrivateSubnetACidr
      Tags:
        - { Key: Name, Value: dameokja-prod-private-a }

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AzB
      CidrBlock: !Ref PrivateSubnetBCidr
      Tags:
        - { Key: Name, Value: dameokja-prod-private-b }

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: dameokja-prod-public-rt }

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # --- NAT 1개(AzA). AzA 장애 시 AzB private의 외부 통신도 끊기는 것은 감수 (구현 기록 임시 기본값)
  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - { Key: Name, Value: dameokja-prod-nat }

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - { Key: Name, Value: dameokja-prod-nat }

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: dameokja-prod-private-rt }

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # S3 트래픽(이미지 업로드·조회, ECR 레이어 등)이 NAT를 타지 않게 (무료)
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PrivateRouteTable]

  # --- 보안그룹
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: dameokja v2 prod ALB (80/443 public)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
      Tags:
        - { Key: Name, Value: dameokja-prod-alb }

  # ECS 인스턴스 자체. Task는 awsvpc라 각자 ENI와 아래 Task용 보안그룹을 따로 가짐
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: dameokja v2 prod ECS instances (no inbound)
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: dameokja-prod-instance }

  # nginx+FE+BE Task. ALB에서 오는 80만
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: dameokja v2 prod app task (80 from ALB)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, SourceSecurityGroupId: !Ref AlbSecurityGroup }
      Tags:
        - { Key: Name, Value: dameokja-prod-app }

  # AI API Task. 앱 Task(BE)에서 오는 8000만
  AiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: dameokja v2 prod AI task (8000 from app task)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8000, ToPort: 8000, SourceSecurityGroupId: !Ref AppSecurityGroup }
      Tags:
        - { Key: Name, Value: dameokja-prod-ai }

  RedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: dameokja v2 prod Redis (6379 from app task)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 6379, ToPort: 6379, SourceSecurityGroupId: !Ref AppSecurityGroup }
      Tags:
        - { Key: Name, Value: dameokja-prod-redis }

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: dameokja v2 prod MySQL (3306 from app task)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 3306, ToPort: 3306, SourceSecurityGroupId: !Ref AppSecurityGroup }
      Tags:
        - { Key: Name, Value: dameokja-prod-db }

  # AI Task → DB 서버 PostgreSQL(5432). 같은 서버의 MySQL과 포트만 다름
  DbPostgresFromAiIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DbSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref AiSecurityGroup
      Description: AI task PostgreSQL

  # --- 진입점: ACM 인증서 + ALB + 타겟 그룹 2개(ECS Blue/Green) + 리스너
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    # internet-facing ALB는 VPC에 IGW가 붙어 있어야 만들어짐
    DependsOn: InternetGatewayAttachment
    Properties:
      Name: dameokja-prod-alb
      Type: application
      Scheme: internet-facing
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - { Key: idle_timeout.timeout_seconds, Value: "300" } # SSE 연결 유지 (구현 기록 임시 기본값)

  TargetGroupBlue:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: dameokja-prod-tg-blue
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 80
      TargetType: ip # awsvpc Task
      HealthCheckPath: /nginx-health
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }

  TargetGroupGreen:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: dameokja-prod-tg-green
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 80
      TargetType: ip
      HealthCheckPath: /nginx-health
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig: { Protocol: HTTPS, Port: "443", StatusCode: HTTP_301 }

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref Certificate
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig: { StatusCode: "404", ContentType: text/plain, MessageBody: not found }

  # ECS Native Blue/Green이 배포 때 이 규칙의 가중치를 바꿔 blue <-> green을 전환
  ProductionListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 1
      Conditions:
        - Field: path-pattern
          PathPatternConfig: { Values: ["/*"] }
      Actions:
        - Type: forward
          ForwardConfig:
            TargetGroups:
              - { TargetGroupArn: !Ref TargetGroupBlue, Weight: 100 }
              - { TargetGroupArn: !Ref TargetGroupGreen, Weight: 0 }

  # --- Redis: EC2 자체 구축 단일 노드, 이중화 없음 (v2 22번), AOF 영속화
  # AMI는 DB와 같은 고정 일반 AL2023, 역할도 DB와 같은 SSM 접속용
  RedisInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref DbAmiId
      InstanceType: !Ref RedisInstanceType
      SubnetId: !Ref PrivateSubnetA
      SecurityGroupIds: [!Ref RedisSecurityGroup]
      IamInstanceProfile: !Ref DbInstanceProfile
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -e
          timedatectl set-timezone Asia/Seoul
          dnf install -y redis6
          sed -i -e 's/^bind .*/bind 0.0.0.0/' -e 's/^protected-mode yes/protected-mode no/' \
            -e 's/^appendonly no/appendonly yes/' /etc/redis6/redis6.conf
          systemctl enable --now redis6
      Tags:
        - { Key: Name, Value: dameokja-prod-redis }

  # dev와 같은 Redis 버전(redis:7.4-alpine)을 Docker로 실행. UserData의 redis6(6.2)는 끄고 쓰지 않음
  # UserData를 바꾸면 처음 부팅 때만 실행되므로 Association으로 적용. 꺼져 있으면 켜질 때 실행되고, 이미 돌고 있으면 그대로 둠
  RedisDockerAssociation:
    Type: AWS::SSM::Association
    Properties:
      AssociationName: dameokja-prod-redis-docker
      Name: AWS-RunShellScript
      Targets:
        - { Key: InstanceIds, Values: [!Ref RedisInstance] }
      Parameters:
        commands:
          - set -e
          - dnf install -y docker
          - systemctl enable --now docker
          - systemctl disable --now redis6 || true
          - mkdir -p /var/lib/redis-data
          - if [ -z "$(docker ps -q --filter name=^redis$ --filter ancestor=redis:7.4-alpine)" ]; then docker rm -f redis || true; docker run -d --name redis --restart unless-stopped --network host -v /var/lib/redis-data:/data redis:7.4-alpine redis-server --protected-mode no --appendonly yes; fi

  # --- prod 전용 MySQL 8.4 (Primary 1대). Standby·Replica·Orchestrator는 DB 이중화 작업에서 추가
  # 복제를 붙일 수 있게 처음부터 binlog·GTID를 켬. 계정·스키마는 처음 한 번 Session Manager로 만듦
  DbRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      # 앱 DB 계정 Association이 비밀번호를 서버 안에서 읽도록 (명령 기록에 비밀번호를 남기지 않음)
      Policies:
        - PolicyName: read-db-password
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/dameokja-v2-prod/SPRING_DATASOURCE_PASSWORD"

  DbInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref DbRole]

  DbInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref DbAmiId
      InstanceType: !Ref DbInstanceType
      SubnetId: !Ref PrivateSubnetA
      SecurityGroupIds: [!Ref DbSecurityGroup]
      IamInstanceProfile: !Ref DbInstanceProfile
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 30, VolumeType: gp3 }
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -e
          timedatectl set-timezone Asia/Seoul
          dnf install -y https://dev.mysql.com/get/mysql84-community-release-el9-1.noarch.rpm
          dnf install -y mysql-community-server
          cat > /etc/my.cnf.d/dameokja.cnf <<'EOF'
          [mysqld]
          server_id=1
          log_bin=binlog
          gtid_mode=ON
          enforce_gtid_consistency=ON
          default_time_zone='+09:00'
          EOF
          systemctl enable --now mysqld
      Tags:
        - { Key: Name, Value: dameokja-prod-db }

  # MySQL RPM의 /etc/my.cnf는 my.cnf.d를 읽지 않아 위 dameokja.cnf(GTID 등)가 적용되지 않음. 포함 줄을 넣고,
  # v1 prod DB에서 복제받을 수 있게 복제본 설정을 zz-replica.cnf로 덧씀(파일 이름순으로 나중에 읽혀 server_id를 덮음)
  # UserData를 바꾸면 DB 서버가 교체될 수 있어 Association으로 적용. 서버가 바뀌어도 대상이 따라가고, 꺼져 있으면 켜질 때 실행됨
  # 설정이 바뀐 경우에만 MySQL 재시작
  # 스택 생성 때 Association이 UserData의 MySQL 설치보다 먼저 돌아 /etc/my.cnf가 include 한 줄만 남고 기본 설정이 my.cnf.rpmnew로 밀려난 적이 있음.
  # 그래서 설치가 끝날 때까지 기다리고, rpmnew가 있으면 기본 설정을 되살린 뒤 include를 넣음
  DbConfigAssociation:
    Type: AWS::SSM::Association
    Properties:
      AssociationName: dameokja-prod-db-mycnf
      Name: AWS-RunShellScript
      Targets:
        - { Key: InstanceIds, Values: [!Ref DbInstance] }
      Parameters:
        commands:
          - set -e; changed=
          - for i in $(seq 1 90); do systemctl is-enabled mysqld >/dev/null 2>&1 && break; sleep 10; done
          - systemctl is-enabled mysqld >/dev/null 2>&1 || { echo 'MySQL 설치가 끝나지 않음'; exit 1; }
          - if [ -f /etc/my.cnf.rpmnew ] && ! grep -q '^\[mysqld\]' /etc/my.cnf; then cp /etc/my.cnf.rpmnew /etc/my.cnf; rm -f /etc/my.cnf.rpmnew; changed=1; fi
          - grep -q '^!includedir /etc/my.cnf.d' /etc/my.cnf || { echo '!includedir /etc/my.cnf.d' >> /etc/my.cnf; changed=1; }
          - printf '[mysqld]\nserver_id=2\nlog_replica_updates=ON\nskip_replica_start=ON\nrelay_log_recovery=ON\n' > /tmp/zz-replica.cnf
          - cmp -s /tmp/zz-replica.cnf /etc/my.cnf.d/zz-replica.cnf || { mv /tmp/zz-replica.cnf /etc/my.cnf.d/zz-replica.cnf; changed=1; }
          - if [ -n "$changed" ]; then systemctl restart mysqld; fi

  # BE가 쓰는 앱 DB 계정. 비밀번호는 SSM에서 서버 안에서 읽어 명령 기록에 남지 않음. 비밀번호를 바꾸면 이 Association을 다시 실행
  # root는 sudo 접속(auth_socket)으로 바꿔 둔 상태를 전제로 함 (2026-10-19 수동 적용)
  DbAppUserAssociation:
    Type: AWS::SSM::Association
    DependsOn: DbConfigAssociation
    Properties:
      AssociationName: dameokja-prod-db-app-user
      Name: AWS-RunShellScript
      Targets:
        - { Key: InstanceIds, Values: [!Ref DbInstance] }
      Parameters:
        commands:
          - set -e
          - for i in $(seq 1 90); do mysql -uroot -e 'SELECT 1' >/dev/null 2>&1 && break; sleep 10; done
          - !Sub PW=$(aws ssm get-parameter --region ${AWS::Region} --name /dameokja-v2-prod/SPRING_DATASOURCE_PASSWORD --with-decryption --query Parameter.Value --output text)
          - mysql -uroot -e "CREATE DATABASE IF NOT EXISTS app DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_as_cs; CREATE USER IF NOT EXISTS 'dameokja'@'10.20.32.0/255.255.224.0' IDENTIFIED BY '$PW'; ALTER USER 'dameokja'@'10.20.32.0/255.255.224.0' IDENTIFIED BY '$PW'; GRANT ALL PRIVILEGES ON app.* TO 'dameokja'@'10.20.32.0/255.255.224.0';"

  # AI용 PostgreSQL 16을 MySQL과 같은 DB 서버에 둠 (dev는 AI 서버에 직접 설치). 메모리 상한 shared_buffers 512MB
  # 계정 비밀번호는 SSM /dameokja-v2-prod-ai/POSTGRES_PASSWORD를 서버 안에서 읽음(명령 기록에 남기지 않음). 스키마·기준 데이터는 dev에서 따로 옮김
  DbPostgresAssociation:
    Type: AWS::SSM::Association
    DependsOn: DbConfigAssociation
    Properties:
      AssociationName: dameokja-prod-db-postgres
      Name: AWS-RunShellScript
      Targets:
        - { Key: InstanceIds, Values: [!Ref DbInstance] }
      Parameters:
        executionTimeout: ["1800"]
        commands:
          - set -e; changed=
          - for i in $(seq 1 90); do systemctl is-enabled mysqld >/dev/null 2>&1 && break; sleep 10; done
          - rpm -q postgresql16-server >/dev/null 2>&1 || dnf install -y postgresql16-server postgresql16-contrib
          - D=/var/lib/pgsql/data; [ -f $D/PG_VERSION ] || postgresql-setup --initdb
          - echo "listen_addresses = '*'" > /tmp/dameokja.conf; echo "shared_buffers = 512MB" >> /tmp/dameokja.conf; echo "password_encryption = scram-sha-256" >> /tmp/dameokja.conf
          - mkdir -p $D/conf.d && chown postgres:postgres $D/conf.d; grep -q "^include_dir = 'conf.d'" $D/postgresql.conf || { echo "include_dir = 'conf.d'" >> $D/postgresql.conf; changed=1; }
          - cmp -s /tmp/dameokja.conf $D/conf.d/dameokja.conf || { install -o postgres -g postgres -m 600 /tmp/dameokja.conf $D/conf.d/dameokja.conf; changed=1; }
          - !Sub "grep -q '^host receipt_ai receipt_ai ${PrivateSubnetACidr} scram-sha-256' $D/pg_hba.conf || { echo 'host receipt_ai receipt_ai ${PrivateSubnetACidr} scram-sha-256' >> $D/pg_hba.conf; changed=1; }"
          - systemctl enable postgresql; if systemctl is-active -q postgresql; then [ -z "$changed" ] || systemctl restart postgresql; else systemctl start postgresql; fi
          - !Sub "PW=$(aws ssm get-parameter --region ${AWS::Region} --name /dameokja-v2-prod-ai/POSTGRES_PASSWORD --with-decryption --query Parameter.Value --output text)"
          - sudo -u postgres psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='receipt_ai'" | grep -q 1 || sudo -u postgres psql -c "CREATE ROLE receipt_ai LOGIN"
          - echo "ALTER ROLE receipt_ai PASSWORD :'pw';" | sudo -u postgres psql -v ON_ERROR_STOP=1 -v pw="$PW" >/dev/null
          - sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='receipt_ai'" | grep -q 1 || sudo -u postgres createdb -O receipt_ai receipt_ai
          - sudo -u postgres psql -d receipt_ai -c "CREATE EXTENSION IF NOT EXISTS pg_trgm"

  # --- ECS 클러스터 + ASG(private 2b) + Capacity Provider
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: dameokja-prod

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  # 새 인스턴스는 처음 부팅 때 클러스터 등록과 KST 설정. 템플릿을 바꾸면 이후 새로 뜨는 인스턴스부터 적용
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: dameokja-prod
      LaunchTemplateData:
        ImageId: !Ref AmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile: { Arn: !GetAtt InstanceProfile.Arn }
        SecurityGroupIds: [!Ref InstanceSecurityGroup]
        MetadataOptions: { HttpTokens: required }
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - { Key: Name, Value: dameokja-prod }
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            echo "ECS_CLUSTER=${Cluster}" >> /etc/ecs/ecs.config
            timedatectl set-timezone Asia/Seoul

  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: dameokja-prod
      VPCZoneIdentifier: [!Ref PrivateSubnetA]
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      MinSize: !Ref MinSize
      MaxSize: !Ref MaxSize

  # Task를 올릴 자리가 모자라면 ECS가 ASG 인스턴스 수를 늘리고, 남으면 줄임 (min~max 안에서)
  CapacityProvider:
    Type: AWS::ECS::CapacityProvider
    Properties:
      AutoScalingGroupProvider:
        AutoScalingGroupArn: !Ref AutoScalingGroup
        ManagedScaling:
          Status: ENABLED
          TargetCapacity: 100
        ManagedTerminationProtection: DISABLED

  ClusterCapacityProviders:
    Type: AWS::ECS::ClusterCapacityProviderAssociations
    Properties:
      Cluster: !Ref Cluster
      CapacityProviders: [!Ref CapacityProvider]
      DefaultCapacityProviderStrategy:
        - { CapacityProvider: !Ref CapacityProvider, Weight: 1 }

  # --- BE가 AI를 찾는 내부 주소: ai.prod.dameokja.internal (AI Task가 뜨면 IP가 등록됨)
  PrivateNamespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: prod.dameokja.internal
      Vpc: !Ref Vpc

  AiDiscoveryService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: ai
      NamespaceId: !Ref PrivateNamespace
      DnsConfig:
        RoutingPolicy: MULTIVALUE
        DnsRecords:
          - { Type: A, TTL: 10 }
      HealthCheckCustomConfig:
        FailureThreshold: 1

  # --- 스택이 정하는 설정값. 콘솔에서 바꾸면 다음 배포 때 덮어씀
  RedisHostParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /dameokja-v2-prod/SPRING_DATA_REDIS_HOST
      Type: String
      Value: !GetAtt RedisInstance.PrivateIp

  RedisPortParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /dameokja-v2-prod/SPRING_DATA_REDIS_PORT
      Type: String
      Value: "6379"

  AiBaseUrlParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /dameokja-v2-prod/AI_BASE_URL
      Type: String
      Value: http://ai.prod.dameokja.internal:8000

  # nginx 설정. ALB가 TLS를 끝내고 80으로 넘겨줌. awsvpc라 같은 Task의 FE·BE는 127.0.0.1
  NginxConfParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /dameokja-v2-prod/nginx/default.conf
      Type: String
      Value: |
        map $http_upgrade $connection_upgrade {
            default upgrade;
            '' close;
        }

        # SLI 집계용 API 분류 (dev와 같음)
        map "$request_method $uri" $slo_route {
            default "-";
            "~^POST /api/v1/refrigerators/[^/]+/ingredients$" ingredient_create;
            "~^GET /api/v1/refrigerators/[^/]+/ingredients$" ingredient_read;
            "~^GET /api/v1/ingredients/[^/]+$" ingredient_read;
            "~^GET /api/v1/refrigerators/[^/]+/notifications(/stream|/unread-count)?$" notification_poll;
            "~^POST /api/v1/ingredients/[^/]+$" aux_consume;
            "~^POST /api/v1/push-subscriptions$" aux_push_subscribe;
        }

        log_format slo_json escape=json '{"time":"$time_iso8601","method":"$request_method",'
            '"uri":"$uri","status":$status,"route":"$slo_route","request_time":$request_time,'
            '"upstream_status":"$upstream_status","upstream_time":"$upstream_response_time",'
            '"bytes":$body_bytes_sent}';

        server {
            listen 80;
            server_name _;

            # ALB가 붙여 준 X-Forwarded-For에서 실제 사용자 IP를 꺼냄
            set_real_ip_from 10.20.0.0/16;
            real_ip_header X-Forwarded-For;

            # 컨테이너 표준 출력 -> CloudWatch Logs
            access_log /var/log/nginx/access.log slo_json;

            location = /nginx-health {
                access_log off;
                default_type text/plain;
                return 200 "ok\n";
            }

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;

            location ~ ^/(swagger-ui(?:/|$)|swagger-ui\.html$|v3/api-docs(?:\.yaml$|/|$)) {
                proxy_pass http://127.0.0.1:8080;
            }

            location ~ ^/api(?:/|$) {
                proxy_pass http://127.0.0.1:8080;
            }

            location / {
                proxy_pass http://127.0.0.1:3000;
            }
        }

  # --- 컨테이너 로그 (awslogs). 서비스마다 로그 그룹 하나
  # /dameokja/prod/*는 v1 prod(CloudWatch Agent)가 이미 쓰고 있어 v2 prod는 /dameokja/v2-prod/*
  NginxLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /dameokja/v2-prod/nginx
      RetentionInDays: 30

  FrontendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /dameokja/v2-prod/frontend
      RetentionInDays: 30

  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /dameokja/v2-prod/backend
      RetentionInDays: 30

  AiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /dameokja/v2-prod/ai
      RetentionInDays: 30

  # BE 연결 풀(HikariCP) 지표 수집용 CloudWatch Agent 사이드카 설정 (ecs/prod/app.json의 cloudwatch-agent 컨테이너가 읽음)
  # dev는 EC2 Agent(dev.yaml CloudWatchAgentAssociation)로 같은 지표를 이미 수집함
  PrometheusLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /dameokja/v2-prod/prometheus
      RetentionInDays: 30

  CloudWatchAgentConfigParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /dameokja-v2-prod/cloudwatch-agent/config
      Type: String
      Value: '{"agent":{"metrics_collection_interval":60,"omit_hostname":true,"region":"ap-northeast-2"},"logs":{"metrics_collected":{"prometheus":{"log_group_name":"/dameokja/v2-prod/prometheus","prometheus_config_path":"env:PROMETHEUS_CONFIG_CONTENT","emf_processor":{"metric_declaration_dedup":true,"metric_namespace":"Dameokja/v2-prod/App","metric_declaration":[{"source_labels":["job"],"label_matcher":"^dameokja-backend$","dimensions":[["env"]],"metric_selectors":["^hikaricp_connections_(active|idle|pending|max)$","^hikaricp_connections_timeout_total$"]}]}}}}}'

  PrometheusScrapeConfigParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /dameokja-v2-prod/cloudwatch-agent/prometheus
      Type: String
      Value: |
        global:
          scrape_interval: 1m
          scrape_timeout: 10s
        scrape_configs:
          - job_name: dameokja-backend
            metrics_path: /actuator/prometheus
            sample_limit: 10000
            static_configs:
              - targets: ["127.0.0.1:8080"]
                labels:
                  env: prod
            metric_relabel_configs:
              - source_labels: [__name__]
                regex: "hikaricp_connections.*"
                action: keep

  # AI 지표(RunPod 처리·LLM·FastAPI 프로세스) 수집용 CloudWatch Agent 사이드카 설정 (ecs/prod/ai.json의 cloudwatch-agent 컨테이너가 읽음, #137)
  # AI /metrics는 루프백 요청이면 내부 API 키 없이 열림(AI 저장소). 로그 그룹은 BE 사이드카와 같은 PrometheusLogGroup
  AiCloudWatchAgentConfigParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /dameokja-v2-prod-ai/cloudwatch-agent/config
      Type: String
      Value: '{"agent":{"metrics_collection_interval":60,"omit_hostname":true,"region":"ap-northeast-2"},"logs":{"metrics_collected":{"prometheus":{"log_group_name":"/dameokja/v2-prod/prometheus","prometheus_config_path":"env:PROMETHEUS_CONFIG_CONTENT","emf_processor":{"metric_declaration_dedup":true,"metric_namespace":"Dameokja/v2-prod/Ai","metric_declaration":[{"source_labels":["job"],"label_matcher":"^dameokja-ai$","dimensions":[["env"]],"metric_selectors":["^process_(cpu_seconds_total|resident_memory_bytes)$","^dameokja_analysis_(queue_size|active)$","^dameokja_remote_llm_model_load_seconds_(sum|count)$"]},{"source_labels":["job","stage"],"label_matcher":"^dameokja-ai;(worker_total|worker_queue_wait|ocr|llm)$","dimensions":[["env","stage"]],"metric_selectors":["^dameokja_remote_worker_stage_seconds_(sum|count)$"]},{"source_labels":["job","type"],"label_matcher":"^dameokja-ai;(prompt|completion)$","dimensions":[["env","type"]],"metric_selectors":["^dameokja_remote_llm_tokens_total$","^dameokja_remote_llm_tokens_per_second_(sum|count)$"]}]}}}}}'

  AiPrometheusScrapeConfigParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /dameokja-v2-prod-ai/cloudwatch-agent/prometheus
      Type: String
      Value: |
        global:
          scrape_interval: 1m
          scrape_timeout: 10s
        scrape_configs:
          - job_name: dameokja-ai
            metrics_path: /metrics
            static_configs:
              - targets: ["127.0.0.1:8000"]
                labels:
                  env: prod
            metric_relabel_configs:
              - source_labels: [__name__]
                regex: "process_(cpu_seconds_total|resident_memory_bytes)|dameokja_analysis_(queue_size|active)|dameokja_remote_worker_stage_seconds_(sum|count)|dameokja_remote_llm_(tokens_total|tokens_per_second_(sum|count)|model_load_seconds_(sum|count))"
                action: keep

  # --- IAM
  # ECS 에이전트가 이미지 받기(GHCR 토큰)와 SSM 값 읽기에 쓰는 역할
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dameokja-prod-ecs-task-execution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-app-config
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameters
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/dameokja-v2-prod/*"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/dameokja-v2-prod-fe/*"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/dameokja-v2-prod-ai/*"
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref GhcrCredentialsArn

  # BE 컨테이너: 이미지 버킷의 prod 업로드 경로만
  BackendTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dameokja-prod-backend-task
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: profile-images
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub "arn:aws:s3:::${S3BucketName}/${S3UploadPrefix}*"
              # 프로필 기본 이미지 한 파일만 읽기
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${S3BucketName}/profiles/default.png"
        # 같은 Task의 CloudWatch Agent 사이드카가 연결 풀 지표를 EMF 로그로 보냄
        - PolicyName: prometheus-emf
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams]
                Resource: !Sub "${PrometheusLogGroup.Arn}"
              - Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"
              # Agent가 시작할 때 인스턴스 태그·볼륨을 조회함. 없으면 설정 변환이 실패하고 종료됨 (2026-10-20 확인)
              - Effect: Allow
                Action: [ec2:DescribeTags, ec2:DescribeVolumes]
                Resource: "*"

  # AI 서버: BE가 올린 이미지 읽기
  AiTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dameokja-prod-ai-task
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: read-images
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${S3BucketName}/${S3UploadPrefix}*"
        # 같은 Task의 CloudWatch Agent 사이드카가 AI 지표를 EMF 로그로 보냄 (BackendTaskRole prometheus-emf와 같음, #137)
        - PolicyName: prometheus-emf
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams]
                Resource: !Sub "${PrometheusLogGroup.Arn}"
              - Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"
              - Effect: Allow
                Action: [ec2:DescribeTags, ec2:DescribeVolumes]
                Resource: "*"

  # ECS Native Blue/Green이 배포 중 리스너 규칙·타겟 그룹을 바꿀 때 쓰는 역할
  EcsInfrastructureRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dameokja-prod-ecs-infrastructure
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonECSInfrastructureRolePolicyForLoadBalancers

  # CLOUD prod 승인 job(prod-approval.yml)이 prod Task Definition 등록과 Service 갱신에 쓰는 역할
  GitHubEcsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dameokja-prod-github-ecs-deploy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # prod는 CLOUD prod-approval.yml의 GitHub Environments "prod" 승인 job만. FE·BE·AI main이 직접 바꾸지 못하게 함
                token.actions.githubusercontent.com:sub: repo:100-hours-a-week@167328634/KTB4-5th-CLOUD@1349507673:environment:prod
      Policies:
        - PolicyName: ecs-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ecs:RegisterTaskDefinition, ecs:DescribeTaskDefinition]
                Resource: "*"
              - Effect: Allow
                Action: [ecs:UpdateService, ecs:DescribeServices]
                Resource: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/${Cluster}/*"
              - Effect: Allow
                Action: [ecs:DescribeServiceDeployments, ecs:ListServiceDeployments]
                Resource: "*"
              - Effect: Allow
                Action: iam:PassRole
                Resource: [!GetAtt TaskExecutionRole.Arn, !GetAtt BackendTaskRole.Arn, !GetAtt AiTaskRole.Arn]

  # CLOUD prod-dns-weight.yml(승인 job)이 dameokja.com A 레코드의 v1·v2 가중치만 바꾸는 역할
  GitHubDnsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dameokja-prod-github-dns
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:100-hours-a-week@167328634/KTB4-5th-CLOUD@1349507673:environment:prod
      Policies:
        - PolicyName: apex-weight
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: route53:ChangeResourceRecordSets
                Resource: !Sub "arn:aws:route53:::hostedzone/${HostedZoneId}"
                Condition:
                  ForAllValues:StringEquals:
                    route53:ChangeResourceRecordSetsNormalizedRecordNames: [dameokja.com]
                    route53:ChangeResourceRecordSetsRecordTypes: [A]
              - Effect: Allow
                Action: route53:ListResourceRecordSets
                Resource: !Sub "arn:aws:route53:::hostedzone/${HostedZoneId}"
              - Effect: Allow
                Action: route53:GetChange
                Resource: arn:aws:route53:::change/*
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Ref AWS::StackId

  # 팀원(IAM 그룹 dameokja-iam)이 prod 설정값(SSM)을 관리하고, prod 인스턴스에 Session Manager로 접속
  TeamSsmAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: dameokja-v2-prod-ssm-team
      Groups: [dameokja-iam]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:GetParametersByPath
              - ssm:GetParameterHistory
              - ssm:PutParameter
              - ssm:DeleteParameter
              - ssm:DeleteParameters
              - ssm:AddTagsToResource
              - ssm:ListTagsForResource
            Resource:
              - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/dameokja-v2-prod/*"
              - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/dameokja-v2-prod-*"
          # ASG가 인스턴스를 바꾸므로 ID 대신 Name 태그로 허용 (앱 dameokja-prod, DB dameokja-prod-db)
          - Effect: Allow
            Action: ssm:StartSession
            Resource: !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
            Condition:
              StringLike:
                ssm:resourceTag/Name: dameokja-prod*

  # 팀원이 프로젝트 로그를 콘솔·Logs Insights에서 분석하도록 허용한다. 로그 변경·삭제 권한은 포함하지 않는다.
  TeamLogsInsightsAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: dameokja-team-logs-insights
      Groups: [dameokja-iam]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # dev·stage·v1/v2 prod 및 프로젝트 알림 Lambda 로그만 쿼리 대상으로 허용한다.
          - Sid: QueryProjectLogGroups
            Effect: Allow
            Action:
              - logs:StartQuery
              - logs:GetLogGroupFields
              - logs:GetQueryResults
              - logs:GetLogRecord
            Resource:
              - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/dameokja/*"
              - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/dameokja-*"
          # 쿼리 결과·목록과 콘솔 선택기에 사용하는 조회는 개별 로그 그룹으로 범위를 지정할 수 없다.
          - Sid: ReadQueryResultsAndConsoleMetadata
            Effect: Allow
            Action:
              - logs:StopQuery
              - logs:DescribeFieldIndexes
              - logs:DescribeQueries
              - logs:DescribeQueryDefinitions
              - logs:DescribeLookupTables
              - logs:ListAggregateLogGroupSummaries
              - oam:ListSinks
              - tag:GetResources
            Resource: "*"

  # --- ECS Service. Task Definition은 infra/v2/ecs/prod/*.json (ecs-deploy.yml이 등록). family만 적어 최신 버전을 씀
  # nginx+FE+BE. ECS Native Blue/Green: 새 버전을 green 타겟 그룹에 띄우고 헬스체크 통과 후 리스너 규칙을 green으로 전환,
  # 대기(Bake) 시간 동안 문제가 생기면 blue로 되돌림
  AppService:
    Type: AWS::ECS::Service
    DependsOn: ClusterCapacityProviders
    Properties:
      ServiceName: dameokja-prod-app
      Cluster: !Ref Cluster
      TaskDefinition: dameokja-prod-app
      DesiredCount: 2
      CapacityProviderStrategy:
        - { CapacityProvider: !Ref CapacityProvider, Weight: 1 }
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: [!Ref PrivateSubnetA]
          SecurityGroups: [!Ref AppSecurityGroup]
      HealthCheckGracePeriodSeconds: 300
      LoadBalancers:
        - ContainerName: nginx
          ContainerPort: 80
          TargetGroupArn: !Ref TargetGroupBlue
          AdvancedConfiguration:
            AlternateTargetGroupArn: !Ref TargetGroupGreen
            ProductionListenerRule: !Ref ProductionListenerRule
            RoleArn: !GetAtt EcsInfrastructureRole.Arn
      DeploymentConfiguration:
        Strategy: BLUE_GREEN
        BakeTimeInMinutes: 5
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }

  # AI API. BE는 ai.prod.dameokja.internal:8000으로 호출 (Cloud Map에 Task IP 등록)
  AiService:
    Type: AWS::ECS::Service
    DependsOn: ClusterCapacityProviders
    Properties:
      ServiceName: dameokja-prod-ai
      Cluster: !Ref Cluster
      TaskDefinition: dameokja-prod-ai
      DesiredCount: 1
      CapacityProviderStrategy:
        - { CapacityProvider: !Ref CapacityProvider, Weight: 1 }
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: [!Ref PrivateSubnetA]
          SecurityGroups: [!Ref AiSecurityGroup]
      ServiceRegistries:
        - RegistryArn: !GetAtt AiDiscoveryService.Arn
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }

  # 앱 Task 수 자동 조정 (Target Tracking, v2 20번). Task가 늘어 자리가 모자라면 Capacity Provider가 인스턴스를 늘림
  AppScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub "service/${Cluster}/${AppService.Name}"
      MinCapacity: 2
      MaxCapacity: 4

  AppCpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: dameokja-prod-app-cpu
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref AppScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 60
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization

Outputs:
  VpcId:
    Value: !Ref Vpc
  ClusterName:
    Value: !Ref Cluster
  AlbDnsName:
    Value: !GetAtt Alb.DNSName
  AlbHostedZoneId:
    Value: !GetAtt Alb.CanonicalHostedZoneID
  TargetGroupBlueArn:
    Value: !Ref TargetGroupBlue
  TargetGroupGreenArn:
    Value: !Ref TargetGroupGreen
  ProductionListenerRuleArn:
    Value: !Ref ProductionListenerRule
  PrivateSubnetA:
    Value: !Ref PrivateSubnetA
  PrivateSubnetB:
    Value: !Ref PrivateSubnetB
  AppSecurityGroupId:
    Value: !Ref AppSecurityGroup
  AiSecurityGroupId:
    Value: !Ref AiSecurityGroup
  RedisPrivateIp:
    Value: !GetAtt RedisInstance.PrivateIp
  DbInstanceId:
    Value: !Ref DbInstance
  DbPrivateIp:
    Value: !GetAtt DbInstance.PrivateIp
