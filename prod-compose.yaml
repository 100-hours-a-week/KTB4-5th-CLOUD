services:
  nginx:
    image: nginx:stable
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 운영 도메인과 운영 인증서 설정만 마운트한다.
      - ./nginx-prod:/etc/nginx/conf.d:ro
      - ${CERTBOT_WEBROOT:-./certbot/www}:/var/www/certbot:ro
      - ${LETSENCRYPT_DIR:-./certbot/conf}:/etc/letsencrypt:ro
    networks: [web]
    logging:
      driver: local

  frontend:
    profiles: [app]
    image: ${FE_IMAGE:?Set FE_IMAGE in .env}
    restart: unless-stopped
    env_file:
      - path: ./env/frontend.env
        required: false
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks: [web]
    logging:
      driver: local

  backend:
    profiles: [app]
    image: ${BE_IMAGE:?Set BE_IMAGE in .env}
    restart: unless-stopped
    env_file:
      # 운영 백엔드와 외부 DB 연결 설정은 BE 저장소의 APP_ENV에서 함께 관리한다.
      - path: ./env/backend.env
        required: false
    environment:
      # 개발 MySQL 초기화 전용 값은 운영 백엔드 컨테이너에 전달하지 않는다.
      MYSQL_DATABASE: ""
      MYSQL_USER: ""
      MYSQL_PASSWORD: ""
      MYSQL_ROOT_PASSWORD: ""
    expose: ["8080"]
    # 현재 앱에 전용 헬스 API가 없어 Swagger 명세 응답으로 기동 상태를 확인한다.
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8080/v3/api-docs"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 3
    networks: [web]
    logging:
      driver: local

  certbot:
    image: certbot/certbot:latest
    profiles: [tools]
    volumes:
      - ${CERTBOT_WEBROOT:-./certbot/www}:/var/www/certbot
      - ${LETSENCRYPT_DIR:-./certbot/conf}:/etc/letsencrypt

networks:
  web:
