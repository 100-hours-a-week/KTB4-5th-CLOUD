services:
  nginx:
    image: nginx:stable
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 운영 도메인과 운영 인증서 설정만 마운트한다.
      - ./nginx:/etc/nginx/conf.d:ro
      - ${CERTBOT_WEBROOT:-./certbot/www}:/var/www/certbot:ro
      - ${LETSENCRYPT_DIR:-./certbot/conf}:/etc/letsencrypt:ro
      - /etc/localtime:/etc/localtime:ro
      # SLI용 JSON 접근 로그를 CloudWatch Agent가 읽도록 호스트에 남긴다.
      - /var/log/dameokja/nginx:/var/log/nginx/app
    networks: [web]
    logging:
      driver: local

  frontend:
    profiles: [app]
    # 첫 배포 전에는 자리표시자를 사용하고, FE 배포 시 실제 digest로 교체한다.
    image: ${FE_IMAGE:-ghcr.io/100-hours-a-week/ktb4-5th-fe:not-deployed}
    restart: unless-stopped
    env_file:
      - path: ./env/frontend.env
        required: false
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks: [web]
    logging:
      driver: local

  backend:
    profiles: [app]
    # 첫 배포 전에는 자리표시자를 사용하고, BE 배포 시 실제 digest로 교체한다.
    image: ${BE_IMAGE:-ghcr.io/100-hours-a-week/ktb4-5th-be:not-deployed}
    restart: unless-stopped
    env_file:
      # 운영 백엔드와 외부 DB 연결 설정은 BE 저장소의 APP_ENV에서 함께 관리한다.
      - path: ./env/backend.env
        required: false
    environment:
      # Tomcat 스레드 풀 지표(tomcat_threads_*)를 Actuator에 노출한다. application.yml의 server.tomcat.mbeanregistry.enabled와 같다.
      SERVER_TOMCAT_MBEANREGISTRY_ENABLED: "true"
    expose: ["8080"]
    # CloudWatch Agent가 /actuator/prometheus를 읽도록 서버 내부(127.0.0.1)에만 연다. 외부에서는 접근 불가.
    ports: ["127.0.0.1:8080:8080"]
    # Spring Boot Actuator 헬스 엔드포인트로 기동 상태를 확인한다.
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 3
    networks: [web]
    logging:
      driver: local
    volumes:
      - /app/sentry-opentelemetry-agent-8.58.0.jar:/app/sentry-opentelemetry-agent-8.58.0.jar:ro
      - /etc/localtime:/etc/localtime:ro
      # BE가 application.yml의 logging.file.name(/var/log/dameokja/backend.log)에 쓰는 로그를 호스트에 남긴다.
      # 호스트 폴더 권한이 적용되므로 소유자를 uid 10001로 맞춰야 한다(setup-host.sh).
      - /var/log/dameokja:/var/log/dameokja

  certbot:
    image: certbot/certbot:latest
    profiles: [tools]
    volumes:
      - ${CERTBOT_WEBROOT:-./certbot/www}:/var/www/certbot
      - ${LETSENCRYPT_DIR:-./certbot/conf}:/etc/letsencrypt

networks:
  web:
